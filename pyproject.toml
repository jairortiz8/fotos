[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Metadata
# ============================================================================
[project]
name = "runfoto"
version = "0.0.1"
description = "Plataforma web gratuita de fotos de carreras deportivas."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Jair Ortiz" }]
keywords = ["django", "running", "photos", "ocr", "face-recognition"]

dependencies = [
    # --- Web framework ---
    "Django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "django-htmx>=1.19",
    "django-tailwind[reload]>=3.8",
    "django-ratelimit>=4.1",
    "django-environ>=0.11",
    "whitenoise[brotli]>=6.7",
    # --- DB / cache / queue ---
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "hiredis>=3.0",
    "celery[redis]>=5.4",
    "pgvector>=0.3",
    # --- Storage ---
    "boto3>=1.34",
    # --- Imágenes ---
    "pillow>=10.4",
    # --- Server / ops ---
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.0",
]

[project.optional-dependencies]
dev = [
    # --- Tests ---
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    # --- Lint / format / typing ---
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    # --- Workflow ---
    "pre-commit>=3.8",
    "django-debug-toolbar>=4.4",
]

[project.urls]
Repository = "https://github.com/jairortiz8/fotos"

# ============================================================================
# Paquetes que setuptools tiene que descubrir
# ============================================================================
[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
exclude = ["tests*", "reference*", "docs*", "static*", "templates*", "theme*"]

# ============================================================================
# Ruff — linter + formatter
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*/migrations/*",
    "reference/*",
    ".venv/*",
    "theme/static_src/*",
    "staticfiles/*",
]

[tool.ruff.lint]
# Conservador en Fase 0 — ampliamos cuando aparezca código de negocio real.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line-length lo maneja el formatter
    "B008",  # ya no aplica a Django defaults
    "RUF012", # mutable class attrs son la norma en Django Meta
]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F405", "F403"]  # star-imports son la norma en settings
"tests/**" = ["S101", "S105", "S106"]  # asserts y "passwords" hardcodeados OK en tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================================
# Black — formato; se mantiene compatible con ruff format
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  /(
      \.venv
    | migrations
    | reference
    | staticfiles
    | theme/static_src
  )/
)
'''

# ============================================================================
# Mypy — strict en código de negocio, permisivo en migrations
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = false  # Fase 0 — código de negocio aún no existe
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    "^reference/",
    "^theme/static_src/",
    "^staticfiles/",
    "/migrations/",
    "^\\.venv/",
]

[[tool.mypy.overrides]]
module = ["*.migrations.*", "tests.*", "conftest"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "factory.*",
    "factory_boy.*",
    "celery.*",
    "boto3.*",
    "botocore.*",
    "pgvector.*",
    "environ.*",
    "ratelimit.*",
    "debug_toolbar.*",
    "django_htmx.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "apps"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--reuse-db",
]
markers = [
    "slow: tests que tardan (no se corren por default)",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
precision = 1
skip_covered = false
