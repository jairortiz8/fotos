name: worker-logs (one-off)

# Trae los logs de runtime de `worker` y `worker_fast` + la longitud de la cola
# `fast` en Redis (para ver si el worker está trabado o si worker_fast está caído).

on:
  workflow_dispatch:
  push:
    branches: ["run-wlogs"]

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: Instalar redis
        run: python3 -m pip install --quiet "redis==5.2.1"

      - name: Logs de workers + cola fast
        run: |
          set -uo pipefail
          gql() {
            curl -sS "$API" \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" --data "$1"
          }
          vars_of() {
            local q='{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}'
            gql "$q" | jq '.data.variables // {}'
          }

          echo "==================== DEPLOYS ===================="
          Q='{"query":"query($p:String!,$e:String!){ deployments(first:80, input:{projectId:$p, environmentId:$e}){ edges { node { id status createdAt service { name } } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}'
          gql "$Q" > /tmp/deploys.json
          jq -r '[.data.deployments.edges[].node] | group_by(.service.name) | map(sort_by(.createdAt)|last) | .[] | "\(.service.name)\t\(.status)\t\(.id)"' /tmp/deploys.json
          echo

          for SVC in worker worker_fast; do
            echo "==================== LOGS: $SVC ===================="
            DID=$(jq -r --arg s "$SVC" '[.data.deployments.edges[].node | select(.service.name==$s)] | sort_by(.createdAt) | last | .id // empty' /tmp/deploys.json)
            if [ -z "$DID" ]; then echo "(sin deployment)"; continue; fi
            echo "deploymentId=$DID"
            LQ='{"query":"query($d:String!){ deploymentLogs(deploymentId:$d, limit:150){ message severity } }","variables":{"d":"'"$DID"'"}}'
            gql "$LQ" | jq -r 'if .errors then ("ERR: "+(.errors|tostring)) else (.data.deploymentLogs[]?.message) end' | tail -70
            echo
          done

          echo "==================== COLA fast (Redis) ===================="
          # Reconstruir broker público (authority del proxy + DB del broker real).
          SVCS=$(jq -r '.data.deployments.edges[].node.service.name' /tmp/deploys.json | sort -u)
          RID=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' | jq -r '.data.project.services.edges[].node | select(.name=="Redis") | .id')
          FID=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' | jq -r '.data.project.services.edges[].node | select(.name=="fotos") | .id')
          RDPUB=$(vars_of "$RID" | jq -r '.REDIS_PUBLIC_URL // empty')
          CBURL=$(vars_of "$FID" | jq -r '.CELERY_BROKER_URL // empty')
          if [ -n "$RDPUB" ]; then
            SCHEME="${RDPUB%%://*}"; REST="${RDPUB#*://}"; AUTH="${REST%%/*}"
            DBIDX=$(printf '%s' "$CBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$DBIDX" ] && DBIDX=0
            BROKER="${SCHEME}://${AUTH}/${DBIDX}"
            BROKER="$BROKER" python3 - <<'PY'
          import os, redis
          r = redis.Redis.from_url(os.environ["BROKER"])
          for k in ("fast", "faces", "celery"):
              try:
                  print(f"  LLEN {k} = {r.llen(k)}")
              except Exception as e:
                  print(f"  {k}: error {e}")
          # keys que empiezan con las colas (por si hay prioridades)
          try:
              ks = [x.decode() for x in r.keys("fast*")] + [x.decode() for x in r.keys("faces*")]
              print("  keys fast*/faces*:", ks)
          except Exception as e:
              print("  keys error:", e)
          PY
          else
            echo "(sin REDIS_PUBLIC_URL)"
          fi
          echo "==================== FIN ===================="
