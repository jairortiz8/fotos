name: medir-r2 (one-off, solo lectura)
on:
  workflow_dispatch:
  push:
    branches: ["run-medir-r2"]
concurrency:
  group: medir-r2
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, requests, psycopg, pathlib, ipaddress
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          def tipo(ip):
              if not ip: return "vacia"
              try: a=ipaddress.ip_address(str(ip))
              except ValueError: return "invalida"
              if a in ipaddress.ip_network("100.64.0.0/10"): return "PROXY railway (100.64/10)"
              return "privada" if a.is_private else "PUBLICA (cliente real)"
          L=["El deploy con get_client_ip = ULTIMO salto de XFF salio el 2026-09-17 ~04:40 UTC (commit 8b0a21d) y se re-desplego el 26.",""]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              for antes, cond in (("DESPUES del 17-09 04:40", "last_used_at >= '2026-09-17 04:45+00'"), ("ANTES", "last_used_at < '2026-09-17 04:39+00'")):
                  cur.execute(f"SELECT last_used_ip FROM photographers_photographerlink WHERE last_used_ip IS NOT NULL AND {cond}")
                  filas=[r[0] for r in cur.fetchall()]
                  from collections import Counter
                  L.append(f"links de fotografo usados {antes}: {len(filas)} -> {dict(Counter(tipo(x) for x in filas))}")
              for antes, cond in (("DESPUES del 17-09 04:40", "created_at >= '2026-09-17 04:45+00'"), ("ANTES (ultimos 30d)", "created_at < '2026-09-17 04:39+00' AND created_at > '2026-08-17'")):
                  cur.execute(f"SELECT ip_address FROM core_auditlog WHERE ip_address IS NOT NULL AND {cond}")
                  filas=[r[0] for r in cur.fetchall()]
                  from collections import Counter
                  L.append(f"audit log con IP {antes}: {len(filas)} -> {dict(Counter(tipo(x) for x in filas))}")
              cur.execute("SELECT action, count(*) FROM core_auditlog WHERE created_at >= '2026-09-17 04:45+00' GROUP BY 1 ORDER BY 2 DESC LIMIT 8")
              L.append("acciones del audit log desde el 17-09: " + ", ".join(f"{a}={c}" for a,c in cur.fetchall()))
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/medicion4.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/medicion4.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-medir4
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-medir4
