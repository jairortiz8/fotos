name: medir-r2 (one-off, solo lectura)
on:
  workflow_dispatch:
  push:
    branches: ["run-medir-r2"]
concurrency:
  group: medir-r2
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, requests, psycopg, boto3, urllib.parse as up, pathlib
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(sid):
              r=requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},timeout=40).json()
              return (r.get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); web=vars_de(os.environ["WEB_ID"])
          L=[]
          host = up.urlparse(web.get("R2_ENDPOINT_URL","")).hostname or "(default AWS)"
          L.append("R2 endpoint: *." + ".".join(host.split(".")[-3:]))
          L.append(f"FACE_SEARCH_ENABLED(web)={web.get('FACE_SEARCH_ENABLED')} PHOTO_DOWNLOAD_*={[k for k in web if 'DOWNLOAD' in k]}")

          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              L.append("\n== descargas por dia (EventMetric, septiembre) ==")
              cur.execute("""SELECT to_char(date_trunc('day', bucket),'MM-DD'), sum(count)
                             FROM events_eventmetric WHERE metric='download' AND bucket >= '2026-09-01'
                             GROUP BY 1 ORDER BY 1""")
              tot=0
              for d,c in cur.fetchall():
                  tot+=c; L.append(f"{d}  {c}")
              L.append(f"TOTAL descargas septiembre: {tot}")
              cur.execute("""SELECT to_char(date_trunc('day', bucket),'MM-DD'), sum(count)
                             FROM events_eventmetric WHERE metric='view' AND bucket >= '2026-09-01'
                             GROUP BY 1 ORDER BY 1""")
              vistas=cur.fetchall(); L.append(f"vistas septiembre: {sum(c for _,c in vistas)}")
              L.append("\n== descargas por evento (septiembre) ==")
              cur.execute("""SELECT e.slug, sum(m.count) FROM events_eventmetric m JOIN events_event e ON e.id=m.event_id
                             WHERE m.metric='download' AND m.bucket >= '2026-09-01' GROUP BY 1 ORDER BY 2 DESC""")
              for s,c in cur.fetchall(): L.append(f"{s:<32}{c}")
              L.append("\n== tamano promedio de lo descargado (ponderado por descargas, historico) ==")
              cur.execute("""SELECT e.slug, sum(p.download_count), sum(p.download_count::bigint*p.file_size)/nullif(sum(p.download_count),0)/1e6,
                                    count(*) FILTER (WHERE p.branded_key<>'')
                             FROM photos_photo p JOIN events_event e ON e.id=p.event_id
                             WHERE p.download_count>0 GROUP BY 1 ORDER BY 2 DESC""")
              for s,n,mb,br in cur.fetchall(): L.append(f"{s:<32} descargas={n:<7} MB_prom_original={mb:.2f} con_version_logos={br}")
              cur.execute("SELECT sum(download_count::bigint*file_size)/nullif(sum(download_count),0)/1e6 FROM photos_photo WHERE download_count>0")
              L.append(f"MB promedio global (original): {cur.fetchone()[0]:.2f}")

              # foto mas descargada, para probar la URL firmada
              cur.execute("""SELECT p.id, coalesce(nullif(p.branded_key,''), p.original_key), p.original_filename, p.file_size
                             FROM photos_photo p WHERE p.status='approved' AND p.original_key<>''
                             ORDER BY p.download_count DESC LIMIT 1""")
              pid, key, fname, fsize = cur.fetchone()

          s3=boto3.client("s3", endpoint_url=web["R2_ENDPOINT_URL"], aws_access_key_id=web["R2_ACCESS_KEY_ID"],
                          aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"], region_name="auto")
          B=web["R2_BUCKET_NAME"]
          # La cabecera de tamaño real del objeto que se baja
          h=s3.head_object(Bucket=B, Key=key)
          L.append(f"\n== objeto de prueba: foto {pid}, {h['ContentLength']/1e6:.2f} MB, ContentType guardado={h.get('ContentType')} ==")

          def probar(nombre, **extra):
              params={"Bucket":B,"Key":key, **extra}
              url=s3.generate_presigned_url("get_object", Params=params, ExpiresIn=300)
              r=requests.get(url, headers={"Range":"bytes=0-0"}, timeout=40)
              L.append(f"[{nombre}] status={r.status_code} content-type={r.headers.get('content-type')!r} "
                       f"content-disposition={r.headers.get('content-disposition')!r} cache-control={r.headers.get('cache-control')!r}")
          probar("sin overrides")
          probar("attachment ascii", ResponseContentDisposition='attachment; filename="6K2A8244.jpg"', ResponseContentType="image/jpeg")
          # Lo que genera django.utils.http.content_disposition_header para un nombre no-ASCII
          cd = "attachment; filename*=utf-8''Foto%20Marat%C3%B3n%201.jpg"
          probar("attachment rfc5987 (no-ascii)", ResponseContentDisposition=cd, ResponseContentType="image/jpeg")
          probar("octet-stream", ResponseContentDisposition='attachment; filename="6K2A8244.jpg"', ResponseContentType="application/octet-stream")
          # URL vencida: el control negativo
          url=s3.generate_presigned_url("get_object", Params={"Bucket":B,"Key":key}, ExpiresIn=1)
          import time; time.sleep(3)
          r=requests.get(url, headers={"Range":"bytes=0-0"}, timeout=40)
          L.append(f"[vencida] status={r.status_code} content-type={r.headers.get('content-type')!r}")
          # objeto inexistente: lo que veria el usuario si redirigimos a algo que no esta
          url=s3.generate_presigned_url("get_object", Params={"Bucket":B,"Key":key+".no-existe"}, ExpiresIn=300)
          r=requests.get(url, timeout=40)
          L.append(f"[no existe] status={r.status_code} content-type={r.headers.get('content-type')!r} cuerpo={r.text[:80]!r}")

          pathlib.Path("salida/medicion.txt").write_text("\n".join(L))
          print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/medicion.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-medir-r2
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-medir-r2
