name: medir-r2 (one-off, solo lectura)
on:
  workflow_dispatch:
  push:
    branches: ["run-medir-r2"]
concurrency:
  group: medir-r2
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, re, json, hashlib, secrets, requests, pathlib, collections
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          PID=os.environ["PROJECT_ID"]; ENV=os.environ["ENV_ID"]; WEB=os.environ["WEB_ID"]
          SAL=secrets.token_hex(8)  # sal de un solo uso: las IPs no se pueden recuperar ni cruzar
          def anon(ip): return hashlib.sha256((SAL+ip).encode()).hexdigest()[:8]
          L=[]
          def gql(q, v=None):
              r=requests.post(API,headers=H,json={"query":q,"variables":v or {}},timeout=120)
              try: return r.json()
              except Exception: return {"errors":[{"message":f"http {r.status_code}"}]}
          def err(d): return "; ".join(e.get("message","")[:300] for e in d.get("errors",[]))

          dep=gql('query($i:DeploymentListInput!){ deployments(first:8, input:$i){ edges{ node{ id status createdAt } } } }',
                  {"i":{"projectId":PID,"environmentId":ENV,"serviceId":WEB}})
          nodos=[e["node"] for e in (((dep.get("data") or {}).get("deployments") or {}).get("edges") or [])]

          # ---------- A) logs HTTP del borde de Railway: IP real + bytes reales ----------
          t=gql('{ __type(name:"HttpLog"){ fields{ name } } }')
          campos=[f["name"] for f in ((((t.get("data") or {}).get("__type") or {}).get("fields")) or [])]
          L.append(f"== HttpLog: campos disponibles: {campos or err(t)}")
          quiero=[c for c in ["timestamp","path","method","httpStatus","srcIp","clientUa","txBytes","totalDuration"] if c in campos]
          http=[]
          if quiero:
              q='query($d:String!,$f:String,$n:Int){ httpLogs(deploymentId:$d, filter:$f, limit:$n){ '+" ".join(quiero)+' } }'
              for n in nodos:
                  for filtro in ("@path:/descargas/foto", None):
                      r=gql(q,{"d":n["id"],"f":filtro,"n":5000})
                      if r.get("errors"):
                          L.append(f"  httpLogs {n['createdAt'][:16]} filtro={filtro}: {err(r)}"); continue
                      filas=(r.get("data") or {}).get("httpLogs") or []
                      http+= [dict(x, _filtro=bool(filtro)) for x in filas]
          L.append(f"filas de httpLogs: {len(http)}")

          def ruta(p):
              p=(p or "").split("?")[0]
              p=re.sub(r"/\d+", "/<id>", p)
              p=re.sub(r"^/u/[^/]+", "/u/<token>", p)       # nunca imprimir tokens de fotografo
              p=re.sub(r"^/invitados/[^/]+", "/invitados/<t>", p)
              seg=p.split("/")
              return "/".join(seg[:4]) if len(seg)>4 else p

          desc=[x for x in http if "/descargas/foto" in (x.get("path") or "")]
          todo=[x for x in http if not x["_filtro"]]
          if desc:
              ips=collections.Counter(x.get("srcIp","?") for x in desc)
              L.append(f"\n== DESCARGAS (muestra {len(desc)}) ==")
              L.append(f"clientes distintos (IP real): {len(ips)}")
              for ip,c in ips.most_common(10):
                  uas=collections.Counter(x.get("clientUa","") for x in desc if x.get("srcIp")==ip).most_common(1)
                  horas=sorted({(x.get("timestamp") or "")[:13] for x in desc if x.get("srcIp")==ip})
                  L.append(f"  cliente {anon(ip)}: {c} descargas ({c*100/len(desc):.0f}%) · horas {horas[0] if horas else ''}..{horas[-1] if horas else ''} ({len(horas)}h) · UA: {uas[0][0][:110] if uas else ''}")
              tb=[int(x["txBytes"]) for x in desc if str(x.get("txBytes","")).isdigit()]
              if tb: L.append(f"bytes reales por descarga (borde): prom {sum(tb)/len(tb)/1e6:.2f} MB")
              st=collections.Counter(x.get("httpStatus") for x in desc); L.append(f"status: {dict(st)}")
          uagg=collections.Counter()
          for x in desc: uagg[(x.get("clientUa") or "")[:120]]+=1
          L.append("\nUA mas frecuentes en descargas:")
          for u,c in uagg.most_common(8): L.append(f"  {c:>6}  {u}")

          # ---------- B) todo el trafico: bytes por ruta ----------
          if todo:
              by=collections.Counter(); cnt=collections.Counter()
              for x in todo:
                  r_=ruta(x.get("path")); cnt[r_]+=1
                  if str(x.get("txBytes","")).isdigit(): by[r_]+=int(x["txBytes"])
              tot=sum(by.values()) or 1
              L.append(f"\n== TODO EL TRAFICO (muestra {len(todo)} pedidos, {tot/1e9:.2f} GB) — bytes por ruta ==")
              for r_,b in by.most_common(15):
                  L.append(f"  {b*100/tot:5.1f}%  {b/1e6:9.1f} MB  {cnt[r_]:>6} pedidos  {r_}")
              ipt=collections.Counter(x.get("srcIp","?") for x in todo)
              L.append(f"clientes distintos en la muestra: {len(ipt)}; top: " + ", ".join(f"{anon(i)}={c}" for i,c in ipt.most_common(5)))
              ua2=collections.Counter((x.get("clientUa") or "")[:90] for x in todo)
              L.append("UA mas frecuentes en todo el trafico:")
              for u,c in ua2.most_common(6): L.append(f"  {c:>6}  {u}")

          pathlib.Path("salida").mkdir(exist_ok=True)
          pathlib.Path("salida/medicion3.txt").write_text("\n".join(L))
          print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/medicion3.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-medir3
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-medir3
