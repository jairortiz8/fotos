name: medir-r2 (one-off, solo lectura)
on:
  workflow_dispatch:
  push:
    branches: ["run-medir-r2"]
concurrency:
  group: medir-r2
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, socket, requests, psycopg, pathlib, ipaddress, collections
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); web=vars_de(os.environ["WEB_ID"])
          CF=[ipaddress.ip_network(n) for n in requests.get("https://www.cloudflare.com/ips-v4",timeout=30).text.split()]
          def es_cf(ip):
              try: a=ipaddress.ip_address(str(ip))
              except ValueError: return False
              return any(a in n for n in CF)
          L=[]
          dominios={web.get("SITE_DOMAIN",""), web.get("RAILWAY_PUBLIC_DOMAIN","")} | set(web.get("ALLOWED_HOSTS","").split(","))
          for d in sorted(x.strip() for x in dominios if x and x.strip() and x.strip() not in ("*",) and not x.strip().startswith(".")):
              try:
                  ips={ai[4][0] for ai in socket.getaddrinfo(d,443,socket.AF_INET)}
                  L.append(f"DNS {d}: {len(ips)} IPs, Cloudflare={all(es_cf(i) for i in ips)}")
              except Exception as e:
                  L.append(f"DNS {d}: {type(e).__name__}")
              try:
                  r=requests.get(f"https://{d}/healthz/lite",timeout=20)
                  L.append(f"   headers: server={r.headers.get('server')!r} cf-ray={'si' if 'cf-ray' in r.headers else 'no'} via={r.headers.get('via')!r} x-railway={'si' if any(k.lower().startswith('x-railway') for k in r.headers) else 'no'}")
              except Exception as e:
                  L.append(f"   GET: {type(e).__name__}")
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("SELECT last_used_ip, last_used_at >= '2026-09-17 04:45+00' FROM photographers_photographerlink WHERE last_used_ip IS NOT NULL")
              c=collections.Counter(("despues" if d else "antes", "CLOUDFLARE" if es_cf(ip) else "no-cloudflare") for ip,d in cur.fetchall())
              L.append(f"links de fotografo: {dict(c)}")
              cur.execute("SELECT ip_address FROM core_auditlog WHERE ip_address IS NOT NULL AND created_at > '2026-08-17'")
              c=collections.Counter("CLOUDFLARE" if es_cf(ip) else "no-cloudflare" for (ip,) in cur.fetchall())
              L.append(f"audit log (primer salto, antes del 17-09): {dict(c)}")
              cur.execute("SELECT count(DISTINCT last_used_ip) FROM photographers_photographerlink WHERE last_used_at >= '2026-09-17 04:45+00'")
              L.append(f"IPs /24 distintas entre los links usados despues del 17-09: {cur.fetchone()[0]}")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/medicion5.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/medicion5.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-medir5
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-medir5
