name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, re, requests, psycopg, pathlib, collections
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          P,E,W=os.environ["PROJECT_ID"],os.environ["ENV_ID"],os.environ["WEB_ID"]
          def gql(q,v):
              try: return requests.post(API,headers=H,json={"query":q,"variables":v},timeout=120).json()
              except Exception: return {}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(gql(V,{"p":P,"e":E,"s":os.environ["PG_ID"]}).get("data") or {}).get("variables") or {}
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("""SELECT l.id, l.photographer_name, l.is_active, l.photos_uploaded,
                                    l.last_used_at AT TIME ZONE 'America/El_Salvador',
                                    (SELECT max(p.created_at) FROM photos_photo p WHERE p.photographer_link_id=l.id) AT TIME ZONE 'America/El_Salvador',
                                    (SELECT count(*) FROM photos_photo p WHERE p.photographer_link_id=l.id AND p.status NOT IN ('deleted','rejected'))
                             FROM photographers_photographerlink l JOIN events_event e ON e.id=l.event_id WHERE e.slug='utcom-2026' ORDER BY l.id""")
              L.append("link | fotografo | activo | fotos | ultima vez que abrio el link (SV) | ultima foto subida (SV)")
              for r in cur.fetchall(): L.append(f"  {r[0]} | {r[1]} | {r[2]} | {r[6]} | {str(r[4])[:16]} | {str(r[5])[:16]}")
          Q='query($i:DeploymentListInput!){ deployments(first:3, input:$i){ edges{ node{ id createdAt } } } }'
          deps=[e["node"] for e in (((gql(Q,{"i":{"projectId":P,"environmentId":E,"serviceId":W}}).get("data") or {}).get("deployments") or {}).get("edges") or [])]
          LG='query($d:String!,$f:String,$n:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:$n){ timestamp message } }'
          out=collections.Counter(); ult={}
          for d in deps:
              for x in (gql(LG,{"d":d["id"],"f":"outcome=","n":5000}).get("data") or {}).get("deploymentLogs") or []:
                  m=re.search(r"outcome=(\w+) event=(\S+) link=(\d+)",x["message"])
                  if m and m.group(2)=="utcom-2026" and x["timestamp"]>"2026-09-28T22:50":
                      out[(m.group(3),m.group(1))]+=1; ult[m.group(3)]=x["timestamp"]
          L.append("\nintentos de subida a UTCOM desde el deploy (22:50 UTC = 16:50 SV):")
          L.append("  ninguno" if not out else "  "+", ".join(f"link {k[0]} {k[1]}={c}" for k,c in sorted(out.items())))
          # aperturas del portal desde el deploy (GET /u/<token>/ -> status), sin mostrar tokens
          rx=re.compile(r'"GET /u/[^/ ]+/ HTTP[^"]*" (\d{3})')
          ab=collections.Counter()
          for d in deps:
              for x in (gql(LG,{"d":d["id"],"f":"GET /u/","n":5000}).get("data") or {}).get("deploymentLogs") or []:
                  m=rx.search(x["message"])
                  if m and x["timestamp"]>"2026-09-28T22:50": ab[(x["timestamp"][:13],m.group(1))]+=1
          L.append("aperturas del portal desde el deploy (hora UTC, status): " + (", ".join(f"{h[5:]}h[{s}]={c}" for (h,s),c in sorted(ab.items())) or "ninguna"))
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/colas.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
