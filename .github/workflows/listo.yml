name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery Pillow
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, time, requests, psycopg, pathlib, redis, collections
          from celery import Celery
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(s): return (requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":s}},timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); url=vars_de("37559685-4af5-4b9a-851d-84d9424f7424")["REDIS_PUBLIC_URL"]
          OUT=pathlib.Path("salida"); OUT.mkdir(exist_ok=True); L=[]
          def log(s): L.append(s); print(s,flush=True); (OUT/"colas.txt").write_text("\n".join(L))
          def q(cur,sql,a=()): cur.execute(sql,a); return cur.fetchall()
          cx=psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40); cur=cx.cursor()
          ev=q(cur,"SELECT id,name,date,status,visibility,download_count,search_count FROM events_event WHERE slug='utcom-2026'")[0]; eid=ev[0]
          log(f"EVENTO: {ev[1]} · fecha {ev[2]} · estado {ev[3]} · visibilidad {ev[4]}")
          log("== FOTOS por fotografo: total | con dorsal | con caras | descargadas al menos 1 vez | descargas")
          for r in q(cur,"""SELECT coalesce(l.photographer_name,'-'), count(*), count(*) FILTER (WHERE p.has_bibs_detected), count(*) FILTER (WHERE p.has_faces_detected),
                            count(*) FILTER (WHERE p.download_count>0), coalesce(sum(p.download_count),0)
                            FROM photos_photo p LEFT JOIN photographers_photographerlink l ON l.id=p.photographer_link_id
                            WHERE p.event_id=%s AND p.status='approved' GROUP BY 1 ORDER BY 2 DESC""",(eid,)):
              log(f"  {r[0]} | {r[1]} | {r[2]} ({100*r[2]/r[1]:.0f}%) | {r[3]} ({100*r[3]/r[1]:.0f}%) | {r[4]} | {r[5]}")
          t=q(cur,"""SELECT count(*), count(*) FILTER (WHERE has_bibs_detected), count(*) FILTER (WHERE has_faces_detected), count(*) FILTER (WHERE download_count>0), coalesce(sum(download_count),0)
                     FROM photos_photo WHERE event_id=%s AND status='approved'""",(eid,))[0]
          log(f"  TOTAL | {t[0]} | {t[1]} ({100*t[1]/t[0]:.0f}%) | {t[2]} ({100*t[2]/t[0]:.0f}%) | {t[3]} | {t[4]}")
          f=q(cur,"SELECT count(*), count(*) FILTER (WHERE avatar_key<>'') FROM photos_faceembedding fe JOIN photos_photo p ON p.id=fe.photo_id WHERE p.event_id=%s",(eid,))[0]
          b=q(cur,"SELECT count(*), count(DISTINCT number) FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id WHERE p.event_id=%s",(eid,))[0]
          log(f"caras indexadas {f[0]} (retratos {f[1]}) · dorsales leidos {b[0]} ({b[1]} numeros distintos)")
          log("== USO por dia (hora SV): vistas | busquedas | descargas")
          for r in q(cur,"""SELECT to_char(bucket AT TIME ZONE 'America/El_Salvador','MM-DD'), sum(count) FILTER (WHERE metric='view'), sum(count) FILTER (WHERE metric='search'), sum(count) FILTER (WHERE metric='download')
                            FROM events_eventmetric WHERE event_id=%s GROUP BY 1 ORDER BY 1""",(eid,)):
              log(f"  {r[0]} | {r[1] or 0} | {r[2] or 0} | {r[3] or 0}")
          log(f"contadores del evento: descargas {ev[5]} · busquedas {ev[6]}")
          log("== FOTOS SIN DORSAL por franja de subida (SV)")
          for r in q(cur,"""SELECT to_char(date_trunc('hour', created_at AT TIME ZONE 'America/El_Salvador'),'MM-DD HH24'), count(*), count(*) FILTER (WHERE NOT has_bibs_detected)
                            FROM photos_photo WHERE event_id=%s AND status='approved' GROUP BY 1 ORDER BY 1""",(eid,)):
              log(f"  {r[0]}h  {r[1]:>5} fotos · sin dorsal {r[2]:>4} ({100*r[2]/r[1]:.0f}%)")
          # las de la caida de Gemini: re-leer las que siguen sin dorsal
          ids=[r[0] for r in q(cur,"""SELECT id FROM photos_photo WHERE event_id=%s AND status='approved' AND NOT has_bibs_detected
                                      AND created_at >= '2026-09-28 00:40+00' AND created_at < '2026-09-28 02:30+00'""",(eid,))]
          log(f"\nde la franja de la caida de Gemini (27-09 18:40-20:30 SV) siguen sin dorsal: {len(ids)}")
          if ids:
              app=Celery(broker=url); rc=redis.Redis.from_url(url)
              aq=app.control.inspect(timeout=10).active_queues() or {}
              if not any("ocr" in {x["name"] for x in qs} for qs in aq.values()):
                  log("  no hay worker escuchando la cola ocr: no encolo"); raise SystemExit(0)
              for pid in ids: app.send_task("photos.run_ocr_on_photo", args=[pid], queue="ocr")
              log(f"  encoladas {len(ids)} en la cola ocr")
              for i in range(30):
                  time.sleep(30)
                  cx2=psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40); c2=cx2.cursor()
                  c2.execute("SELECT count(*) FILTER (WHERE has_bibs_detected) FROM photos_photo WHERE id = ANY(%s)",(ids,)); ok=c2.fetchone()[0]; cx2.close()
                  n=rc.llen("ocr"); act=sum(len(v) for v in (app.control.inspect(timeout=8).active() or {}).values())
                  log(f"  +{(i+1)*30}s cola ocr={n} corriendo={act} · recuperaron dorsal {ok}/{len(ids)}")
                  if n==0 and act==0 and i>=2: break
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
