name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery Pillow
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, re, time, statistics as st, requests, pathlib, datetime as dt, concurrent.futures as cf
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          P,E,W=os.environ["PROJECT_ID"],os.environ["ENV_ID"],os.environ["WEB_ID"]
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 14; SM-A546E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"}
          L=[]
          def medir(url, n=5):
              t=[]; sz=0; code=None; ttfb=[]
              for _ in range(n):
                  s=requests.Session(); t0=time.time()
                  r=s.get(url,headers=UA,timeout=60,stream=True); tf=time.time()-t0; body=r.content; t.append(time.time()-t0); ttfb.append(tf); sz=len(body); code=r.status_code
              return code, st.median(ttfb), st.median(t), max(t), sz, body
          B="https://findyourfoto.com"
          for nombre,url in [("home","/"),("UTCOM (album)","/eventos/utcom-2026/"),("UTCOM por fotografo","/eventos/utcom-2026/?vista=fotografos"),("Surf City (album)","/eventos/surf-city-2026/"),("Septimo (album)","/eventos/septimo-x-cep-social-run/"),("healthz lite","/healthz/lite")]:
              code,tf,tt,mx,sz,body=medir(B+url)
              L.append(f"{nombre:<22} HTTP {code} · servidor responde en {tf*1000:.0f} ms · pagina completa {tt*1000:.0f} ms (peor {mx*1000:.0f}) · {sz/1024:.0f} KB")
              if nombre=="UTCOM (album)": utcom=body.decode("utf-8","ignore")
          imgs=re.findall(r'src="(https://[^"]+r2\.cloudflarestorage\.com[^"]+)"',utcom)
          imgs+= [B+x for x in re.findall(r'src="(/eventos/utcom-2026/(?:cara|portada)[^"]+)"',utcom)]
          L.append(f"\nimagenes en la primera pagina de UTCOM: {len(imgs)} (miniaturas de R2 + retratos/portada)")
          def get(u):
              t0=time.time(); r=requests.get(u.replace("&amp;","&"),headers=UA,timeout=60); return time.time()-t0, len(r.content), r.status_code
          with cf.ThreadPoolExecutor(6) as ex: res=list(ex.map(get, imgs[:60]))
          if res:
              ts=[r[0] for r in res]; L.append(f"  cada imagen: mediana {st.median(ts)*1000:.0f} ms, peor {max(ts)*1000:.0f} ms, peso mediano {st.median(r[1] for r in res)/1024:.0f} KB, errores {sum(1 for r in res if r[2]!=200)}")
              L.append(f"  las 60 en paralelo (6 a la vez, como un navegador): {sum(ts)/6:.1f} s aprox")
          # carga del servidor web
          M='query($p:String!,$e:String!,$s:String!,$d:DateTime!){ metrics(projectId:$p, environmentId:$e, serviceId:$s, startDate:$d, sampleRateSeconds:300, measurements:[MEMORY_USAGE_GB, CPU_USAGE]){ measurement values{ ts value } } }'
          r=requests.post(API,headers=H,json={"query":M,"variables":{"p":P,"e":E,"s":W,"d":(dt.datetime.now(dt.UTC)-dt.timedelta(hours=2)).isoformat()}},timeout=60).json()
          for x in (r.get("data") or {}).get("metrics") or []:
              v=[y["value"] for y in x["values"]]; L.append(f"web {x['measurement']}: ahora {v[-1]:.2f}, max 2h {max(v):.2f}")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/colas.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
