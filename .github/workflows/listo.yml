name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery Pillow
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, io, requests, psycopg, pathlib, boto3
          from PIL import Image, JpegImagePlugin
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(s): return (requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":s}},timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); web=vars_de(os.environ["WEB_ID"])
          s3=boto3.client("s3",endpoint_url=web["R2_ENDPOINT_URL"],aws_access_key_id=web["R2_ACCESS_KEY_ID"],aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"],region_name="auto"); B=web["R2_BUCKET_NAME"]
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("""SELECT count(*), count(*) FILTER (WHERE preview_key<>''), count(*) FILTER (WHERE branded_key<>''),
                                    count(*) FILTER (WHERE has_bibs_detected), count(*) FILTER (WHERE has_faces_detected), count(*) FILTER (WHERE status IN ('uploading','processing','processing_failed'))
                             FROM photos_photo WHERE photographer_link_id=43 AND created_at > '2026-09-29 00:00+00'""")
              t,pv,br,bi,fa,tr=cur.fetchone()
              L.append(f"tanda de anoche de Merlos: {t} fotos · preview {pv} · con logos {br} · con dorsal {bi} ({100*bi/max(t,1):.0f}%) · con caras {fa} ({100*fa/max(t,1):.0f}%) · trabadas/fallidas {tr}")
              cur.execute("""SELECT count(*), count(*) FILTER (WHERE has_bibs_detected), count(*) FILTER (WHERE has_faces_detected) FROM photos_photo WHERE photographer_link_id=43 AND created_at < '2026-09-29 00:00+00' AND status<>'deleted'""")
              a,b,c=cur.fetchone(); L.append(f"referencia, sus fotos anteriores: dorsal {100*b/a:.0f}% · caras {100*c/a:.0f}%")
              cur.execute("SELECT b.source, count(*) FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id WHERE p.photographer_link_id=43 AND p.created_at > '2026-09-29 00:00+00' GROUP BY 1")
              L.append(f"dorsales de la tanda por motor: {dict(cur.fetchall())}")
              cur.execute("SELECT branded_key FROM photos_photo WHERE photographer_link_id=43 AND created_at > '2026-09-29 00:00+00' AND branded_key<>'' ORDER BY id DESC LIMIT 3")
              for (k,) in cur.fetchall():
                  b=io.BytesIO(); s3.download_fileobj(B,k,b); b.seek(0); im=Image.open(b)
                  L.append(f"  version con logos: {im.size} calidad={'95' if im.quantization[0][0]<=2 else 'vieja'} color={ {0:'4:4:4',1:'4:2:2',2:'4:2:0'}.get(JpegImagePlugin.get_sampling(im)) }")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/colas.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
