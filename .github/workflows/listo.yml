name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, re, requests, psycopg, pathlib, collections
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          P,E,W=os.environ["PROJECT_ID"],os.environ["ENV_ID"],os.environ["WEB_ID"]
          def gql(q,v):
              try: return requests.post(API,headers=H,json={"query":q,"variables":v},timeout=120).json()
              except Exception: return {}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(gql(V,{"p":P,"e":E,"s":os.environ["PG_ID"]}).get("data") or {}).get("variables") or {}
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("""SELECT to_char(created_at AT TIME ZONE 'America/El_Salvador','MM-DD HH24'), count(*), min(original_filename), max(original_filename)
                             FROM photos_photo WHERE photographer_link_id=43 AND status<>'deleted' GROUP BY 1 ORDER BY 1""")
              L.append("Merlos (El Cementerio) fotos por hora de subida (SV):")
              for r in cur.fetchall(): L.append(f"  {r[0]}h  {r[1]:>5}  {r[2]} .. {r[3]}")
              cur.execute("SELECT original_filename, status FROM photos_photo WHERE photographer_link_id=43")
              fotos={f:s for f,s in cur.fetchall()}
              cur.execute("SELECT status, count(*) FROM photos_photo WHERE photographer_link_id=43 GROUP BY 1")
              L.append(f"por estado: {dict(cur.fetchall())}")
          # numeracion de la camara: huecos
          nums=collections.defaultdict(list)
          for f in fotos:
              m=re.match(r"([A-Za-z_]*)(\d+)",f or "")
              if m: nums[m.group(1)].append(int(m.group(2)))
          for pref,ns in nums.items():
              ns=sorted(set(ns)); faltan=[n for n in range(ns[0],ns[-1]+1) if n not in set(ns)]
              L.append(f"serie '{pref}': {len(ns)} fotos, de {ns[0]} a {ns[-1]} · numeros que faltan en el medio: {len(faltan)}" + (f" (ej. {faltan[:8]})" if faltan else ""))
          # logs del web: intentos fallidos de Merlos y si despues entraron
          Q='query($i:DeploymentListInput!){ deployments(first:10, input:$i){ edges{ node{ id createdAt } } } }'
          deps=[e["node"] for e in (((gql(Q,{"i":{"projectId":P,"environmentId":E,"serviceId":W}}).get("data") or {}).get("deployments") or {}).get("edges") or [])]
          LG='query($d:String!,$f:String,$n:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:$n){ timestamp message } }'
          res=collections.Counter(); fallidas={}; horas=collections.Counter(); primero=None
          for d in deps:
              for x in (gql(LG,{"d":d["id"],"f":"link=43","n":5000}).get("data") or {}).get("deploymentLogs") or []:
                  m=re.search(r"outcome=(\w+) event=\S+ link=43 file='([^']*)'",x["message"])
                  if not m: continue
                  oc,fn=m.groups(); res[oc]+=1; horas[(x["timestamp"][:13],oc)]+=1
                  if oc!="ok": fallidas[fn]=oc
          L.append(f"\nlogs del web (link 43): resultados {dict(res)}")
          L.append("  por hora UTC: " + ", ".join(f"{h[5:]}h {o}={c}" for (h,o),c in sorted(horas.items())))
          if fallidas:
              entraron=[f for f in fallidas if f in fotos]
              L.append(f"archivos que fallaron alguna vez: {len(fallidas)} · de esos, despues SI entraron: {len(entraron)} · siguen sin entrar: {len(fallidas)-len(entraron)}")
              no=[f for f in fallidas if f not in fotos]
              L.append(f"  motivos de los que siguen sin entrar: {dict(collections.Counter(fallidas[f] for f in no))}")
              L.append(f"  ejemplos: {sorted(no)[:10]}")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/colas.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
