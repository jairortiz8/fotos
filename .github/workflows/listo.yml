name: listo para subir (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-listo"]
concurrency:
  group: listo
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis celery Pillow
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, io, time, requests, psycopg, pathlib, redis
          from celery import Celery
          from PIL import Image
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          P,E=os.environ["PROJECT_ID"],os.environ["ENV_ID"]
          OUT=pathlib.Path("salida"); OUT.mkdir(exist_ok=True); L=[]
          def log(s): L.append(s); print(s,flush=True); (OUT/"colas.txt").write_text("\n".join(L))
          def gql(q,v):
              try: return requests.post(API,headers=H,json={"query":q,"variables":v},timeout=90).json()
              except Exception as e: return {"errors":[{"message":str(e)}]}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(s): return (gql(V,{"p":P,"e":E,"s":s}).get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); url=vars_de("37559685-4af5-4b9a-851d-84d9424f7424")["REDIS_PUBLIC_URL"]; web=vars_de("5dec515d-7408-46ae-91ac-d2325d6d92ad")
          rc=redis.Redis.from_url(url); app=Celery(broker=url)
          # 0) chequeo previo
          colas={q:rc.llen(q) for q in ("fast","ocr","faces","celery")}
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"],connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("SELECT count(*) FROM photos_photo WHERE status IN ('uploading','processing')"); proc=cur.fetchone()[0]
              cur.execute("SELECT count(*) FROM photos_photo WHERE created_at > now()-interval '15 minutes'"); rec=cur.fetchone()[0]
          act=sum(len(v) for v in (app.control.inspect(timeout=10).active() or {}).values())
          log(f"antes: colas {colas} · tareas corriendo {act} · en proceso {proc} · subidas ultimos 15 min {rec}")
          if any(colas.values()) or act or proc or rec:
              log("NO APAGO: hay trabajo pendiente o alguien subiendo."); raise SystemExit(0)
          log(f"FACE_SEARCH_ENABLED en el web: {web.get('FACE_SEARCH_ENABLED')}")
          # 1) apagar (deploymentRemove, lo unico que apaga de verdad)
          S={"worker-fast (OCR)":"8ef0f305-d7bf-400f-b6a9-ac510d526b1d","worker_fast":"e4289c40-a254-436a-be02-35ec0e935363","worker":"1846c52a-57c3-4a8b-b4ec-1cc200a8e652","beat":"0a364656-8700-4f69-bac0-b91c50cd722b"}
          Q='query($i:DeploymentListInput!){ deployments(first:5, input:$i){ edges{ node{ id status } } } }'
          R='mutation($id:String!){ deploymentRemove(id:$id) }'
          for n,sid in S.items():
              deps=[e["node"] for e in (((gql(Q,{"i":{"projectId":P,"environmentId":E,"serviceId":sid}}).get("data") or {}).get("deployments") or {}).get("edges") or [])]
              vivos=[d for d in deps if d["status"] in ("SUCCESS","DEPLOYING","BUILDING","INITIALIZING","SLEEPING")]
              for d in vivos:
                  r=gql(R,{"id":d["id"]}); log(f"{n}: deploymentRemove({d['status']}) -> {(r.get('data') or {}).get('deploymentRemove')} {[e.get('message') for e in r.get('errors',[])]}")
              if not vivos: log(f"{n}: no tenia deploy activo")
          time.sleep(60)
          for n,sid in S.items():
              deps=[e["node"] for e in (((gql(Q,{"i":{"projectId":P,"environmentId":E,"serviceId":sid}}).get("data") or {}).get("deployments") or {}).get("edges") or [])]
              log(f"{n}: estado del ultimo deploy = {deps[0]['status'] if deps else '-'}")
          pong=[]
          for i in range(4):
              pong=app.control.ping(timeout=8) or []
              if not pong: break
              time.sleep(20)
          log(f"workers que contestan el ping: {len(pong)} (tiene que ser 0)")
          # 2) el sitio y la selfie siguen andando
          UA={"User-Agent":"Mozilla/5.0 (Linux; Android 14; SM-A546E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36"}
          B="https://findyourfoto.com"
          for nombre,u in (("home","/"),("album UTCOM","/eventos/utcom-2026/"),("pagina de selfie","/eventos/utcom-2026/buscar-selfie/"),("busqueda por dorsal","/eventos/utcom-2026/?dorsal=100")):
              r=requests.get(B+u,headers=UA,timeout=60); log(f"{nombre}: HTTP {r.status_code}")
          s=requests.Session(); s.headers.update(UA)
          pag=s.get(B+"/eventos/utcom-2026/buscar-selfie/",timeout=60)
          import re
          tok=re.search(r'name="csrfmiddlewaretoken" value="([^"]+)"',pag.text)
          img=Image.new("RGB",(640,640),(120,160,200)); buf=io.BytesIO(); img.save(buf,"JPEG"); buf.seek(0)
          campo=re.search(r'<input[^>]+type="file"[^>]+name="([^"]+)"',pag.text) or re.search(r'name="([^"]+)"[^>]+type="file"',pag.text)
          t0=time.time()
          r=s.post(B+"/eventos/utcom-2026/buscar-selfie/",data={"csrfmiddlewaretoken":tok.group(1) if tok else ""},files={(campo.group(1) if campo else "selfie"):("prueba.jpg",buf,"image/jpeg")},headers={"Referer":B+"/eventos/utcom-2026/buscar-selfie/"},timeout=120)
          txt=r.text.lower()
          log(f"selfie de prueba (imagen sin cara): HTTP {r.status_code} en {time.time()-t0:.1f}s · "
              f"{'respondio que no detecto cara (el modelo facial ANDA)' if ('cara' in txt and ('detect' in txt or 'encontr' in txt)) else ('SELFIE NO DISPONIBLE' if 'no disponible' in txt or r.status_code==503 else 'revisar respuesta')}")
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/colas.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-colas
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-colas
