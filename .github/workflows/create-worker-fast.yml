name: create-worker-fast (one-off)

on:
  workflow_dispatch:
  push:
    branches: ["run-worker-fast"]

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      NEW_NAME: worker_fast
    steps:
      - name: Crear worker_fast en Railway
        run: |
          set -uo pipefail
          [ -z "${RAILWAY_TOKEN:-}" ] && { echo "::error::Falta RAILWAY_TOKEN"; exit 1; }

          # Mandamos AMBOS headers: si es token de cuenta usa Bearer, si es de
          # proyecto usa Project-Access-Token. Railway toma el que corresponda.
          gql() {  # $1=query  $2=variables(json)
            curl -sS "$API" \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg q "$1" --argjson v "${2:-{\}}" '{query:$q, variables:$v}')"
          }

          echo "==> 0 scope del token (projectToken)"
          RESP=$(gql 'query { projectToken { projectId environmentId } }' '{}')
          echo "$RESP" | jq .
          PROJECT_ID=$(echo "$RESP" | jq -r '.data.projectToken.projectId // empty')
          ENV_ID=$(echo "$RESP" | jq -r '.data.projectToken.environmentId // empty')
          # Fallback a los IDs conocidos si el token no expone su scope.
          [ -z "$PROJECT_ID" ] && PROJECT_ID="13f846c9-6400-44dc-995f-02a7da9c45b4"
          [ -z "$ENV_ID" ] && ENV_ID="b48c37f0-dab0-4627-b95c-a20db2862579"
          echo "PROJECT_ID=$PROJECT_ID  ENV_ID=$ENV_ID"

          echo "==> 1 vars del worker"
          RESP=$(gql 'query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }' \
            "$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$WORKER_ID" '{p:$p,e:$e,s:$s}')")
          WORKER_VARS=$(echo "$RESP" | jq '.data.variables')
          if [ "$WORKER_VARS" = "null" ] || [ -z "$WORKER_VARS" ]; then echo "$RESP" | jq .; echo "::error::no pude leer vars del worker (¿el token es de este proyecto?)"; exit 1; fi
          NEW_VARS=$(echo "$WORKER_VARS" | jq 'with_entries(select(.key|startswith("RAILWAY_")|not)) + {PROCESS_TYPE:"worker_fast", CELERY_FAST_CONCURRENCY:"3"}')
          echo "vars: $(echo "$NEW_VARS" | jq -c 'keys')"

          echo "==> 2 crear servicio"
          RESP=$(gql 'mutation($i:ServiceCreateInput!){ serviceCreate(input:$i){ id } }' \
            "$(jq -n --arg p "$PROJECT_ID" --arg n "$NEW_NAME" '{i:{projectId:$p,name:$n,branch:"main",source:{repo:"jairortiz8/fotos"}}}')")
          echo "$RESP" | jq .
          NEW_ID=$(echo "$RESP" | jq -r '.data.serviceCreate.id // empty')
          [ -z "$NEW_ID" ] && { echo "::error::serviceCreate falló. Si dice Not Authorized, el token de PROYECTO no puede crear servicios → hace falta un token de CUENTA (Account Settings → Tokens)."; exit 1; }
          echo "nuevo serviceId=$NEW_ID"

          echo "==> 3 setear vars"
          gql 'mutation($i:VariableCollectionUpsertInput!){ variableCollectionUpsert(input:$i) }' \
            "$(jq -n --arg p "$PROJECT_ID" --arg e "$ENV_ID" --arg s "$NEW_ID" --argjson v "$NEW_VARS" \
               '{i:{projectId:$p,environmentId:$e,serviceId:$s,variables:$v}}')" | jq .

          echo "==> 4 deploy"
          gql 'mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }' \
            "$(jq -n --arg s "$NEW_ID" --arg e "$ENV_ID" '{s:$s,e:$e}')" | jq .

          echo "LISTO. worker_fast creado ($NEW_ID)."
