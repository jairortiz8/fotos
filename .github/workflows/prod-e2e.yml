name: prod-e2e (one-off)

# Verificación E2E DEFINITIVA del pipeline `fast` en PROD, contra una foto real en R2:
#  1) Descubre servicios plugin (Postgres/Redis) + URLs públicas.
#  2) Snapshot de salud (distribución de estados, atascadas).
#  3) inspect().active_queues() por DB → qué workers hay y qué colas consumen.
#  4) Encola regenerate_thumbnail a `fast` y consulta el RESULT BACKEND:
#       PENDING  = nadie la tomó (cola sin consumidor / DB equivocada)
#       STARTED  = un worker la está ejecutando (o colgado a mitad)
#       SUCCESS  = procesada OK  → el pipeline `fast` FUNCIONA
#       FAILURE  = tomada pero falló (p.ej. original faltante en R2 → problema de esa foto, no del worker)
#
# NUNCA imprime URLs de conexión (traen credenciales). Solo keys y resultados.

on:
  workflow_dispatch:
  push:
    branches: ["run-e2e"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: Instalar cliente celery
        run: python3 -m pip install --quiet "celery[redis]==5.6.3"

      - name: E2E del pipeline
        run: |
          set -uo pipefail
          gql() {
            curl -sS "$API" \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" --data "$1"
          }
          vars_of() {
            local q='{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}'
            gql "$q" | jq '.data.variables // {}'
          }

          echo "==================== 1) SERVICIOS + URLs ===================="
          SQ='{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}'
          gql "$SQ" > /tmp/svcs.json
          jq -e '.data.project.services' /tmp/svcs.json >/dev/null || { echo "ERROR servicios"; jq '.errors' /tmp/svcs.json; exit 1; }
          DBURL=""; RDPUB=""; CBURL=""; RBURL=""
          while IFS=$'\t' read -r NAME SID; do
            [ -z "$SID" ] && continue
            V=$(vars_of "$SID")
            [ -z "$DBURL" ] && DBURL=$(echo "$V" | jq -r '.DATABASE_PUBLIC_URL // empty')
            [ -z "$RDPUB" ] && RDPUB=$(echo "$V" | jq -r '.REDIS_PUBLIC_URL // empty')
            CB=$(echo "$V" | jq -r '.CELERY_BROKER_URL // empty');   [ -n "$CB" ] && CBURL="$CB"
            RB=$(echo "$V" | jq -r '.CELERY_RESULT_BACKEND // empty'); [ -n "$RB" ] && RBURL="$RB"
          done < <(jq -r '.data.project.services.edges[].node | "\(.name)\t\(.id)"' /tmp/svcs.json)
          [ -n "$DBURL" ] && echo "DB pública OK" || { echo "sin DB pública; fin"; exit 0; }
          BROKER_DB=$(printf '%s' "$CBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$BROKER_DB" ] && BROKER_DB=0
          RESULT_DB=$(printf '%s' "$RBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$RESULT_DB" ] && RESULT_DB=1
          SCHEME=""; AUTH=""
          if [ -n "$RDPUB" ]; then SCHEME="${RDPUB%%://*}"; REST="${RDPUB#*://}"; AUTH="${REST%%/*}"; fi
          echo "broker DB=/$BROKER_DB  result DB=/$RESULT_DB  redis proxy=$([ -n "$AUTH" ] && echo OK || echo NO)"
          export PGCONNECT_TIMEOUT=15

          echo
          echo "==================== 2) SNAPSHOT ===================="
          psql "$DBURL" -tAF ' | ' -c "select status, count(*) from photos_photo group by status order by 2 desc;" || { echo "ERROR DB"; exit 1; }
          echo "-- atascadas processing/uploading >15min (ideal 0):"
          psql "$DBURL" -tAc "select count(*) from photos_photo where status in ('processing','uploading') and updated_at < now() - interval '15 minutes';"
          echo

          if [ -z "$AUTH" ]; then echo "sin redis público; fin"; exit 0; fi
          PID=$(psql "$DBURL" -tAc "select id from photos_photo where original_key<>'' and thumbnail_key<>'' and status='approved' order by created_at desc limit 1;")
          [ -z "$PID" ] && { echo "sin foto de prueba; fin"; exit 0; }
          BEFORE=$(psql "$DBURL" -tAc "select extract(epoch from updated_at)::bigint from photos_photo where id=$PID;")
          echo "==================== 3) INSPECT + 4) RESULT BACKEND (foto id=$PID) ===================="

          AUTH="$AUTH" SCHEME="$SCHEME" BROKER_DB="$BROKER_DB" RESULT_DB="$RESULT_DB" PID="$PID" python3 - <<'PY'
          import os, time
          from celery import Celery
          auth = os.environ["AUTH"]; scheme = os.environ["SCHEME"]
          bdb = os.environ["BROKER_DB"]; rdb = os.environ["RESULT_DB"]; pid = int(os.environ["PID"])

          # inspect: en qué DB responden los workers y qué colas consumen
          chosen = None
          for db in (bdb, "0", "1", "2"):
              url = f"{scheme}://{auth}/{db}"
              try:
                  aq = Celery(broker=url).control.inspect(timeout=4).active_queues()
              except Exception as exc:
                  print(f"DB /{db}: error {exc}"); continue
              if aq:
                  print(f"DB /{db}: WORKERS -> " + str({w: [q.get('name') for q in qs] for w, qs in aq.items()}))
                  if chosen is None: chosen = db
              else:
                  print(f"DB /{db}: sin workers")
          if chosen is None:
              print("VEREDICTO: ningún worker respondió por inspect. Broker sin consumidor."); raise SystemExit(0)

          broker = f"{scheme}://{auth}/{chosen}"
          backend = f"{scheme}://{auth}/{rdb}"
          app = Celery(broker=broker, backend=backend)
          r = app.send_task("photos.regenerate_thumbnail", args=[pid],
                            kwargs={"include_preview": False}, queue="fast")
          print(f"Encolada a 'fast' (DB /{chosen}). task_id={r.id}. Esperando ejecución...")
          final = None
          for i in range(24):
              time.sleep(3)
              st = r.state
              print(f"  t={i*3+3}s  state={st}")
              if st in ("SUCCESS", "FAILURE"):
                  final = st; break
          if final == "SUCCESS":
              print(f"VEREDICTO: SUCCESS. El pipeline 'fast' FUNCIONA. result={r.result}")
          elif final == "FAILURE":
              print("VEREDICTO: FAILURE (worker la tomó y ejecutó, pero la tarea falló):")
              print(str(r.result)[:400])
          else:
              print(f"VEREDICTO: quedó en '{r.state}' tras 72s (STARTED=colgado ejecutando; PENDING=no la tomó).")
          PY

          echo
          echo "-- confirmación por DB: updated_at de la foto --"
          NOW=$(psql "$DBURL" -tAc "select extract(epoch from updated_at)::bigint from photos_photo where id=$PID;")
          if [ "$NOW" != "$BEFORE" ]; then echo "updated_at CAMBIÓ ($BEFORE -> $NOW): thumbnail regenerado OK."; else echo "updated_at sin cambio ($BEFORE)."; fi
          echo "==================== FIN ===================="
