name: renombrar fotografo (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-renombrar"]
concurrency:
  group: renombrar
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3 redis
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, io, requests, psycopg, pathlib, boto3, redis
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_de(s): return (requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":s}},timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vars_de(os.environ["PG_ID"]); web=vars_de(os.environ["WEB_ID"]); rd=vars_de("37559685-4af5-4b9a-851d-84d9424f7424")
          s3=boto3.client("s3", endpoint_url=web["R2_ENDPOINT_URL"], aws_access_key_id=web["R2_ACCESS_KEY_ID"], aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"], region_name="auto")
          B=web["R2_BUCKET_NAME"]
          out=pathlib.Path("salida"); out.mkdir(exist_ok=True)
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("""SELECT p.id, p.status, p.created_at, p.capture_time, p.width, p.height, p.file_size,
                                    p.original_key, p.preview_key, p.thumbnail_key, p.branded_key, p.has_faces_detected
                             FROM photos_photo p JOIN events_event e ON e.id=p.event_id WHERE e.slug='utcom-2026' ORDER BY p.id""")
              fotos=cur.fetchall()
              L.append(f"fotos en utcom-2026: {len(fotos)}")
              for f in fotos:
                  pid=f[0]
                  L.append(f"foto {pid}: status={f[1]} subida={f[2]} disparo={f[3]} {f[4]}x{f[5]} {f[6]/1e6:.1f}MB caras_detectadas={f[11]}")
                  for nombre,k in (("original",f[7]),("preview",f[8]),("thumbnail",f[9]),("con logos",f[10])):
                      if not k: L.append(f"   {nombre}: (sin key)"); continue
                      try:
                          h=s3.head_object(Bucket=B,Key=k); L.append(f"   {nombre}: OK en R2 ({h['ContentLength']/1e6:.2f} MB, {h.get('ContentType')})")
                      except Exception as e: L.append(f"   {nombre}: FALTA en R2 ({type(e).__name__})")
                  cur.execute("SELECT number, source, round(confidence::numeric,2) FROM photos_bib WHERE photo_id=%s", (pid,))
                  L.append(f"   dorsales: {cur.fetchall()}")
                  cur.execute("SELECT count(*) FROM photos_faceembedding WHERE photo_id=%s", (pid,))
                  L.append(f"   caras indexadas: {cur.fetchone()[0]}")
                  for nombre,k in (("preview",f[8]),("con_logos",f[10])):
                      if k:
                          buf=io.BytesIO(); s3.download_fileobj(B,k,buf)
                          ext="webp" if k.endswith(".webp") else "jpg"
                          (out/f"foto{pid}_{nombre}.{ext}").write_bytes(buf.getvalue())
              cur.execute("""SELECT count(*) FROM photos_photo WHERE status IN ('processing','uploaded') AND created_at < now() - interval '15 minutes'""")
              L.append(f"fotos trabadas en procesamiento (>15 min, todo el sitio): {cur.fetchone()[0]}")
          r=redis.Redis.from_url(rd["REDIS_PUBLIC_URL"])
          L.append("colas: " + ", ".join(f"{q}={r.llen(q)}" for q in ("fast","faces","celery")))
          (out/"renombrar.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/renombrar.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-renombrar
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-renombrar
