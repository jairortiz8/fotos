name: renombrar fotografo (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-renombrar"]
concurrency:
  group: renombrar
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, json, requests, psycopg, pathlib
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          NUEVO="Enrique Valencia"
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("""SELECT l.id, e.slug, l.photographer_name, l.is_active, l.photos_uploaded
                             FROM photographers_photographerlink l JOIN events_event e ON e.id=l.event_id
                             WHERE l.photographer_name ILIKE '%julio%barraza%' ORDER BY l.id""")
              filas=cur.fetchall()
              L.append(f"links que coinciden: {len(filas)}")
              for f in filas: L.append(f"  antes: id={f[0]} evento={f[1]} nombre={f[2]!r} activo={f[3]} fotos={f[4]}")
              cur.execute("SELECT target_type FROM core_auditlog WHERE action LIKE 'photographer_link.%' AND target_type<>'' LIMIT 1")
              tt=(cur.fetchone() or ["photographers.photographerlink"])[0]
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_name='core_auditlog'")
              cols={r[0] for r in cur.fetchall()}
              for lid, slug, viejo, *_ in filas:
                  cur.execute("UPDATE photographers_photographerlink SET photographer_name=%s, updated_at=now() WHERE id=%s", (NUEVO, lid))
                  campos=["action","target_type","target_id","metadata","created_at"]; vals=["photographer_link.renamed", tt, str(lid), json.dumps({"de":viejo,"a":NUEVO,"event":slug,"via":"pedido de Jair (sesion Claude)"})]
                  sql_vals="%s,%s,%s,%s::jsonb,now()"
                  if "updated_at" in cols: campos.append("updated_at"); sql_vals+=",now()"
                  cur.execute(f"INSERT INTO core_auditlog ({','.join(campos)}) VALUES ({sql_vals})", vals)
              cx.commit()
              cur.execute("""SELECT l.id, e.slug, l.photographer_name FROM photographers_photographerlink l JOIN events_event e ON e.id=l.event_id
                             WHERE l.id = ANY(%s) ORDER BY l.id""", ([f[0] for f in filas],))
              for f in cur.fetchall(): L.append(f"  despues: id={f[0]} evento={f[1]} nombre={f[2]!r}")
              cur.execute("SELECT count(*) FROM photographers_photographerlink WHERE photographer_name ILIKE '%julio%barraza%'")
              L.append(f"quedan con 'Julio Barraza': {cur.fetchone()[0]}")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/renombrar.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/renombrar.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-renombrar
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-renombrar
