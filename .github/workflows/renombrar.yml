name: renombrar fotografo (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-renombrar"]
concurrency:
  group: renombrar
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests "psycopg[binary]" boto3
      - name: Medir (solo lectura)
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, json, requests, psycopg, pathlib
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          FIX={45:"Enrique Valencia - Meta Previa Salidas", 46:"Enrique Valencia - Meta Llegadas"}
          L=[]
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"], connect_timeout=40) as cx, cx.cursor() as cur:
              cur.execute("SELECT column_name FROM information_schema.columns WHERE table_name='core_auditlog'")
              cols={r[0] for r in cur.fetchall()}
              for lid, nombre in FIX.items():
                  cur.execute("UPDATE photographers_photographerlink SET photographer_name=%s, updated_at=now() WHERE id=%s AND photographer_name='Enrique Valencia'", (nombre, lid))
                  L.append(f"id={lid}: filas={cur.rowcount}")
                  campos="action,target_type,target_id,metadata,created_at"+(",updated_at" if "updated_at" in cols else "")
                  vals="%s,%s,%s,%s::jsonb,now()"+(",now()" if "updated_at" in cols else "")
                  cur.execute(f"INSERT INTO core_auditlog ({campos}) VALUES ({vals})", ["photographer_link.renamed","photographers.photographerlink",str(lid),json.dumps({"de":"Enrique Valencia","a":nombre,"motivo":"restaurar sufijo pisado"})])
              cx.commit()
              cur.execute("""SELECT l.id, e.slug, l.photographer_name FROM photographers_photographerlink l JOIN events_event e ON e.id=l.event_id WHERE l.id IN (27,45,46) ORDER BY l.id""")
              for f in cur.fetchall(): L.append(f"  ahora: id={f[0]} evento={f[1]} nombre={f[2]!r}")
          pathlib.Path("salida").mkdir(exist_ok=True); pathlib.Path("salida/renombrar.txt").write_text("\n".join(L)); print("\n".join(L))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/renombrar.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-renombrar
          cp ../salida/* .
          git add -A && git commit -q -m "medicion r2"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-renombrar
