name: audit-overlay (one-off)

# Audita por qué las fotos del evento de prueba no muestran los logos:
#  1) confirma brand_overlay del evento + lista las 4 fotos (updated_at antes).
#  2) reprocesa (process_photo → cola fast) con el worker ACTUAL.
#  3) espera y confirma que updated_at cambió (reprocesadas).
#  4) trae los logs del worker + worker_fast → busca "brand overlay falló" (si el
#     overlay tira excepción) o el proceso normal.
#  5) re-aprueba las procesadas y deja el evento unlisted.

on:
  workflow_dispatch:
  push:
    branches: ["run-audit"]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: Instalar deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" "celery[redis]==5.6.3"

      - name: Auditar + reprocesar
        run: |
          set -uo pipefail
          gql() {
            curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" --data "$1"
          }
          vars_of() {
            local q='{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}'
            gql "$q" | jq '.data.variables // {}'
          }
          SVCS=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}')
          PGID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          RID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Redis")|.id')
          FID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="fotos")|.id')
          WID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="worker")|.id')
          WFID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="worker_fast")|.id')
          DBURL=$(vars_of "$PGID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          RDPUB=$(vars_of "$RID" | jq -r '.REDIS_PUBLIC_URL // empty')
          CBURL=$(vars_of "$FID" | jq -r '.CELERY_BROKER_URL // empty')
          SCHEME="${RDPUB%%://*}"; REST="${RDPUB#*://}"; AUTH="${REST%%/*}"
          DBIDX=$(printf '%s' "$CBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$DBIDX" ] && DBIDX=0
          BROKER="${SCHEME}://${AUTH}/${DBIDX}"

          echo "==================== 1) ESTADO + REPROCESO ===================="
          DBURL="$DBURL" BROKER="$BROKER" python3 - <<'PY'
          import os, time
          import psycopg
          from celery import Celery
          from kombu import Exchange, Queue

          conn = psycopg.connect(os.environ["DBURL"], connect_timeout=20); cur = conn.cursor()
          cur.execute("select id, brand_overlay, visibility, status from events_event where slug='surf-city-prueba-logos'")
          ev = cur.fetchone()
          print("Evento:", ev)  # (id, brand_overlay, visibility, status)
          eid = ev[0]
          cur.execute("select id, status, extract(epoch from updated_at)::bigint, (preview_key<>''), original_key "
                      "from photos_photo where event_id=%s and status<>'deleted' order by id", (eid,))
          photos = cur.fetchall()
          print(f"{len(photos)} fotos:")
          before = {}
          for pid, st, ua, hasprev, okey in photos:
              print(f"  id={pid} status={st} updated={ua} preview?={hasprev} original={okey[:40]}...")
              before[pid] = ua

          app = Celery(broker=os.environ["BROKER"])
          app.conf.task_default_queue = "celery"
          app.conf.task_queues = (
              Queue("fast", Exchange("fast", "direct"), routing_key="fast"),
              Queue("celery", Exchange("celery", "direct"), routing_key="celery"),
              Queue("faces", Exchange("faces", "direct"), routing_key="faces"),
          )
          for pid in before:
              r = app.send_task("photos.process_photo", args=[pid], queue="fast")
              print(f"  reencolada process_photo({pid}) task={r.id}")

          print("Esperando reproceso...")
          done = set()
          for i in range(20):
              time.sleep(6)
              cur.execute("select id, extract(epoch from updated_at)::bigint, status, (preview_key<>'') "
                          "from photos_photo where id = any(%s)", (list(before),))
              rows = cur.fetchall()
              for pid, ua, st, hasprev in rows:
                  if pid not in done and ua != before[pid]:
                      print(f"  id={pid} REPROCESADA (updated {before[pid]}->{ua}, status={st}, preview?={hasprev})")
                      done.add(pid)
              if len(done) == len(before):
                  break
          print(f"Reprocesadas: {len(done)}/{len(before)}")

          # re-aprobar las procesadas
          cur.execute("update photos_photo set status='approved' where event_id=%s and status='pending_review' and preview_key<>'' and thumbnail_key<>''", (eid,))
          print("Re-aprobadas:", cur.rowcount)
          conn.commit()
          PY

          echo
          echo "==================== 2) LOGS WORKER (buscando overlay) ===================="
          DALL=$(gql '{"query":"query($p:String!,$e:String!){ deployments(first:80, input:{projectId:$p, environmentId:$e}){ edges { node { id status createdAt service { name } } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}')
          for pair in "worker:$WID" "worker_fast:$WFID"; do
            NAME="${pair%%:*}"; SID2="${pair#*:}"
            DID=$(echo "$DALL" | jq -r --arg s "$NAME" '[.data.deployments.edges[].node|select(.service.name==$s)]|sort_by(.createdAt)|last|.id // empty')
            echo "--- $NAME (deploy $DID) ---"
            LQ='{"query":"query($d:String!){ deploymentLogs(deploymentId:$d, limit:200){ message } }","variables":{"d":"'"$DID"'"}}'
            gql "$LQ" | jq -r '.data.deploymentLogs[]?.message' | grep -iE "overlay|process_photo|Received task|Traceback|Error|brand" | tail -30 || echo "(sin líneas relevantes)"
            echo
          done
          echo "==================== FIN ===================="
