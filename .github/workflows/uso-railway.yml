name: uso-railway (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-uso"]
concurrency:
  group: uso-railway
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  uso:
    name: "consumo de Railway por servicio (solo lectura)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - name: Consultar consumo
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, json, requests, datetime as dt, pathlib

          API = "https://backboard.railway.app/graphql/v2"
          TOK = os.environ["RAILWAY_TOKEN"]
          PID = os.environ["PROJECT_ID"]
          H = {"Authorization": f"Bearer {TOK}", "Project-Access-Token": TOK,
               "Content-Type": "application/json"}
          out = pathlib.Path("salida"); crudo = {}

          def gql(nombre, q, v=None):
              r = requests.post(API, headers=H, json={"query": q, "variables": v or {}}, timeout=60)
              try:
                  d = r.json()
              except Exception:
                  d = {"http": r.status_code, "texto": r.text[:300]}
              crudo[nombre] = d
              return d

          # --- nombres de los servicios ---
          d = gql("servicios", 'query($id:String!){ project(id:$id){ name services{ edges{ node{ id name } } } } }', {"id": PID})
          nombres = {}
          for e in (((d.get("data") or {}).get("project") or {}).get("services") or {}).get("edges", []):
              nombres[e["node"]["id"]] = e["node"]["name"]

          MED = "[CPU_USAGE, MEMORY_USAGE_GB, NETWORK_TX_GB, DISK_USAGE_GB, EPHEMERAL_DISK_USAGE_GB, BACKUP_USAGE_GB]"
          def uso(nombre, desde, hasta):
              for tipo in ("DateTime", "String"):
                  q = (f'query($p:String!,$s:{tipo},$e:{tipo}){{ usage(projectId:$p, measurements:{MED}, '
                       f'groupBy:[SERVICE_ID], startDate:$s, endDate:$e){{ measurement value tags{{ serviceId }} }} }}')
                  d = gql(f"{nombre}[{tipo}]", q, {"p": PID, "s": desde.isoformat(), "e": hasta.isoformat()})
                  if "errors" not in d and (d.get("data") or {}).get("usage") is not None:
                      return d["data"]["usage"]
              return None

          ahora = dt.datetime.now(dt.UTC).replace(microsecond=0)
          inicio_mes = ahora.replace(day=1, hour=0, minute=0, second=0)
          minutos = (ahora - inicio_mes).total_seconds() / 60

          # Precios publicados de Railway (por minuto). Si cambiaron, el
          # "estimatedUsage" de abajo sirve para contrastar.
          P_CPU = 20 / 43200      # $20 por vCPU al mes
          P_RAM = 10 / 43200      # $10 por GB de RAM al mes
          P_EGR = 0.05            # $0.05 por GB de salida
          P_DSK = 0.15 / 43200    # $0.15 por GB de volumen al mes

          def costo(m, v):
              return {"CPU_USAGE": v * P_CPU, "MEMORY_USAGE_GB": v * P_RAM,
                      "NETWORK_TX_GB": v * P_EGR, "DISK_USAGE_GB": v * P_DSK,
                      "BACKUP_USAGE_GB": v * P_DSK}.get(m, 0.0)

          def tabla(filas):
              por = {}
              for f in filas or []:
                  sid = (f.get("tags") or {}).get("serviceId") or "?"
                  por.setdefault(sid, {})[f["measurement"]] = f["value"]
              return por

          mes = tabla(uso("mes", inicio_mes, ahora))
          lineas = [f"Periodo: {inicio_mes:%Y-%m-%d} -> {ahora:%Y-%m-%d %H:%M} UTC ({minutos/1440:.1f} dias)", ""]
          lineas.append(f"{'servicio':<22}{'CPU prom':>10}{'RAM prom':>10}{'salida':>10}{'$ CPU':>9}{'$ RAM':>9}{'$ red':>8}{'$ disco':>9}{'$ total':>9}")
          total = 0.0; resumen = []
          for sid, m in mes.items():
              c = {k: costo(k, v) for k, v in m.items()}
              t = sum(c.values()); total += t
              resumen.append((t, sid, m, c))
          for t, sid, m, c in sorted(resumen, reverse=True):
              lineas.append(
                  f"{nombres.get(sid, sid[:8]):<22}"
                  f"{m.get('CPU_USAGE',0)/minutos:>8.2f}vC"
                  f"{m.get('MEMORY_USAGE_GB',0)/minutos:>8.2f}GB"
                  f"{m.get('NETWORK_TX_GB',0):>8.1f}GB"
                  f"{c.get('CPU_USAGE',0):>9.2f}{c.get('MEMORY_USAGE_GB',0):>9.2f}"
                  f"{c.get('NETWORK_TX_GB',0):>8.2f}"
                  f"{c.get('DISK_USAGE_GB',0)+c.get('BACKUP_USAGE_GB',0):>9.2f}{t:>9.2f}")
          lineas += ["", f"TOTAL del mes hasta hoy: ${total:.2f}",
                     f"Proyeccion lineal a 30 dias: ${total / (minutos/1440) * 30:.2f}"]

          # --- por dia, para ver los picos de los eventos ---
          lineas += ["", "Por dia ($ estimado por servicio):"]
          dia = inicio_mes; filas_dia = []
          while dia < ahora:
              fin = min(dia + dt.timedelta(days=1), ahora)
              u = tabla(uso(f"dia-{dia:%d}", dia, fin))
              por_serv = {nombres.get(s, s[:8]): sum(costo(k, v) for k, v in m.items()) for s, m in u.items()}
              filas_dia.append((dia, por_serv))
              dia = fin
          servs = sorted({s for _, p in filas_dia for s in p})
          lineas.append(f"{'dia':<7}" + "".join(f"{s[:11]:>12}" for s in servs) + f"{'total':>9}")
          for d_, p in filas_dia:
              lineas.append(f"{d_:%m-%d}  " + "".join(f"{p.get(s,0):>12.2f}" for s in servs) + f"{sum(p.values()):>9.2f}")

          # --- lo que Railway mismo estima ---
          d = gql("estimado", f'query($p:String!){{ estimatedUsage(projectId:$p, measurements:{MED}){{ measurement estimatedValue projectId }} }}', {"p": PID})
          lineas += ["", "estimatedUsage de Railway (fin de periodo):", json.dumps(d.get("data") or d.get("errors"), indent=1)[:1500]]

          (out / "uso.txt").write_text("\n".join(lineas))
          # Solo errores en el crudo: nada de datos sensibles, no hay variables de entorno aca.
          errores = {k: v.get("errors") for k, v in crudo.items() if isinstance(v, dict) and v.get("errors")}
          (out / "errores.json").write_text(json.dumps(errores, indent=1)[:20000])
          print("\n".join(lineas[:40]))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/uso.txt
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-uso
          cp ../salida/* .
          git add -A && git commit -q -m "consumo railway"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-uso
