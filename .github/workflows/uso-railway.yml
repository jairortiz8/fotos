name: uso-railway (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-uso"]
concurrency:
  group: uso-railway
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  uso:
    name: "consumo de Railway por servicio (solo lectura)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - name: Consultar consumo
        run: |
          mkdir -p salida
          python3 - <<'PYX'
          import os, json, requests, datetime as dt, pathlib
          API = "https://backboard.railway.app/graphql/v2"
          TOK = os.environ["RAILWAY_TOKEN"]; PID = os.environ["PROJECT_ID"]
          H = {"Authorization": f"Bearer {TOK}", "Project-Access-Token": TOK, "Content-Type": "application/json"}
          res = {}
          def gql(nombre, q, v=None):
              r = requests.post(API, headers=H, json={"query": q, "variables": v or {}}, timeout=60)
              try: d = r.json()
              except Exception: d = {"http": r.status_code, "texto": r.text[:300]}
              res[nombre] = d; return d
          MED = "[CPU_USAGE, MEMORY_USAGE_GB, NETWORK_TX_GB, DISK_USAGE_GB, BACKUP_USAGE_GB]"
          P = {"CPU_USAGE": 20/43200, "MEMORY_USAGE_GB": 10/43200, "NETWORK_TX_GB": 0.05,
               "DISK_USAGE_GB": 0.15/43200, "BACKUP_USAGE_GB": 0.15/43200}
          def plata(filas, clave):
              t = {}
              for f in filas or []:
                  k = (f.get("tags") or {}).get(clave) or "?"
                  t.setdefault(k, {}).setdefault(f["measurement"], 0)
                  t[k][f["measurement"]] += f["value"]
              return {k: {"$": round(sum(P.get(m, 0)*v for m, v in d.items()), 2),
                          "detalle": {m: round(P.get(m, 0)*v, 2) for m, v in d.items()}} for k, d in t.items()}

          # 1) quien soy / que proyectos veo
          gql("me", "query{ me{ name workspaces{ id name } } }")
          gql("proyectos", "query{ projects{ edges{ node{ id name } } } }")
          # 2) este proyecto, SIN fechas: Railway usa el periodo de facturacion actual
          d = gql("proyecto_periodo", f'query($p:String!){{ usage(projectId:$p, measurements:{MED}, groupBy:[SERVICE_ID]){{ measurement value tags{{ serviceId }} }} }}', {"p": PID})
          res["_proyecto_periodo_$"] = plata((d.get("data") or {}).get("usage"), "serviceId")
          # 3) toda la cuenta, agrupado por proyecto, este mes
          ini = dt.datetime.now(dt.UTC).replace(day=1, hour=0, minute=0, second=0, microsecond=0).isoformat()
          fin = dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat()
          d = gql("cuenta_mes", f'query($s:DateTime,$e:DateTime){{ usage(measurements:{MED}, groupBy:[PROJECT_ID], startDate:$s, endDate:$e){{ measurement value tags{{ projectId }} }} }}', {"s": ini, "e": fin})
          res["_cuenta_mes_$"] = plata((d.get("data") or {}).get("usage"), "projectId")
          d = gql("cuenta_periodo", f'query{{ usage(measurements:{MED}, groupBy:[PROJECT_ID]){{ measurement value tags{{ projectId }} }} }}')
          res["_cuenta_periodo_$"] = plata((d.get("data") or {}).get("usage"), "projectId")
          # 4) estimado de Railway, a nivel cuenta (sin projectId)
          gql("estimado_cuenta", f'query{{ estimatedUsage(measurements:{MED}){{ measurement estimatedValue projectId }} }}')
          # 5) este proyecto por entorno (por si hay entornos de PR o staging corriendo)
          d = gql("entornos", f'query($p:String!,$s:DateTime,$e:DateTime){{ usage(projectId:$p, measurements:{MED}, groupBy:[ENVIRONMENT_ID], startDate:$s, endDate:$e){{ measurement value tags{{ environmentId }} }} }}', {"p": PID, "s": ini, "e": fin})
          res["_entornos_mes_$"] = plata((d.get("data") or {}).get("usage"), "environmentId")
          pathlib.Path("salida").mkdir(exist_ok=True)
          pathlib.Path("salida/uso2.json").write_text(json.dumps(res, indent=1)[:60000])
          print(json.dumps({k: v for k, v in res.items() if k.startswith("_")}, indent=1))
          PYX
      - name: Publicar
        if: always()
        run: |
          mkdir -p salida && touch salida/uso2.json
          git init -q pub && cd pub
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -q --orphan resultado-uso2
          cp ../salida/* .
          git add -A && git commit -q -m "consumo railway"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" resultado-uso2
