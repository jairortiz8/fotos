name: prod-finalize (one-off)

# Cierra la verificación: restaura el evento de prueba y confirma EN VIVO el
# pipeline (preview/thumb/branded + OCR + caras) sobre el deploy actual.
# DB robusta: keepalives + reconexión por si el proxy corta.

on:
  workflow_dispatch:
  push:
    branches: ["run-finalize"]

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" "celery[redis]==5.6.3"
      - name: restore + confirm
        run: |
          set -uo pipefail
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          SVCS=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}')
          PGID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          RID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Redis")|.id')
          FID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="fotos")|.id')
          export DBURL=$(vars_of "$PGID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          RDPUB=$(vars_of "$RID" | jq -r '.REDIS_PUBLIC_URL // empty')
          CBURL=$(vars_of "$FID" | jq -r '.CELERY_BROKER_URL // empty')
          SCHEME="${RDPUB%%://*}"; REST="${RDPUB#*://}"; AUTH="${REST%%/*}"
          DBIDX=$(printf '%s' "$CBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$DBIDX" ] && DBIDX=0
          export BROKER="${SCHEME}://${AUTH}/${DBIDX}"

          python3 - <<'PY'
          import os, time
          import psycopg
          from celery import Celery
          from kombu import Exchange, Queue

          def connect():
              return psycopg.connect(
                  os.environ["DBURL"], connect_timeout=20, autocommit=True,
                  keepalives=1, keepalives_idle=15, keepalives_interval=5, keepalives_count=5,
              )
          def q1(sql, a=()):
              for _ in range(3):
                  try:
                      with connect() as c, c.cursor() as cur:
                          cur.execute(sql, a); r = cur.fetchone(); return r[0] if r else None
                  except psycopg.OperationalError:
                      time.sleep(2)
              raise RuntimeError("db unreachable")
          def run(sql, a=()):
              for _ in range(3):
                  try:
                      with connect() as c, c.cursor() as cur:
                          cur.execute(sql, a); return
                  except psycopg.OperationalError:
                      time.sleep(2)
              raise RuntimeError("db unreachable")

          eid = q1("select id from events_event where slug='surf-city-prueba-logos'")
          ids = []
          with connect() as c, c.cursor() as cur:
              cur.execute("select id from photos_photo where event_id=%s and status<>'deleted' order by id", (eid,))
              ids = [r[0] for r in cur.fetchall()]
          print("Restaurando/confirmando fotos del evento de prueba:", ids)

          # Forzar regeneración completa (keys + OCR + caras) de forma idempotente.
          for pid in ids:
              run("update photos_photo set has_faces_detected=false, has_bibs_detected=false where id=%s", (pid,))
          app = Celery(broker=os.environ["BROKER"]); app.conf.task_default_queue = "celery"
          app.conf.task_queues = (Queue("fast", Exchange("fast", "direct"), routing_key="fast"),)
          for pid in ids:
              app.send_task("photos.process_photo", args=[pid], queue="fast")
          print("encolado process_photo x", len(ids), "→ esperando...")

          for _ in range(50):
              time.sleep(6)
              done = q1("select count(*) from photos_photo where event_id=%s and preview_key<>'' and thumbnail_key<>'' and branded_key<>'' and has_faces_detected", (eid,))
              if done == len(ids): break
          # re-aprobar
          run("update photos_photo set status='approved' where event_id=%s and status='pending_review' and preview_key<>'' and thumbnail_key<>''", (eid,))

          # Reporte final del evento de prueba
          tot = q1("select count(*) from photos_photo where event_id=%s and status<>'deleted'", (eid,))
          appr = q1("select count(*) from photos_photo where event_id=%s and status='approved'", (eid,))
          wbrand = q1("select count(*) from photos_photo where event_id=%s and branded_key<>''", (eid,))
          embs = q1("select count(*) from photos_faceembedding f join photos_photo p on p.id=f.photo_id where p.event_id=%s", (eid,))
          bibs = q1("select count(*) from photos_bib b join photos_photo p on p.id=b.photo_id where p.event_id=%s", (eid,))
          print(f"\nEVENTO DE PRUEBA (restaurado): fotos={tot} aprobadas={appr} branded={wbrand} caras={embs} dorsales={bibs}")
          ok = (appr == tot) and (wbrand == tot) and (embs >= tot)
          print("PIPELINE EN VIVO:", "✓ preview+thumb+branded+caras OK en TODAS" if ok else "revisar (ver conteos)")
          PY
          echo "==================== FIN ===================="
