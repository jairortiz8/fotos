name: prod-reocr-9719 (one-off)

# Despliega el filtro nuevo y re-corre el OCR de la foto 9719 (la que tenía la
# tira alucinada) para ver si recupera el dorsal real (615) conservando sólo los
# sueltos.

on:
  workflow_dispatch:
  push:
    branches: ["run-reocr"]

jobs:
  reocr:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      SHA: 65ab76caea15be1bbcf9aa4cb2529b4e7ac6823b
      PID: "9719"
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" "celery[redis]==5.6.3"
      - name: deploy + reocr
        run: |
          set -uo pipefail
          SHORT="${SHA:0:7}"
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          deploy(){ gql '{"query":"mutation($s:String!,$e:String!,$c:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }","variables":{"s":"'"$1"'","e":"'"$ENV_ID"'","c":"'"$SHA"'"}}' | jq -c '.data // .errors'; }
          SVCS=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}')
          PGID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          RID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="Redis")|.id')
          FID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="fotos")|.id')
          WID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="worker")|.id')
          WFID=$(echo "$SVCS" | jq -r '.data.project.services.edges[].node|select(.name=="worker_fast")|.id')
          echo "web -> $(deploy "$FID")"; echo "worker -> $(deploy "$WID")"; echo "worker_fast -> $(deploy "$WFID")"
          for i in $(seq 1 30); do
            ST=$(gql '{"query":"query($p:String!,$e:String!){ deployments(first:120, input:{projectId:$p, environmentId:$e}){ edges { node { status createdAt meta service { name } } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}' \
              | jq -r --arg f "$SHORT" '[.data.deployments.edges[].node]|map(select(.service.name|test("^(worker|fotos)")))|group_by(.service.name)|map(sort_by(.createdAt)|last)|map({s:.service.name,st:.status,c:((.meta.commitHash//"?")|tostring[0:7])})')
            OK=$(echo "$ST" | jq -r --arg f "$SHORT" '([.[]|select(.st=="SUCCESS" and .c==$f)]|length) as $g|if(length>=3 and $g>=3)then"yes"else"no"end')
            echo "intento $i: $(echo "$ST"|jq -c '.')"; [ "$OK" = "yes" ] && { echo ">> listo"; break; }; sleep 30
          done

          export DBURL=$(vars_of "$PGID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          RDPUB=$(vars_of "$RID" | jq -r '.REDIS_PUBLIC_URL // empty')
          CBURL=$(vars_of "$FID" | jq -r '.CELERY_BROKER_URL // empty')
          SCHEME="${RDPUB%%://*}"; REST="${RDPUB#*://}"; AUTH="${REST%%/*}"
          DBIDX=$(printf '%s' "$CBURL" | sed -nE 's#.*/([0-9]+)(\?.*)?$#\1#p'); [ -z "$DBIDX" ] && DBIDX=0
          export BROKER="${SCHEME}://${AUTH}/${DBIDX}"
          export PID
          python3 - <<'PY'
          import os, time
          import psycopg
          from celery import Celery
          from kombu import Exchange, Queue
          c=psycopg.connect(os.environ["DBURL"], connect_timeout=20); c.autocommit=True; cur=c.cursor()
          pid=int(os.environ["PID"])
          cur.execute("delete from photos_bib where photo_id=%s",(pid,))
          cur.execute("update photos_photo set has_bibs_detected=false where id=%s",(pid,))
          app=Celery(broker=os.environ["BROKER"]); app.conf.task_default_queue="celery"
          app.conf.task_queues=(Queue("fast",Exchange("fast","direct"),routing_key="fast"),)
          app.send_task("photos.run_ocr_on_photo", args=[pid], queue="fast")
          print(f"re-OCR encolado para foto {pid} (con el filtro nuevo)...")
          for _ in range(40):
              time.sleep(6)
              cur.execute("select has_bibs_detected from photos_photo where id=%s",(pid,))
              if cur.fetchone()[0]: break
          cur.execute("select number, source from photos_bib where photo_id=%s order by number",(pid,))
          rows=cur.fetchall()
          print(f"\nDorsales de la foto {pid} tras el re-OCR: {len(rows)}")
          for num,src in rows: print(f"  {num}  ({src})")
          if not rows:
              print("  → 0 dorsales: la alucinación era un bloque consecutivo que incluía el número real,")
              print("     así que no se puede separar automáticamente. El admin lo agrega a mano (o se busca por selfie).")
          PY
          echo "==================== FIN ===================="
