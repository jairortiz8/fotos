name: test-debug (one-off)

on:
  workflow_dispatch:
  push:
    branches: ["run-testdebug"]

concurrency:
  group: test-debug
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: lint + types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runfoto
          POSTGRES_PASSWORD: runfoto
          POSTGRES_DB: runfoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runfoto -d runfoto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-key-not-real
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://runfoto:runfoto@localhost:5432/runfoto
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SITE_NAME: "find your foto"
      SITE_DOMAIN: localhost:8000
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador

    steps:
      - uses: actions/checkout@v4

      # cv2 (dep de InsightFace) necesita estas libs para importar; sin ellas
      # los tests de face_recognition fallan con "libGL.so.1 / libxcb.so.1:
      # cannot open shared object file" (mismo problema que el Dockerfile).
      - name: Install system libs for OpenCV/onnxruntime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1 libxcb1 libsm6 libxext6 libxrender1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node 20 (para Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Compila el CSS de Tailwind (valida que el build no se rompió) y
      # verifica el presupuesto de tamaño del bundle (Fase 7).
      - name: Build Tailwind CSS
        run: |
          npm --prefix theme/static_src ci
          npm --prefix theme/static_src run build

      - name: Bundle-size budget
        run: bash scripts/check_bundle_size.sh

      - name: Tests
        run: |
          set +e
          pytest -m "not slow and not e2e" -p no:cacheprovider --no-cov -q \
            > /tmp/salida.txt 2>&1
          echo "exit=$?" > /tmp/resultado.txt
          {
            echo "=== FALLOS ==="
            grep -E "^(FAILED|ERROR)" /tmp/salida.txt | head -40
            echo
            echo "=== DETALLE ==="
            sed -n '/=========================== FAILURES/,$p' /tmp/salida.txt | head -200
            echo
            echo "=== RESUMEN ==="
            tail -5 /tmp/salida.txt
          } >> /tmp/resultado.txt
          exit 0

      # El log de Actions no sirve para leer esto: el teardown de los service
      # containers (postgres + redis) ocupa el final y tapa el resumen. Lo
      # dejamos en una rama y se lee por la API.
      - name: Publicar el resultado en una rama
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          git checkout --orphan resultado-tests
          git rm -rf --cached . > /dev/null
          rm -rf apps config templates tests theme scripts docs locale static .github
          cp /tmp/resultado.txt resultado.txt
          git add -f resultado.txt
          git commit -q -m "resultado de los tests"
          git push -f origin resultado-tests
