name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  verificar:
    name: Dorsal y selfie con los workers apagados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      SITE: https://findyourfoto.com
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]"

      - name: Estado de los servicios y credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== SERVICIOS ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; st=(n.get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
              print(f"  {n['serviceName']:<14} {st}")

          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          v=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          url=v.get("DATABASE_PUBLIC_URL")
          if not url: raise SystemExit("no se pudo leer DATABASE_PUBLIC_URL")
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"DATABASE_URL={url}\n")
          PYX

      - name: Buscar por dorsal y por selfie de verdad
        run: |
          python3 - <<'PYX'
          import html, io, os, re, requests, psycopg
          SITE=os.environ["SITE"]

          # Datos REALES sacados de la base: un dorsal que existe y una foto
          # aprobada que tiene una cara indexada.
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""
                  SELECT e.slug, b.number, count(*)
                  FROM photos_bib b
                  JOIN photos_photo p ON p.id = b.photo_id
                  JOIN events_event e ON e.id = p.event_id
                  WHERE p.status = 'approved'
                    AND e.slug = 'garmin-runners-girls-5k-social-run'
                  GROUP BY e.slug, b.number
                  HAVING count(*) BETWEEN 3 AND 40
                  ORDER BY 3 DESC LIMIT 1
              """)
              slug, dorsal, n_dorsal = cur.fetchone()
              cur.execute("""
                  SELECT p.id
                  FROM photos_faceembedding f
                  JOIN photos_photo p ON p.id = f.photo_id
                  JOIN events_event e ON e.id = p.event_id
                  WHERE e.slug = %s AND p.status = 'approved' AND p.preview_key <> ''
                  ORDER BY f.id LIMIT 1
              """, (slug,))
              (photo_id,) = cur.fetchone()

          print(f"[base] evento '{slug}' · dorsal #{dorsal} en {n_dorsal} fotos"
                f" · foto con cara id={photo_id}")
          s = requests.Session()

          # --- 1) BUSQUEDA POR DORSAL ---
          r = s.get(f"{SITE}/eventos/{slug}/", params={"bib": dorsal}, timeout=60)
          encontradas = len(set(re.findall(r"/foto/(\d+)", r.text)))
          print(f"\n[DORSAL] HTTP {r.status_code} · fotos distintas en la pagina: {encontradas}")

          # --- 2) BUSQUEDA POR SELFIE ---
          # Se baja el preview de una foto publicada y se manda como selfie:
          # el mismo camino que hace un corredor desde el celular.
          pag = s.get(f"{SITE}/eventos/{slug}/foto/{photo_id}/", timeout=60)
          m = re.search(r'<img[^>]+src="(https://[^"]+)"', pag.text)
          if not m:
              raise SystemExit("no se encontro la imagen del preview en el lightbox")
          url_preview = html.unescape(m.group(1))
          img = s.get(url_preview, timeout=120)
          print(f"[selfie] preview bajado: HTTP {img.status_code} · {len(img.content)//1024} KB")
          if img.status_code != 200 or len(img.content) < 5000:
              raise SystemExit("no se pudo bajar el preview para usarlo de selfie")

          form = s.get(f"{SITE}/eventos/{slug}/buscar-selfie/", timeout=60)
          csrf = s.cookies.get("csrftoken") or ""
          print(f"[selfie] formulario: HTTP {form.status_code}")

          r = s.post(f"{SITE}/eventos/{slug}/buscar-selfie/",
                     data={"csrfmiddlewaretoken": csrf},
                     files={"selfie": ("selfie.jpg", io.BytesIO(img.content), "image/jpeg")},
                     headers={"Referer": f"{SITE}/eventos/{slug}/buscar-selfie/"},
                     timeout=240)
          txt = r.text.lower()
          halladas = len(set(re.findall(r"/foto/(\d+)", r.text)))
          print(f"\n[SELFIE] HTTP {r.status_code} · fotos distintas: {halladas}")
          for pista, etiqueta in (
              ("varias caras", "respondio 'varias caras' (detecto mas de una)"),
              ("no detectamos", "respondio 'no detectamos una cara'"),
              ("no encontramos", "respondio 'no encontramos fotos'"),
              ("no esta disponible", "la funcion figura como no disponible"),
          ):
              if pista in txt: print(f"         -> {etiqueta}")

          modelo_ok = r.status_code == 200 and "no esta disponible" not in txt
          print("\n  RESULTADO: el modelo facial corre en el WEB y responde"
                " sin worker." if modelo_ok else
                "\n  RESULTADO: REVISAR, la busqueda por selfie no respondio bien.")
          PYX
