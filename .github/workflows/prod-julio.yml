name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  apagar:
    name: Apagar workers (deploymentStop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests

      - name: Detener worker, worker_fast y beat
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          def gql(q, v=None):
              return requests.post(API,headers=H,json={"query":q,"variables":v or {}},timeout=60).json()

          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status } } } } } }"""
          d=gql(Q,{"e":os.environ["ENV_ID"]})["data"]
          APAGAR={"worker","worker_fast","worker-fast","beat"}
          objetivos=[]
          print("=== ANTES ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              print(f"  {n['serviceName']:<14} {dep.get('status') or 'SIN DEPLOY'}")
              if n["serviceName"] in APAGAR and dep.get("id") and dep.get("status")=="SUCCESS":
                  objetivos.append((n["serviceName"], dep["id"]))

          # `numReplicas: 0` lo rechaza Railway ("Invalid input"): el mínimo es 1.
          # La forma correcta de dejar un servicio sin correr es detener su
          # deployment. El servicio y su configuración quedan intactos; se revive
          # con un redeploy (o solo con pushear a main, que los redeploya todos).
          M="""mutation($id:String!){ deploymentStop(id:$id) }"""
          print("\n=== APAGANDO ===")
          for nombre, dep_id in objetivos:
              r=gql(M,{"id":dep_id})
              if r.get("errors"):
                  print(f"  {nombre}: FALLO -> {r['errors'][0].get('message')}")
              else:
                  print(f"  {nombre}: detenido")
          if not objetivos:
              print("  (no habia nada corriendo para detener)")
          PYX

      - name: Esperar y confirmar
        run: sleep 90

      - name: Estado final
        if: always()
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== ESTADO FINAL ===")
          apagados=arriba=0
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; st=(n.get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
              debe_estar_apagado = n["serviceName"] in ("worker","worker_fast","worker-fast","beat")
              ok = (st != "SUCCESS") if debe_estar_apagado else (st == "SUCCESS")
              print(f"  {'OK ' if ok else '!! '} {n['serviceName']:<14} {st}")
              if debe_estar_apagado and st != "SUCCESS": apagados+=1
              if not debe_estar_apagado and st == "SUCCESS": arriba+=1
          print(f"\n  workers apagados: {apagados}   servicios vivos (web/db/redis): {arriba}")
          PYX
