name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Mas procesos al worker liviano, en caliente"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests celery redis

      - name: Agrandar el pool del worker liviano
        run: |
          python3 - <<'PYX'
          import os, time, requests, redis as _r
          from celery import Celery
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          ids={n["node"]["serviceName"]:n["node"]["serviceId"]
               for n in d["environment"]["serviceInstances"]["edges"]}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          rd=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":ids["Redis"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          broker=rd["REDIS_PUBLIC_URL"]
          app=Celery(broker=broker); rc=_r.from_url(broker)

          insp=app.control.inspect(timeout=10)
          colas=insp.active_queues() or {}
          stats=insp.stats() or {}
          print("=== WORKERS ===")
          liviano=None
          for nodo, qs in colas.items():
              nombres=sorted(q["name"] for q in qs)
              procs=len((stats.get(nodo,{}).get("pool",{}) or {}).get("processes",[]) or [])
              print(f"  {nodo}  colas={nombres}  procesos={procs}")
              # El liviano es el que atiende `fast` SIN atender `faces` (ese es
              # el pesado, que carga el modelo facial y no hay que agrandar).
              if "fast" in nombres and "faces" not in nombres:
                  liviano=nodo
          if liviano is None:
              raise SystemExit("no encontre un worker de `fast` que no atienda `faces`")

          antes_cola={c: rc.llen(c) for c in ("celery","fast")}
          antes_procs=len(stats[liviano]["pool"]["processes"])
          print(f"\nliviano = {liviano}  procesos antes = {antes_procs}")
          print(f"cola antes = {antes_cola}")

          OBJETIVO=8
          crecer=max(0, OBJETIVO-antes_procs)
          if crecer==0:
              print("ya tiene suficientes procesos, no hago nada")
          else:
              print(f"agregando {crecer} procesos (en caliente, sin reiniciar)...")
              app.control.pool_grow(crecer, destination=[liviano])
              time.sleep(12)

          st2=app.control.inspect(timeout=10).stats() or {}
          ahora=len((st2.get(liviano,{}).get("pool",{}) or {}).get("processes",[]) or [])
          print(f"procesos ahora = {ahora}")

          print("\nmidiendo el avance de la cola durante 60s...")
          m0=rc.llen("fast"); time.sleep(60); m1=rc.llen("fast")
          print(f"  cola fast: {m0} -> {m1}  (drenando {m0-m1} tareas en 60s)")
          if m1 and (m0-m1)>0:
              print(f"  a este ritmo se vacia en ~{round(m1/((m0-m1)/60)/60,1)} min")
          print("\n=== RESUMEN ===")
          print(f"  worker liviano: {antes_procs} -> {ahora} procesos")
          print(f"  cola fast: {antes_cola['fast']} -> {m1}")
          print("  el worker pesado (caras) NO se toco")
          PYX
