name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Ficha de la foto 45833"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]"

      - name: Deploys y ficha de la foto
        run: |
          python3 - <<'PYX'
          import os, requests, psycopg
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt meta } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== DEPLOYS (hora UTC) ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              sha=((dep.get("meta") or {}).get("commitHash") or "")[:8]
              print(f"  {n['serviceName']:<14} {dep.get('status','SIN DEPLOY'):<10}"
                    f" {dep.get('createdAt','')}  commit={sha}")

          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          url=pg.get("DATABASE_PUBLIC_URL")
          print(f"::add-mask::{url}")

          with psycopg.connect(url) as cx, cx.cursor() as cur:
              cur.execute("""
                  SELECT p.id, e.slug, e.brand_overlay, p.status, p.created_at,
                         p.updated_at, p.preview_key, p.branded_key, p.original_key
                  FROM photos_photo p JOIN events_event e ON e.id = p.event_id
                  ORDER BY p.id DESC LIMIT 5
              """)
              print("\n=== ULTIMAS 5 FOTOS (hora UTC) ===")
              for r in cur.fetchall():
                  print(f"  id={r[0]}  evento={r[1]}  overlay={r[2]!r}  estado={r[3]}")
                  print(f"      subida  {r[4]:%Y-%m-%d %H:%M:%S}   procesada {r[5]:%Y-%m-%d %H:%M:%S}")
                  print(f"      original={r[8]}")
                  print(f"      preview ={r[6] or '(vacio)'}")
                  print(f"      branded ={r[7] or '(vacio)'}")
          PYX
