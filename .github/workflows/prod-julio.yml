name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  urgente:
    name: URGENTE - por que no procesa el worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests boto3

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: 1 - Logs del worker en Railway
        if: always()
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          dep_id=None
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]
              if n["serviceName"]=="worker":
                  dep=n.get("latestDeployment") or {}
                  dep_id=dep.get("id"); print(f"  worker deploy {dep_id} estado={dep.get('status')}")
          if not dep_id:
              raise SystemExit(0)
          ql="""query($d:String!,$n:Int!){ deploymentLogs(deploymentId:$d, limit:$n){ timestamp message severity } }"""
          try:
              logs=gql(ql,{"d":dep_id,"n":250})["data"]["deploymentLogs"]
          except Exception as exc:
              print(f"  no pude traer logs: {exc}"); raise SystemExit(0)
          print(f"\n=== ULTIMAS {len(logs)} LINEAS DEL WORKER ===")
          for l in logs[-250:]:
              print(f"  {(l.get('timestamp') or '')[:19]} {(l.get('message') or '')[:190]}")
          PYX

      - name: 2 - Estado real de las fotos del evento
        run: |
          python3 - <<'PYX'
          import os, psycopg
          SLUG = "garmin-runners-girls-5k-social-run"
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug = %s", (SLUG,))
              eid = cur.fetchone()[0]
              cur.execute("""SELECT status, count(*),
                                    min(created_at), max(created_at)
                               FROM photos_photo WHERE event_id = %s
                              GROUP BY 1 ORDER BY 2 DESC""", (eid,))
              print("=== FOTOS POR ESTADO ===")
              for st, n, prim, ult in cur.fetchall():
                  print(f"  {st:<20} {n:<6} primera={prim:%H:%M:%S} ultima={ult:%H:%M:%S}")

              cur.execute("""SELECT count(*),
                             EXTRACT(EPOCH FROM (now() - min(created_at)))/60,
                             count(*) FILTER (WHERE preview_key <> ''),
                             count(*) FILTER (WHERE thumbnail_key <> ''),
                             count(*) FILTER (WHERE width > 0)
                        FROM photos_photo
                       WHERE event_id = %s AND status IN ('processing','uploading')""", (eid,))
              n, mins, prev, thumb, dim = cur.fetchone()
              print(f"\n=== LAS TRABADAS ===")
              print(f"  {n} en processing/uploading")
              if mins: print(f"  la mas vieja entro hace {mins:.0f} minutos")
              print(f"  con preview: {prev}   con thumbnail: {thumb}   con dimensiones leidas: {dim}")
              print("  -> si TODO esta en 0, el worker no toco NINGUNA: no esta consumiendo la cola")

              cur.execute("""SELECT count(*) FROM photos_faceembedding fe
                              JOIN photos_photo p ON p.id = fe.photo_id
                             WHERE p.event_id = %s""", (eid,))
              print(f"  caras indexadas en el evento: {cur.fetchone()[0]}")
          PYX

      - name: 3 - Cuanto hay encolado en Redis
        if: always()
        timeout-minutes: 4
        run: |
          pip install --quiet redis
          python3 - <<'PYX'
          import os, requests, redis
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q1='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          d=requests.post(API,headers=H,json={"query":q1,"variables":{"e":os.environ["ENV_ID"]}},timeout=40).json()
          rid=next((e["node"]["serviceId"] for e in d["data"]["environment"]["serviceInstances"]["edges"]
                    if e["node"]["serviceName"].lower().startswith("redis")), None)
          if not rid: print("  sin servicio Redis"); raise SystemExit(0)
          q2='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":rid}
          vs=(requests.post(API,headers=H,json={"query":q2,"variables":v},timeout=40)
              .json().get("data",{}) or {}).get("variables") or {}
          url=vs.get("REDIS_PUBLIC_URL")
          if not url: print(f"  sin REDIS_PUBLIC_URL; claves: {sorted(vs)[:12]}"); raise SystemExit(0)
          print(f"::add-mask::{url}")
          r=redis.from_url(url, socket_timeout=15, socket_connect_timeout=15)
          print(f"  ping: {r.ping()}")
          # Solo la cola por defecto de celery, sin recorrer todo el keyspace.
          for nombre in ("celery", "celery.priority", "default"):
              try: print(f"  cola {nombre!r}: {r.llen(nombre)} tareas esperando")
              except Exception as exc: print(f"  cola {nombre!r}: {exc}")
          try:
              print(f"  claves totales en la base: {r.dbsize()}")
              print(f"  memoria: {r.info('memory').get('used_memory_human')}")
          except Exception as exc: print(f"  info: {exc}")
          PYX
