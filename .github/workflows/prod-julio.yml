name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  limpiar:
    name: recuperar la medicion y limpiar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests boto3

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Que dejo la prueba (y cuanto tardo de verdad)
        run: |
          python3 - <<'PYX'
          import os, psycopg
          SLUG = "garmin-runners-girls-5k-social-run"
          NOMBRE = "PRUEBA (borrar) - Claude"

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug = %s", (SLUG,))
              eid = cur.fetchone()[0]
              cur.execute("""SELECT id, photos_uploaded, is_active FROM photographers_photographerlink
                              WHERE event_id = %s AND photographer_name = %s""", (eid, NOMBRE))
              link = cur.fetchone()
              if link is None:
                  print("  no hay link de prueba (nada que limpiar)")
                  raise SystemExit(0)
              link_id, subidas, activo = link
              print(f"  link de prueba id={link_id} activo={activo} contador_subidas={subidas}")

              cur.execute("""SELECT id, status, file_size, width, height,
                                    created_at, updated_at,
                                    preview_key <> '', thumbnail_key <> '',
                                    has_faces_detected, has_bibs_detected
                               FROM photos_photo WHERE photographer_link_id = %s
                              ORDER BY id""", (link_id,))
              fotos = cur.fetchall()

              print(f"\n=== LO QUE LLEGO: {len(fotos)} fotos ===")
              if not fotos:
                  print("  NINGUNA. La subida no llego al servidor.")
              for (pid, st, tam, w, h, creada, actualizada, prev, thumb, caras, dorsales) in fotos:
                  seg = (actualizada - creada).total_seconds()
                  cur.execute("SELECT count(*), count(*) FILTER (WHERE avatar_key <> '') FROM photos_faceembedding WHERE photo_id = %s", (pid,))
                  ncaras, navatares = cur.fetchone()
                  cur.execute("SELECT number, confidence FROM photos_bib WHERE photo_id = %s ORDER BY confidence DESC LIMIT 5", (pid,))
                  bibs = cur.fetchall()
                  print(f"\n  id={pid}  estado={st}")
                  print(f"    {w}x{h}px  {tam/1024/1024:.1f} MB")
                  print(f"    procesada en {seg:.0f}s (desde que entro hasta el ultimo cambio)")
                  print(f"    preview={'si' if prev else 'NO'}  thumbnail={'si' if thumb else 'NO'}")
                  print(f"    caras indexadas={ncaras}  con visor={navatares}")
                  print(f"    dorsales={[(n, round(c,2)) for n, c in bibs] or 'ninguno'}")
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write(f"LINK_ID={link_id}\n")
                  f.write(f"EVENT_ID={eid}\n")
          PYX

      - name: Limpiar todo
        if: always()
        run: |
          python3 - <<'PYX'
          import os, psycopg, boto3
          from botocore.config import Config

          link_id = int(os.environ["LINK_ID"]); eid = int(os.environ["EVENT_ID"])
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            config=Config(signature_version="s3v4"), region_name="auto")
          bucket = os.environ["R2_BUCKET_NAME"]

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM photos_photo WHERE photographer_link_id = %s", (link_id,))
              ids = [r[0] for r in cur.fetchall()]
              claves = []
              if ids:
                  cur.execute("""SELECT original_key, preview_key, thumbnail_key, branded_key
                                   FROM photos_photo WHERE id = ANY(%s)""", (ids,))
                  for fila in cur.fetchall():
                      claves += [k for k in fila if k]
                  cur.execute("SELECT avatar_key FROM photos_faceembedding WHERE photo_id = ANY(%s) AND avatar_key <> ''", (ids,))
                  claves += [r[0] for r in cur.fetchall()]
                  cur.execute("DELETE FROM photos_faceembedding WHERE photo_id = ANY(%s)", (ids,))
                  cur.execute("DELETE FROM photos_bib WHERE photo_id = ANY(%s)", (ids,))
                  cur.execute("DELETE FROM photos_photo WHERE id = ANY(%s)", (ids,))
              print(f"  borradas {len(ids)} fotos de prueba de la base")

              # El link de prueba se BORRA del todo (no solo revocar): era mio, no
              # de un fotografo de verdad, y no tiene que quedar en la lista.
              cur.execute("DELETE FROM photographers_photographerlink WHERE id = %s", (link_id,))
              print(f"  link de prueba id={link_id} BORRADO")

              cur.execute("""UPDATE events_event SET
                               photo_count = (SELECT count(*) FROM photos_photo
                                               WHERE event_id = %s AND status <> 'deleted'),
                               pending_count = (SELECT count(*) FROM photos_photo
                                                 WHERE event_id = %s AND status = 'pending_review'),
                               updated_at = now()
                             WHERE id = %s""", (eid, eid, eid))
              conn.commit()
              cur.execute("""SELECT photo_count, pending_count,
                              (SELECT count(*) FROM photographers_photographerlink
                                WHERE event_id = %s AND is_active) FROM events_event WHERE id = %s""", (eid, eid))
              pc, pend, links = cur.fetchone()
              print(f"\n  evento: fotos={pc} pendientes={pend} links_activos={links}")

          borradas = 0
          for k in claves:
              try:
                  s3.delete_object(Bucket=bucket, Key=k); borradas += 1
              except Exception as exc:
                  print(f"  no pude borrar {k}: {exc}")
          print(f"  borrados {borradas} objetos de R2")
          print("\n  El evento quedo limpio, como antes de la prueba.")
          PYX
