name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Borrar las fotos de prueba del evento"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Borrar SOLO las fotos del evento septimo-x-cep-social-run
        run: |
          python3 - <<'PYX'
          import os, boto3, psycopg
          SLUG = "septimo-x-cep-social-run"
          TOPE = 5   # freno: si hubiera mas fotos de las esperadas, no borra nada

          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s", (SLUG,))
              fila = cur.fetchone()
              if fila is None: raise SystemExit(f"no existe el evento {SLUG}")
              (evento_id,) = fila
              cur.execute("""
                  SELECT id, status, created_at, original_key, preview_key,
                         thumbnail_key, branded_key
                  FROM photos_photo WHERE event_id=%s ORDER BY id
              """, (evento_id,))
              fotos = cur.fetchall()

              print(f"=== FOTOS EN {SLUG} ({len(fotos)}) ===")
              for f in fotos:
                  print(f"  id={f[0]}  estado={f[1]}  subida {f[2]:%Y-%m-%d %H:%M:%S}")
              if not fotos:
                  raise SystemExit(0)
              if len(fotos) > TOPE:
                  raise SystemExit(f"NO BORRO NADA: hay {len(fotos)} fotos, mas de las "
                                   f"{TOPE} esperadas. Revisar a mano.")

              ids = [f[0] for f in fotos]
              keys = [k for f in fotos for k in f[3:7] if k]

              cur.execute("SELECT count(*) FROM photos_faceembedding WHERE photo_id = ANY(%s)", (ids,))
              (n_emb,) = cur.fetchone()
              cur.execute("SELECT count(*) FROM photos_bib WHERE photo_id = ANY(%s)", (ids,))
              (n_bib,) = cur.fetchone()

              r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                                aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                                aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                                region_name="auto")
              print(f"\nborrando {len(keys)} archivos de R2...")
              for k in keys:
                  r2.delete_object(Bucket=os.environ["R2_BUCKET_NAME"], Key=k)
                  print(f"   borrado {k}")

              cur.execute("DELETE FROM photos_faceembedding WHERE photo_id = ANY(%s)", (ids,))
              cur.execute("DELETE FROM photos_bib WHERE photo_id = ANY(%s)", (ids,))
              cur.execute("DELETE FROM photos_photo WHERE id = ANY(%s)", (ids,))
              print(f"\nbase: {len(ids)} fotos, {n_emb} caras, {n_bib} dorsales")

              # Bitacora (toda accion de admin queda registrada).
              cur.execute("""
                  INSERT INTO core_auditlog (action, target_type, target_id, metadata,
                                             created_at, updated_at, user_id, ip_address)
                  VALUES ('photo.deleted', 'Event', %s, %s::jsonb, now(), now(), NULL, NULL)
              """, (str(evento_id),
                    '{"motivo": "fotos de prueba del overlay", "photo_ids": %s}' % ids))

              # Contadores del evento al dia.
              cur.execute("""
                  UPDATE events_event e SET
                    photo_count = (SELECT count(*) FROM photos_photo p
                                   WHERE p.event_id=e.id AND p.status <> 'deleted'),
                    pending_count = (SELECT count(*) FROM photos_photo p
                                     WHERE p.event_id=e.id AND p.status='pending_review')
                  WHERE e.id=%s
                  RETURNING photo_count, pending_count
              """, (evento_id,))
              pc, pend = cur.fetchone()
              cx.commit()
              print(f"contadores del evento: {pc} fotos, {pend} pendientes")

              cur.execute("SELECT count(*) FROM photos_photo WHERE event_id=%s", (evento_id,))
              (quedan,) = cur.fetchone()
              print(f"\nRESULTADO: quedan {quedan} fotos en el evento"
                    f" ({'limpio' if quedan==0 else 'REVISAR'})")
          PYX
