name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  demo:
    name: Bajar los logos (margen 12% ya fijado)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Renderizar anchos
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          D = Path("apps/photos/brand_overlays")
          LOGOS = [("GU_Secondary_White_Transparent.png",1.00),
                   ("LOGO TASU-01.png",1.05),
                   ("NUGO LOGO WHITE.webp",0.82)]
          LOGO_H, SEGURO_Y, BANDA = 0.058, 0.085, 0.19   # altura ORIGINAL, que estaba bien

          def cargar(n):
              im = Image.open(D/n).convert("RGBA")
              return im.crop(im.split()[3].getbbox())

          def scrim(size, banda_pct, max_alpha=225, curva=1.2):
              w,h = size; banda = max(1, round(h*banda_pct))
              g = Image.new("L",(1,banda))
              for y in range(banda):
                  t = y/(banda-1) if banda>1 else 1.0
                  g.putpixel((0,y), round(max_alpha*(t**curva)))
              g = g.resize((w,banda))
              capa = Image.new("RGBA",(w,h),(0,0,0,0))
              negro = Image.new("RGBA",(w,banda),(0,0,0,255)); negro.putalpha(g)
              capa.paste(negro,(0,h-banda)); return capa

          def piezas_de(h):
              alto = round(h*LOGO_H); out=[]
              for n,f in LOGOS:
                  lg = cargar(n); a = max(1, round(alto*f))
                  out.append(lg.resize((max(1,round(a*lg.width/lg.height)), a), Image.LANCZOS))
              return out

          def aplicar(img, modo, margen_pct=0.12, sep_pct=0.05, seguro_y=SEGURO_Y):
              base = img.convert("RGBA"); w,h = base.size
              base.alpha_composite(scrim((w,h), BANDA - (SEGURO_Y - seguro_y)))
              pz = piezas_de(h)
              y0 = h - round(h*seguro_y)
              if modo == "repartidos":
                  m = round(w*margen_pct)
                  xs = [m, (w-pz[1].width)//2, w-pz[2].width-m]
              else:                                   # agrupados al centro
                  sep = round(w*sep_pct)
                  total = sum(p.width for p in pz) + sep*(len(pz)-1)
                  x = (w-total)//2; xs=[]
                  for p in pz: xs.append(x); x += p.width + sep
              for lg,x in zip(pz,xs):
                  base.alpha_composite(lg,(x, y0-lg.height))
              return base.convert("RGB")

          def marcar_recorte(img):
              """Pinta lo que Instagram RECORTA a los costados para llegar a 9:16."""
              out = img.convert("RGBA"); w,h = out.size
              visible = (h*9/16)/w                    # fraccion del ancho que sobrevive
              if visible >= 1: return out.convert("RGB")
              corte = round(w*(1-visible)/2)
              capa = Image.new("RGBA",(w,h),(0,0,0,0)); d = ImageDraw.Draw(capa)
              d.rectangle([0,0,corte,h], fill=(220,40,40,95))
              d.rectangle([w-corte,0,w,h], fill=(220,40,40,95))
              gr = max(2,round(w*0.004))
              d.line([(corte,0),(corte,h)], fill=(255,60,60,255), width=gr)
              d.line([(w-corte,0),(w-corte,h)], fill=(255,60,60,255), width=gr)
              d.text((8, round(h*0.03)), "RECORTA IG", fill=(255,255,255,255))
              out.alpha_composite(capa); return out.convert("RGB")

          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT id, original_key FROM photos_photo WHERE id=9189")
              pid, key = cur.fetchone()
          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          buf = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, buf); buf.seek(0)
          im = ImageOps.exif_transpose(Image.open(buf)).convert("RGB")
          im.thumbnail((1600,1600), Image.LANCZOS)
          vis = (im.height*9/16)/im.width
          print(f"foto {im.width}x{im.height} · IG deja visible el {vis*100:.0f}% del ancho"
                f" · recorta {(1-vis)/2*100:.1f}% por lado")

          # Cuanto queda LIBRE debajo de los logos (fraccion del alto).
          # Mas chico = logos mas abajo.
          OPCIONES = [
              ("1_muy_abajo_3", 0.030),
              ("2_abajo_4",     0.042),
              ("3_abajo_5",     0.055),
              ("4_anterior_8",  0.085),   # donde estaban, de referencia
          ]
          recortes=[]
          for etq, sy in OPCIONES:
              r = aplicar(im, modo="repartidos", margen_pct=0.12, seguro_y=sy)
              r.save(OUT/f"{etq}_limpio.jpg", quality=90)
              mk = marcar_recorte(r); mk.save(OUT/f"{etq}_recorte_IG.jpg", quality=90)
              recortes.append((etq, r.crop((0, round(im.height*0.76), im.width, im.height))))

          fw, fh = recortes[0][1].size
          LBL, GAP = 40, 10
          hoja = Image.new("RGB",(fw+GAP*2,(fh+LBL)*len(recortes)+GAP),(24,24,26))
          d = ImageDraw.Draw(hoja); y=GAP
          for etq,r in recortes:
              d.text((GAP+4,y+12), etq.replace("_"," ").upper(), fill=(250,250,250))
              y+=LBL; hoja.paste(r,(GAP,y)); y+=fh
          hoja.save(OUT/"COMPARACION_altura.jpg", quality=88)
          print("listo:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "demo: bajar los logos"
          git push -f origin demo-overlay-tmp
