name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

# Chequeo final: estado de los servicios; apaga worker/worker_fast/beat si el
# deploy los despertó (el evento terminó, deben quedar apagados).
jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: deps
        run: python3 -m pip install --quiet requests
      - name: check + stop workers
        run: |
          python3 - <<'PY'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]; ENV=os.environ["ENV_ID"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          def gql(q,v=None): return requests.post(API,headers=H,json={"query":q,"variables":v or {}},timeout=40).json()
          q='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceName serviceId latestDeployment{ id status } } } } } }'
          d=gql(q,{"e":ENV})
          rm='mutation($id:String!){ deploymentRemove(id:$id) }'
          ACTIVE={"SUCCESS","DEPLOYING","BUILDING","INITIALIZING","WAITING","QUEUED"}
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; ld=n.get("latestDeployment") or {}; name=n["serviceName"]; st=ld.get("status")
              print(f"  {name:14s} {st}")
              if name in ("worker","worker_fast","beat") and st in ACTIVE and ld.get("id"):
                  r=gql(rm,{"id":ld["id"]})
                  print(f"    -> apagado: {r.get('data',{}).get('deploymentRemove')}")
          print("FIN")
          PY
