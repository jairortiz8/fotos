name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Capturar el diseno de findme.photo"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet playwright Pillow
          python -m playwright install --with-deps chromium

      - name: Screenshots y extraccion de estilos
        run: |
          python3 - <<'PYX'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from PIL import Image

          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          PAGS = {"home":"https://findme.photo/es/",
                  "precios":"https://findme.photo/es/pricing",
                  "como":"https://findme.photo/es/how-it-works"}

          SONDA = """() => {
            const uso = {}, fuentes = {};
            const suma = (m,k)=>{ if(!k) return; m[k]=(m[k]||0)+1; };
            const vis = el => { const r=el.getBoundingClientRect();
                                return r.width>4 && r.height>4; };
            document.querySelectorAll('*').forEach(el=>{
              if(!vis(el)) return;
              const c = getComputedStyle(el);
              suma(uso, c.color);
              if(c.backgroundColor && c.backgroundColor!=='rgba(0, 0, 0, 0)')
                 suma(uso, 'BG '+c.backgroundColor);
              const t = el.textContent && el.textContent.trim().length>0;
              if(t) suma(fuentes, c.fontFamily.split(',')[0].replace(/["']/g,'')
                                  + ' / ' + c.fontWeight + ' / ' + c.fontSize);
            });
            const top = m => Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,18);
            return { colores: top(uso), tipografia: top(fuentes),
                     radios: top(Object.fromEntries([...document.querySelectorAll('*')]
                        .filter(vis).map(e=>[getComputedStyle(e).borderRadius,1]))) };
          }"""

          with sync_playwright() as pw:
              nav = pw.chromium.launch(args=["--no-sandbox"])
              informe = {}
              for nombre, url in PAGS.items():
                  for etq, vp in (("desk",{"width":1440,"height":900}),
                                  ("mob",{"width":390,"height":844})):
                      pg = nav.new_page(viewport=vp, device_scale_factor=1)
                      pg.goto(url, wait_until="networkidle", timeout=90000)
                      pg.wait_for_timeout(2500)
                      pg.mouse.wheel(0, 20000); pg.wait_for_timeout(1200)
                      pg.mouse.wheel(0, -30000); pg.wait_for_timeout(900)
                      arch = OUT/f"{nombre}_{etq}.png"
                      pg.screenshot(path=str(arch), full_page=True)
                      im = Image.open(arch)
                      # Recortar a lo primero que se ve + comprimir para que viaje liviano
                      im.crop((0,0,im.width,min(im.height, vp["height"]*2))).convert("RGB").save(
                          OUT/f"{nombre}_{etq}_inicio.jpg", quality=82)
                      if im.height > 6000:
                          im = im.resize((im.width//2, im.height//2), Image.LANCZOS)
                      im.convert("RGB").save(OUT/f"{nombre}_{etq}_full.jpg", quality=70)
                      arch.unlink()
                      print(f"  {nombre} {etq}: {im.width}x{im.height}")
                      if etq=="desk":
                          informe[nombre] = pg.evaluate(SONDA)
                      pg.close()
              nav.close()
          (OUT/"estilos.json").write_text(json.dumps(informe, indent=1, ensure_ascii=False))
          print("listo:", sorted(x.name for x in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan scan-findme
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "scan: diseno de findme.photo"
          git push -f origin scan-findme
