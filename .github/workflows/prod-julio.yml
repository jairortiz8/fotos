name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  up:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      SITE: https://findyourfoto.com
      TOKEN: iSEH4R7fXv5whK_44-JWkIsQGJMdm0-3
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" pillow
      - name: up
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PG_ID" | jq -r '.DATABASE_PUBLIC_URL // empty')

          echo "===== ¿SUBIDA TRABADA? ====="
          python3 - <<'PY'
          import os, psycopg
          c=psycopg.connect(os.environ["DBURL"],connect_timeout=20);cur=c.cursor()
          def q(s,a=()):cur.execute(s,a);return cur.fetchall()
          print("   estados:", dict(q("select status,count(*) from photos_photo group by status")))
          print("   en 'uploading':", q("select count(*) from photos_photo where status='uploading'")[0][0],
                "· en 'processing':", q("select count(*) from photos_photo where status='processing'")[0][0])
          print("   TRABADAS (uploading/processing sin moverse >10min):",
                q("select count(*) from photos_photo where status in ('uploading','processing') and updated_at<now()-interval '10 minutes'")[0][0])
          print("   filas original_key='' (subidas a medias):", q("select count(*) from photos_photo where original_key=''")[0][0])
          uq=[r[0] for r in q("select indexname from pg_indexes where tablename='photos_photo' and indexname='uniq_original_key_nonempty'")]
          full=[r[0] for r in q("select conname from pg_constraint where conrelid='photos_photo'::regclass and contype='u'")]
          print("   FIX del índice: parcial presente =", bool(uq), "· constraint total (debe estar vacío) =", full)
          PY
          echo
          echo "===== PRUEBA DE SUBIDA REAL (POST) ====="
          python3 - <<'PY'
          from PIL import Image
          Image.new("RGB",(400,300),(0,120,200)).save("/tmp/t.jpg","JPEG",quality=80)
          PY
          CODE=$(curl -sS -o /tmp/r.json -m40 -w '%{http_code}' -F "file=@/tmp/t.jpg;type=image/jpeg" "$SITE/u/$TOKEN/upload/")
          echo "   HTTP=$CODE  body=$(head -c 160 /tmp/r.json)"
          NID=$(jq -r '.id // empty' /tmp/r.json 2>/dev/null)
          python3 - <<PY
          import os, psycopg
          nid="${NID}"
          if nid.isdigit():
              c=psycopg.connect(os.environ["DBURL"],connect_timeout=20);c.autocommit=True;cur=c.cursor()
              cur.execute("delete from core_auditlog where target_type='photo' and target_id=%s",(nid,))
              cur.execute("delete from photos_bib where photo_id=%s",(nid,))
              cur.execute("delete from photos_faceembedding where photo_id=%s",(nid,))
              cur.execute("update photographers_photographerlink set photos_uploaded=greatest(photos_uploaded-1,0) where id=27")
              cur.execute("delete from photos_photo where id=%s returning id",(nid,))
              print("   foto de prueba borrada:", cur.fetchone())
          else:
              print("   (sin id — la subida NO devolvió 200)")
          PY
          echo "==================== FIN ===================="
