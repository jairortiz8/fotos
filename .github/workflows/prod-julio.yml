name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Numeros por evento para dimensionar el VPS"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]"

      - name: Volumen por evento
        run: |
          python3 - <<'PYX'
          import os, requests, psycopg
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          R=[]
          def add(x=""): R.append(x)
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""
                SELECT e.slug,
                  (SELECT count(*) FROM photos_photo p WHERE p.event_id=e.id) AS fotos,
                  (SELECT count(*) FROM photos_faceembedding f
                     JOIN photos_photo p2 ON p2.id=f.photo_id WHERE p2.event_id=e.id) AS caras,
                  (SELECT round(extract(epoch from max(p.created_at)-min(p.created_at))/60)
                     FROM photos_photo p WHERE p.event_id=e.id) AS mins
                FROM events_event e ORDER BY 2 DESC LIMIT 6
              """)
              filas=cur.fetchall()
              cur.execute("SELECT count(*) FROM photos_photo")
              (tot,)=cur.fetchone()
              cur.execute("SELECT count(*) FROM photos_faceembedding")
              (tc,)=cur.fetchone()
              cur.execute("SELECT pg_size_pretty(pg_database_size(current_database())),"
                          " pg_size_pretty(pg_total_relation_size('photos_faceembedding'))")
              tam, t_emb = cur.fetchone()
              cur.execute("""SELECT max(cant) FROM (
                    SELECT count(*) cant FROM photos_photo
                    GROUP BY event_id, floor(extract(epoch from created_at)/300)) q""")
              (pico,)=cur.fetchone()
          add("EVENTO                                 FOTOS   CARAS   MIN_SUBIDA")
          for slug,n,c,mins in filas:
              add(f"{slug[:36]:<37} {n:>6}  {c:>6}   {mins}")
          add()
          add(f"TOTAL: {tot} fotos · {tc} caras")
          add(f"Base: {tam} (tabla de caras {t_emb})")
          add(f"Pico historico: {pico} fotos en 5 min = {round(pico/5,1)}/min")
          print("\n".join(R))
          PYX
