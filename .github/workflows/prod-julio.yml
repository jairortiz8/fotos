name: prod-julio (one-off)

# READ-ONLY. NO deploya. Lee los LOGS del web para entender la foto de Julio
# que "siempre da error de red": ¿rechazo limpio, timeout de gunicorn, u OOM?

on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - name: audit
        run: |
          set -uo pipefail
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }

          echo "===== deployment activo del WEB ====="
          DEP=$(gql '{"query":"query($p:String!,$e:String!){ deployments(first:5, input:{projectId:$p, environmentId:$e, serviceId:\"'"$WEB_ID"'\"}){ edges { node { id status createdAt } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}')
          echo "$DEP" | jq -r '.data.deployments.edges[].node | "  \(.id) \(.status) \(.createdAt)"'
          DID=$(echo "$DEP" | jq -r '[.data.deployments.edges[].node | select(.status=="SUCCESS")][0].id')
          echo "  usando: $DID"
          echo

          logs() {  # $1 = filtro de texto, $2 = limit
            gql '{"query":"query($d:String!,$f:String,$l:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:$l){ timestamp message } }","variables":{"d":"'"$DID"'","f":"'"$1"'","l":'"$2"'}}' \
              | jq -r '.data.deploymentLogs[]? | "  \(.timestamp)  \(.message)"'
          }

          echo "===== A) upload FALLO (rechazos limpios registrados) últimos ====="
          logs "upload FALLO" 60
          echo
          echo "===== B) link=27 (Julio) en logs de upload ====="
          logs "link=27" 60
          echo
          echo "===== C) señales de TIMEOUT / worker muerto / OOM ====="
          logs "WORKER TIMEOUT" 30
          logs "SIGKILL" 30
          logs "out of memory" 20
          logs "MemoryError" 20
          logs "Booting worker" 20
          echo
          echo "===== D) errores 500 / tracebacks recientes ====="
          logs "Traceback" 30
          logs "ERROR" 40
          echo "==================== FIN ===================="
