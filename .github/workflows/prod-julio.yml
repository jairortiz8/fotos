name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Confirmacion final: workers vivos y sitio arriba"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests celery redis

      - name: Estado de los servicios
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ status } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== SERVICIOS ===")
          redis_id=None
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; st=(n.get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
              print(f"  {n['serviceName']:<14} {st}")
              if n["serviceName"]=="Redis": redis_id=n["serviceId"]
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"REDIS_ID={redis_id}\n")
          PYX

      - name: Preguntarle al worker si esta escuchando
        run: |
          python3 - <<'PYX'
          import os, requests
          from celery import Celery
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          v=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["REDIS_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          url=v.get("REDIS_PUBLIC_URL")
          if not url: raise SystemExit("no se pudo leer REDIS_PUBLIC_URL")
          print(f"::add-mask::{url}")
          app=Celery(broker=url)
          # ping por broadcast: contesta CADA worker que este consumiendo la cola.
          respuestas = app.control.ping(timeout=8) or []
          print(f"\n=== WORKERS QUE CONTESTARON: {len(respuestas)} ===")
          for r in respuestas:
              for nombre, estado in r.items():
                  print(f"  {nombre} -> {estado}")
          if not respuestas:
              raise SystemExit("NINGUN worker contesto el ping")
          PYX

      - name: El sitio responde
        run: |
          python3 - <<'PYX'
          import requests
          for ruta in ("/healthz/lite", "/", "/eventos/septimo-x-cep-social-run/"):
              r = requests.get("https://findyourfoto.com"+ruta, timeout=60)
              print(f"  {ruta:<40} HTTP {r.status_code}")
          PYX
