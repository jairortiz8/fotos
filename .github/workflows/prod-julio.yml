name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  ocr:
    name: SOLO LECTURA - esta funcionando el OCR?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "psycopg[binary]" requests

      - name: Credenciales + flags de OCR
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); wk=vf(os.environ["WORKER_ID"])
          url=pg.get("DATABASE_PUBLIC_URL")
          if not url: raise SystemExit("sin DATABASE_PUBLIC_URL")
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"DATABASE_URL={url}\n")
              f.write(f"OCR_BACKEND={wk.get('OCR_BACKEND','')}\n")
              f.write(f"TIENE_KEY={'si' if wk.get('GEMINI_API_KEY') else 'NO'}\n")
              f.write(f"MODELO={wk.get('GEMINI_OCR_MODEL','(default)')}\n")
          PYX

      - name: Reporte de OCR
        run: |
          python3 - <<'PYX'
          import os, psycopg
          SLUG="garmin-runners-girls-5k-social-run"
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s",(SLUG,))
              eid=cur.fetchone()[0]
              cur.execute("""SELECT count(*), count(*) FILTER (WHERE preview_key<>''),
                                    count(*) FILTER (WHERE has_bibs_detected)
                               FROM photos_photo WHERE event_id=%s""",(eid,))
              tot, procesadas, con_bib = cur.fetchone()
              cur.execute("""SELECT count(*) FROM photos_bib b
                              JOIN photos_photo p ON p.id=b.photo_id WHERE p.event_id=%s""",(eid,))
              bibs=cur.fetchone()[0]
              cur.execute("""SELECT b.source, count(*) FROM photos_bib b
                              JOIN photos_photo p ON p.id=b.photo_id
                             WHERE p.event_id=%s GROUP BY 1 ORDER BY 2 DESC""",(eid,))
              por_fuente=cur.fetchall()
              cur.execute("""SELECT b.number, b.confidence, b.source
                               FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id
                              WHERE p.event_id=%s ORDER BY b.id DESC LIMIT 12""",(eid,))
              muestra=cur.fetchall()
              cur.execute("""SELECT count(*), count(DISTINCT b.photo_id)
                               FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id
                               JOIN events_event e ON e.id=p.event_id
                              WHERE e.slug='surf-city-2026'""")
              sc_bibs, sc_fotos = cur.fetchone()

          print("=" * 58)
          print("            REPORTE DE OCR")
          print("=" * 58)
          print(f"  backend           {os.environ.get('OCR_BACKEND') or '(sin setear -> local)'}")
          print(f"  GEMINI_API_KEY    {os.environ.get('TIENE_KEY')}")
          print(f"  modelo            {os.environ.get('MODELO')}")
          print()
          print(f"  fotos del evento          {tot}")
          print(f"  ya procesadas (c/preview) {procesadas}")
          print(f"  fotos con dorsal leido    {con_bib}")
          print(f"  dorsales leidos (total)   {bibs}")
          if procesadas:
              print(f"  -> {100*con_bib/procesadas:.1f}% de las procesadas tienen dorsal")
          print()
          for src, n in por_fuente:
              print(f"  fuente {src:<20} {n}")
          if muestra:
              print("\n  muestra:")
              for num, conf, src in muestra:
                  print(f"    #{num:<10} conf={conf:.2f}  {src}")
          else:
              print("\n  NINGUN dorsal leido todavia")
          print(f"\n  referencia Surf City: {sc_bibs} dorsales en {sc_fotos} fotos")
          print("=" * 58)
          PYX
