name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  warm:
    name: warm reviewer clean renders (surf-city)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install system libs for OpenCV/onnxruntime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1 libxcb1 libsm6 libxext6 libxrender1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Trae las credenciales de prod (DB pública + R2) desde Railway a $GITHUB_ENV.
      # NO se imprimen (::add-mask:: + escritura directa al env file).
      - name: Fetch prod credentials
        run: |
          python3 - <<'PY'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vars_for(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              r=requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
              return (r.json().get("data",{}) or {}).get("variables") or {}
          pg=vars_for(os.environ["PG_ID"])
          web=vars_for(os.environ["WEB_ID"])
          out={
              "DATABASE_URL": pg.get("DATABASE_PUBLIC_URL"),
              "R2_ACCESS_KEY_ID": web.get("R2_ACCESS_KEY_ID"),
              "R2_SECRET_ACCESS_KEY": web.get("R2_SECRET_ACCESS_KEY"),
              "R2_BUCKET_NAME": web.get("R2_BUCKET_NAME"),
              "R2_ENDPOINT_URL": web.get("R2_ENDPOINT_URL"),
          }
          missing=[k for k,v in out.items() if not v]
          if missing:
              raise SystemExit(f"faltan credenciales: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          print("credenciales cargadas OK")
          PY

      - name: Warm Surf City thumbnails (limpias, sin logos) — paralelo
        run: |
          python manage.py shell <<'PY'
          import io, os, threading
          import boto3
          from botocore.config import Config
          from concurrent.futures import ThreadPoolExecutor

          from apps.events.models import Event, EventStatus
          from apps.photos.imaging import REVIEWER_CLEAN_SIZES, generate_clean_render
          from apps.photos.models import Photo, PhotoStatus
          from apps.reviewers.services import clean_key

          ev = (
              Event.objects.filter(slug="surf-city-2026")
              .exclude(status=EventStatus.DELETED)
              .first()
          )
          if ev is None:
              raise SystemExit("No se encontró el evento surf-city-2026")
          print("evento:", ev.slug, "reviewer_visible:", ev.reviewer_visible, flush=True)

          bucket = os.environ["R2_BUCKET_NAME"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4", max_pool_connections=48,
                            retries={"max_attempts": 3}),
          )
          long_edge, quality = REVIEWER_CLEAN_SIZES["thumb"]

          # Qué thumbs limpios ya existen (para reanudar sin re-generar).
          existing = set()
          for page in s3.get_paginator("list_objects_v2").paginate(
              Bucket=bucket, Prefix=f"reviewer_clean/{ev.slug}/"
          ):
              for o in page.get("Contents", []):
                  existing.add(o["Key"])

          photos = list(
              Photo.objects.filter(event=ev, status=PhotoStatus.APPROVED)
              .exclude(original_key="")
              .values_list("id", "original_key")
          )
          todo = [(pid, ok) for pid, ok in photos if clean_key(ev.slug, pid, "thumb") not in existing]
          print(f"APPROVED={len(photos)} "
                f"EXISTING_THUMBS={sum(1 for k in existing if k.endswith('_thumb.webp'))} "
                f"TODO={len(todo)}", flush=True)

          lock = threading.Lock()
          done = {"ok": 0, "err": 0}

          def work(item):
              pid, okey = item
              try:
                  buf = io.BytesIO()
                  s3.download_fileobj(bucket, okey, buf)
                  data = generate_clean_render(buf.getvalue(), long_edge, quality)
                  s3.put_object(
                      Bucket=bucket, Key=clean_key(ev.slug, pid, "thumb"), Body=data,
                      ContentType="image/webp", CacheControl="private, max-age=604800",
                  )
                  r = "ok"
              except Exception:
                  r = "err"
              with lock:
                  done[r] += 1
                  n = done["ok"] + done["err"]
                  if n % 500 == 0:
                      print(f"progress {n}/{len(todo)} ok={done['ok']} err={done['err']}", flush=True)
              return r

          with ThreadPoolExecutor(max_workers=24) as ex:
              list(ex.map(work, todo))
          print(f"WARM_DONE ok={done['ok']} err={done['err']} todo={len(todo)}", flush=True)
          PY
