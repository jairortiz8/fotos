name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Caras: indexado, caratulas y busqueda por selfie"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 celery redis

      - name: Diagnostico de caras
        run: |
          python3 - <<'PYX'
          import io, os, re, time, boto3, psycopg, requests, redis as _r
          from celery import Celery
          SLUG="septimo-x-cep-social-run"; SITE="https://findyourfoto.com"
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          ids={n["node"]["serviceName"]:n["node"]["serviceId"]
               for n in d["environment"]["serviceInstances"]["edges"]}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          web=vf(ids["fotos"]); rd=vf(ids["Redis"]); pg=vf(os.environ["PG_ID"])
          broker=rd["REDIS_PUBLIC_URL"]; rc=_r.from_url(broker)
          app=Celery(broker=broker)

          print("1) COLAS Y WORKERS")
          for nodo,qs in (app.control.inspect(timeout=10).active_queues() or {}).items():
              print(f"   {nodo}  colas={sorted(q['name'] for q in qs)}")
          c0={c: rc.llen(c) for c in ("celery","fast","faces")}
          print(f"   pendientes ahora: {c0}")

          with psycopg.connect(pg["DATABASE_PUBLIC_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s",(SLUG,))
              (ev,)=cur.fetchone()
              cur.execute("""SELECT status,count(*) FROM photos_photo WHERE event_id=%s
                             GROUP BY status ORDER BY 2 DESC""",(ev,))
              estados=cur.fetchall()
              cur.execute("""SELECT count(*) FILTER (WHERE preview_key<>''),
                                    count(DISTINCT f.photo_id)
                             FROM photos_photo p LEFT JOIN photos_faceembedding f
                               ON f.photo_id=p.id WHERE p.event_id=%s""",(ev,))
              procesadas, con_caras = cur.fetchone()
              cur.execute("""SELECT count(*), count(*) FILTER (WHERE avatar_key<>'')
                             FROM photos_faceembedding f JOIN photos_photo p ON p.id=f.photo_id
                             WHERE p.event_id=%s""",(ev,))
              caras, con_av = cur.fetchone()
              cur.execute("""SELECT count(*) FILTER (WHERE lado>=130),
                                    count(*) FILTER (WHERE lado>=50 AND lado<130),
                                    count(*) FILTER (WHERE lado<50),
                                    round(min(lado)::numeric),
                                    round(percentile_cont(0.5) WITHIN GROUP (ORDER BY lado)::numeric),
                                    round(max(lado)::numeric),
                                    count(*) FILTER (WHERE lado>=50 AND ak=''),
                                    count(*) FILTER (WHERE lado<50 AND ak='')
                             FROM (SELECT greatest((f.bbox->>'x2')::float-(f.bbox->>'x1')::float,
                                                   (f.bbox->>'y2')::float-(f.bbox->>'y1')::float) lado,
                                          f.avatar_key ak
                                   FROM photos_faceembedding f
                                   JOIN photos_photo p ON p.id=f.photo_id
                                   WHERE p.event_id=%s AND f.bbox IS NOT NULL) q""",(ev,))
              g,m,c,mn,md,mx,falta_g,falta_c = cur.fetchone()
              cur.execute("""SELECT f.embedding::text, f.photo_id, f.avatar_key
                             FROM photos_faceembedding f JOIN photos_photo p ON p.id=f.photo_id
                             WHERE p.event_id=%s AND f.avatar_key<>'' LIMIT 1""",(ev,))
              fila=cur.fetchone()
              vecinos=[]
              if fila:
                  emb, foto_id, av_key = fila
                  cur.execute("""SELECT p.id, round((1-(f.embedding <=> %s::vector))::numeric,3)
                                 FROM photos_faceembedding f JOIN photos_photo p ON p.id=f.photo_id
                                 WHERE p.event_id=%s
                                 ORDER BY f.embedding <=> %s::vector LIMIT 5""",(emb,ev,emb))
                  vecinos=cur.fetchall()

          print(); print("2) FOTOS DEL EVENTO")
          print(f"   por estado: {estados}")
          print(f"   con preview listo: {procesadas} · con caras indexadas: {con_caras}")
          print(f"   sin indexar todavia: {max(0, procesadas-con_caras)}")

          print(); print("3) CARATULAS DE CARAS")
          print(f"   caras: {caras} · con caratula: {con_av} · sin: {caras-con_av}")
          print(f"   tamano (px del original): >=130: {g} · 50-129: {m} · <50: {c}")
          print(f"   min {mn} · mediana {md} · max {mx}")
          print(f"   SIN caratula y >=50px (deberian tenerla): {falta_g}")
          print(f"   SIN caratula y <50px (por diseno no llevan): {falta_c}")

          print(); print("4) EL MATCHING (pgvector, directo en la base)")
          if vecinos:
              print(f"   consulta con una cara de la foto {foto_id}:")
              for pid,sim in vecinos: print(f"      foto {pid}  parecido {sim}")
              print("   OK: la primera es la propia foto -> el indice anda"
                    if vecinos[0][0]==foto_id else "   REVISAR: no devolvio su propia foto")
          else:
              print("   todavia no hay caras con caratula para probar")

          print(); print("5) BUSQUEDA POR SELFIE DE PUNTA A PUNTA")
          se=requests.Session()
          r=se.get(f"{SITE}/eventos/{SLUG}/buscar-selfie/", timeout=60)
          print(f"   el formulario responde HTTP {r.status_code}")
          if fila:
              r2c=boto3.client("s3", endpoint_url=web["R2_ENDPOINT_URL"],
                               aws_access_key_id=web["R2_ACCESS_KEY_ID"],
                               aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"],
                               region_name="auto")
              b=io.BytesIO(); r2c.download_fileobj(web["R2_BUCKET_NAME"], av_key, b)
              print(f"   uso como selfie la caratula de la foto {foto_id} ({len(b.getvalue())//1024} KB)")
              csrf=se.cookies.get("csrftoken") or ""
              t0=time.time()
              rr=se.post(f"{SITE}/eventos/{SLUG}/buscar-selfie/",
                         data={"csrfmiddlewaretoken":csrf},
                         files={"selfie":("selfie.jpg", io.BytesIO(b.getvalue()), "image/jpeg")},
                         headers={"Referer": f"{SITE}/eventos/{SLUG}/buscar-selfie/"},
                         timeout=240)
              dt=round(time.time()-t0,1)
              halladas=len(set(re.findall(r"/foto/(\d+)", rr.text)))
              txt=rr.text.lower()
              print(f"   HTTP {rr.status_code} en {dt}s · fotos distintas en la respuesta: {halladas}")
              for pista,etq in (("varias caras","respondio 'varias caras'"),
                                ("no detectamos","respondio 'no detectamos una cara'"),
                                ("no encontramos","respondio 'no encontramos fotos'"),
                                ("no esta disponible","figura como NO DISPONIBLE")):
                  if pista in txt: print(f"      -> {etq}")
          PYX
