name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  medir:
    name: cuanto tarda de verdad el procesamiento
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests boto3

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Limpiar lo que haya dejado la prueba anterior
        run: |
          python3 - <<'PYX'
          import os, psycopg, boto3
          from botocore.config import Config
          NOMBRE = "PRUEBA (borrar) - Claude"
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            config=Config(signature_version="s3v4"), region_name="auto")
          bucket = os.environ["R2_BUCKET_NAME"]
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id, event_id FROM photographers_photographerlink WHERE photographer_name = %s", (NOMBRE,))
              links = cur.fetchall()
              if not links:
                  print("  no quedo nada de la prueba anterior")
              for link_id, eid in links:
                  cur.execute("SELECT id, status FROM photos_photo WHERE photographer_link_id = %s", (link_id,))
                  filas = cur.fetchall()
                  ids = [r[0] for r in filas]
                  # Antes de borrar: dejar constancia de en que estado quedaron.
                  for pid, st in filas:
                      cur.execute("""SELECT preview_key <> '', thumbnail_key <> '',
                                            EXTRACT(EPOCH FROM (updated_at - created_at))
                                       FROM photos_photo WHERE id = %s""", (pid,))
                      prev, thumb, seg = cur.fetchone()
                      cur.execute("SELECT count(*) FROM photos_faceembedding WHERE photo_id = %s", (pid,))
                      print(f"  id={pid} estado={st} preview={'si' if prev else 'no'} "
                            f"thumb={'si' if thumb else 'no'} caras={cur.fetchone()[0]} ({seg:.0f}s)")
                  claves = []
                  if ids:
                      cur.execute("SELECT original_key, preview_key, thumbnail_key, branded_key FROM photos_photo WHERE id = ANY(%s)", (ids,))
                      for fila in cur.fetchall():
                          claves += [k for k in fila if k]
                      cur.execute("SELECT avatar_key FROM photos_faceembedding WHERE photo_id = ANY(%s) AND avatar_key <> ''", (ids,))
                      claves += [r[0] for r in cur.fetchall()]
                      cur.execute("DELETE FROM photos_faceembedding WHERE photo_id = ANY(%s)", (ids,))
                      cur.execute("DELETE FROM photos_bib WHERE photo_id = ANY(%s)", (ids,))
                      cur.execute("DELETE FROM photos_photo WHERE id = ANY(%s)", (ids,))
                  cur.execute("DELETE FROM photographers_photographerlink WHERE id = %s", (link_id,))
                  cur.execute("""UPDATE events_event SET
                                   photo_count = (SELECT count(*) FROM photos_photo WHERE event_id = %s AND status <> 'deleted'),
                                   pending_count = (SELECT count(*) FROM photos_photo WHERE event_id = %s AND status = 'pending_review'),
                                   updated_at = now() WHERE id = %s""", (eid, eid, eid))
                  conn.commit()
                  for k in claves:
                      try: s3.delete_object(Bucket=bucket, Key=k)
                      except Exception: pass
                  print(f"  limpiadas {len(ids)} fotos + link {link_id}")
          PYX

      - name: Cuanto tardo CADA foto real de Surf City
        run: |
          python3 - <<'PYX'
          import os, psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              for slug in ("surf-city-2026", "camino-a-san-luis-iron-dream"):
                  cur.execute("SELECT id, name FROM events_event WHERE slug = %s", (slug,))
                  eid, nombre = cur.fetchone()

                  # Tiempo entre que la foto entro y que quedo procesada. Solo las
                  # que llegaron a tener preview: esas completaron la cadena.
                  cur.execute("""
                      SELECT count(*),
                             percentile_cont(0.50) WITHIN GROUP (ORDER BY seg),
                             percentile_cont(0.90) WITHIN GROUP (ORDER BY seg),
                             percentile_cont(0.99) WITHIN GROUP (ORDER BY seg),
                             max(seg), avg(tam)/1024/1024
                        FROM (SELECT EXTRACT(EPOCH FROM (updated_at - created_at)) AS seg,
                                     file_size AS tam
                                FROM photos_photo
                               WHERE event_id = %s AND preview_key <> ''
                                 AND updated_at > created_at) t
                  """, (eid,))
                  n, p50, p90, p99, mx, mb = cur.fetchone()
                  print(f"\n=== {nombre} ===")
                  if not n:
                      print("  sin datos")
                      continue
                  print(f"  {n} fotos procesadas, {mb:.1f} MB promedio")
                  print(f"    mediana   {p50:6.0f}s   (la mitad tardo menos que esto)")
                  print(f"    p90       {p90:6.0f}s   (9 de cada 10 por debajo)")
                  print(f"    p99       {p99:6.0f}s")
                  print(f"    la peor   {mx:6.0f}s")

                  # Throughput real: cuantas fotos por minuto salieron en la hora
                  # mas cargada. Esto es lo que importa para un lote de 600.
                  cur.execute("""
                      SELECT date_trunc('hour', updated_at) AS hora, count(*)
                        FROM photos_photo WHERE event_id = %s AND preview_key <> ''
                       GROUP BY 1 ORDER BY 2 DESC LIMIT 3
                  """, (eid,))
                  print("    horas de mayor produccion del worker:")
                  for hora, cuantas in cur.fetchall():
                      print(f"      {hora:%d/%m %H:%M}  {cuantas} fotos  (~{cuantas/60:.1f} por minuto)")

              # Estado global: hay algo trabado AHORA?
              cur.execute("""SELECT status, count(*) FROM photos_photo
                              WHERE created_at > now() - interval '2 hours'
                              GROUP BY 1 ORDER BY 2 DESC""")
              print("\n=== FOTOS DE LAS ULTIMAS 2 HORAS (todo el sistema) ===")
              filas = cur.fetchall()
              if not filas: print("  (ninguna)")
              for st, n in filas: print(f"  {st:<20} {n}")

              cur.execute("""SELECT count(*) FROM photos_photo
                              WHERE status IN ('processing','uploading')
                                AND created_at < now() - interval '1 hour'""")
              print(f"\n  trabadas hace mas de 1h: {cur.fetchone()[0]}")
          PYX

      - name: Estado del worker
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=45))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              print(f"  {n['serviceName']:<12} {dep.get('status') or 'SIN DEPLOY':<12} {(dep.get('createdAt') or '-')[:19]}")
          PYX
