name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

# Post-deploy: espera el web (migra reviewer_visible) y PRENDE el flag solo en Surf City.
jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      SITE: https://findyourfoto.com
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" requests
      - name: esperar web + prender flag Surf City
        run: |
          python3 - <<'PY'
          import os, time, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]; ENV=os.environ["ENV_ID"]
          PROJ=os.environ["PROJECT_ID"]; PG=os.environ["PG_ID"]; WEB=os.environ["WEB_ID"]; SITE=os.environ["SITE"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          def gql(q,v=None): return requests.post(API,headers=H,json={"query":q,"variables":v or {}},timeout=40).json()
          q='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId latestDeployment{ status } } } } } }'
          print("== esperando WEB ==")
          for i in range(40):
              d=gql(q,{"e":ENV}); st=None
              for e in d.get("data",{}).get("environment",{}).get("serviceInstances",{}).get("edges",[]):
                  if e["node"]["serviceId"]==WEB: st=(e["node"].get("latestDeployment") or {}).get("status")
              print(f"  web[{i}] {st}")
              if st=="SUCCESS": break
              if st in ("FAILED","CRASHED"): print("  WEB FALLO"); break
              time.sleep(15)
          qv='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          dburl=(gql(qv,{"p":PROJ,"e":ENV,"s":PG}).get("data",{}).get("variables") or {}).get("DATABASE_PUBLIC_URL")
          import psycopg
          c=psycopg.connect(dburl,connect_timeout=25); c.autocommit=True; cur=c.cursor()
          cur.execute("select column_name from information_schema.columns where table_name='events_event' and column_name='reviewer_visible'")
          if cur.fetchone() is None:
              print("  ABORTO: columna reviewer_visible aún no existe"); raise SystemExit(1)
          cur.execute("update events_event set reviewer_visible=true where slug='surf-city-2026'")
          print("  filas actualizadas:", cur.rowcount)
          cur.execute("select slug,name,reviewer_visible from events_event where reviewer_visible=true order by slug")
          print("  eventos visibles para invitados:")
          for r in cur.fetchall(): print("   ", r)
          c.close()
          r=requests.get(f"{SITE}/invitados/entrar/",timeout=30)
          print(f"  /invitados/entrar/ -> {r.status_code}")
          print("FIN")
          PY
