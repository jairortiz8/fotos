name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  evento:
    name: levantar workers + auditar subida y caras
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      BEAT_ID: 0a364656-8700-4f69-bac0-b91c50cd722b
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: 1 · Estado de los servicios
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(query, variables=None):
              body=json.dumps({"query":query,"variables":variables or {}}).encode()
              req=urllib.request.Request(API, data=body, headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req, timeout=45))
          q='''query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ id status createdAt } } } } } }'''
          d=gql(q, {"e":os.environ["ENV_ID"]})
          edges=d["data"]["environment"]["serviceInstances"]["edges"]
          print(f"{'servicio':<12} {'estado':<14} {'deploy'}")
          estado={}
          for e in edges:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              st=dep.get("status") or "SIN DEPLOY"
              estado[n["serviceName"]]=st
              print(f"{n['serviceName']:<12} {st:<14} {(dep.get('id') or '-')[:8]}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"ESTADO_WORKER={estado.get('worker','?')}\n")
              f.write(f"ESTADO_BEAT={estado.get('beat','?')}\n")
          PYX

      - name: 2 · Levantar worker y beat
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request, time
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(query, variables=None):
              body=json.dumps({"query":query,"variables":variables or {}}).encode()
              req=urllib.request.Request(API, data=body, headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          M='''mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }'''
          for nombre, sid in (("worker", os.environ["WORKER_ID"]), ("beat", os.environ["BEAT_ID"])):
              try:
                  r=gql(M, {"s":sid,"e":os.environ["ENV_ID"]})
                  print(f"{nombre}: deploy disparado -> {json.dumps(r.get('data'))[:120]}")
                  if r.get("errors"): print(f"  ERRORES: {r['errors']}")
              except Exception as exc:
                  print(f"{nombre}: FALLO al disparar deploy: {exc}")
          PYX

      - name: Esperar arranque
        run: sleep 120

      - name: 3 · Confirmar que arrancaron
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=45))
          q='''query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }'''
          d=gql(q,{"e":os.environ["ENV_ID"]})
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; st=(n.get("latestDeployment") or {}).get("status","SIN DEPLOY")
              print(f"  {n['serviceName']:<12} {st}")
          PYX

      - name: Instalar deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglib2.0-0 libgomp1 libxcb1 libsm6 libxext6 libxrender1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"]); wk=vf(os.environ["WORKER_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          print("FLAGS del worker:")
          for k in ("FACE_PROCESSING_ENABLED","FACE_SEARCH_ENABLED","MINOR_BLUR_ENABLED",
                    "OCR_BACKEND","OCR_EXHAUSTIVE_ON_UPLOAD","PHOTO_UPLOAD_MAX_MB"):
              print(f"  worker.{k} = {wk.get(k,'(sin setear)')}")
          print("FLAGS del web:")
          for k in ("FACE_SEARCH_ENABLED","OCR_BACKEND","PHOTO_UPLOAD_MAX_MB"):
              print(f"  web.{k} = {web.get(k,'(sin setear)')}")
          PYX

      - name: 4 · Salud de la subida (cola y fotos trabadas)
        run: |
          python manage.py shell <<'PYX'
          from django.utils import timezone
          from datetime import timedelta
          from apps.photos.models import Photo, PhotoStatus
          from apps.events.models import Event

          ahora = timezone.now()
          print("=== FOTOS POR ESTADO (ultimas 24h) ===")
          recientes = Photo.objects.filter(created_at__gte=ahora - timedelta(hours=24))
          for st, _ in PhotoStatus.choices:
              n = recientes.filter(status=st).count()
              if n: print(f"  {st:<20} {n}")
          if not recientes.exists(): print("  (sin subidas en 24h)")

          print("\n=== TRABADAS (>1h en processing/uploading) ===")
          trabadas = Photo.objects.filter(
              status__in=[PhotoStatus.PROCESSING, PhotoStatus.UPLOADING],
              created_at__lt=ahora - timedelta(hours=1))
          print(f"  total: {trabadas.count()}")
          for p in trabadas.order_by("-created_at")[:5]:
              print(f"    id={p.id} {p.status} creada={p.created_at:%d/%m %H:%M} evento={p.event.slug}")

          print("\n=== EVENTOS ABIERTOS PARA SUBIR ===")
          for e in Event.objects.exclude(status="deleted").order_by("-date")[:6]:
              links = e.photographer_links.filter(is_active=True).count()
              print(f"  {e.slug:<24} {e.status:<16} fotos={e.photo_count:<6} links_activos={links}")
          PYX

      - name: 5 · Auditoria de recall del buscador de caras
        run: |
          python manage.py shell <<'PYX'
          from collections import defaultdict
          from apps.events.models import Event
          from apps.photos.models import Photo, PhotoStatus, FaceEmbedding, Bib
          from apps.photos.faces import face_size_px
          from apps.search.views import search_faces_by_similarity, FACE_CLICK_THRESHOLD, MAX_SELFIE_RESULTS

          ev = Event.objects.filter(slug="surf-city-2026").first()
          print(f"umbral en produccion = {FACE_CLICK_THRESHOLD} · tope de resultados = {MAX_SELFIE_RESULTS}\n")

          # VERDAD DE REFERENCIA: el dorsal dice en que fotos esta esa persona.
          bibs = defaultdict(set)
          for num, pid in Bib.objects.filter(
                  photo__event=ev, photo__status=PhotoStatus.APPROVED, rejected=False
              ).values_list("number","photo_id"):
              if num.isdigit(): bibs[num].add(pid)
          # Corredores con presencia media (ni 1 foto ni un dorsal con ruido masivo)
          cand = sorted(((n,p) for n,p in bibs.items() if 6 <= len(p) <= 45),
                        key=lambda x: -len(x[1]))[:8]
          print(f"{'dorsal':>7} {'fotos':>6} {'cara_px':>8} | {'0.62 (prod)':>12} {'0.55':>8} {'0.45':>8} {'0.35':>8}")
          print("-"*74)
          tot = {0.62:[0,0], 0.55:[0,0], 0.45:[0,0], 0.35:[0,0]}
          for num, verdad in cand:
              # cara mas grande entre las fotos de ese corredor = la consulta ideal
              caras = list(FaceEmbedding.objects.filter(photo_id__in=verdad)
                           .values_list("id","bbox","embedding","photo_id"))
              if not caras: continue
              fid, bbox, emb, src = max(caras, key=lambda c: face_size_px(c[1]))
              fila = []
              for thr in (0.62, 0.55, 0.45, 0.35):
                  res = search_faces_by_similarity(ev, list(emb), threshold=thr, limit=300)
                  hallados = {p.id for p in res} & verdad
                  fila.append(f"{len(hallados)}/{len(verdad)} ({round(100*len(hallados)/len(verdad))}%)")
                  tot[thr][0] += len(hallados); tot[thr][1] += len(verdad)
              print(f"{num:>7} {len(verdad):>6} {round(face_size_px(bbox)):>8} | "
                    f"{fila[0]:>12} {fila[1]:>8} {fila[2]:>8} {fila[3]:>8}")
          print("-"*74)
          res = " ".join(f"{round(100*a/b) if b else 0}%" for a,b in
                         (tot[0.62],tot[0.55],tot[0.45],tot[0.35]))
          print(f"{'RECALL GLOBAL':>22} | {res}")

          print("\n=== FOTOS QUE SE PIERDEN: por que? ===")
          num, verdad = cand[0]
          caras = list(FaceEmbedding.objects.filter(photo_id__in=verdad)
                       .values_list("id","bbox","embedding","photo_id"))
          fid, bbox, emb, src = max(caras, key=lambda c: face_size_px(c[1]))
          encontradas = {p.id for p in search_faces_by_similarity(ev, list(emb), threshold=0.62, limit=300)}
          perdidas = verdad - encontradas
          print(f"dorsal {num}: {len(perdidas)} fotos no aparecen al tocar la cara")
          for pid in list(perdidas)[:10]:
              p = Photo.objects.get(id=pid)
              cs = list(p.face_embeddings.all())
              tam = sorted((round(face_size_px(c.bbox)) for c in cs), reverse=True)
              print(f"   foto={pid} caras_detectadas={len(cs)} tamanos={tam[:5]}"
                    f"{'  <-- SIN CARAS DETECTADAS' if not cs else ''}")
          PYX
