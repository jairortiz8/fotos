name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  traffic:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      SITE: https://findyourfoto.com
    steps:
      - name: traffic
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          DEP=$(gql '{"query":"query($p:String!,$e:String!){ deployments(first:60, input:{projectId:$p, environmentId:$e}){ edges { node { id status createdAt service { name } } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}')
          DID=$(echo "$DEP" | jq -r '[.data.deployments.edges[].node|select(.service.name=="fotos" and .status=="SUCCESS")]|sort_by(.createdAt)|last|.id')

          echo "===== MÉTRICAS del web (últimos 30 min) ====="
          START=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for M in CPU_USAGE MEMORY_USAGE_GB NETWORK_TX_GB NETWORK_RX_GB; do
            R=$(gql '{"query":"query($m:MetricMeasurement!,$p:String!,$e:String!,$s:String!,$d:DateTime!){ metrics(measurements:[$m], projectId:$p, environmentId:$e, serviceId:$s, startDate:$d, sampleRateSeconds:300){ values { value } } }","variables":{"m":"'"$M"'","p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$WEB_ID"'","d":"'"$START"'"}}')
            ERR=$(echo "$R" | jq -r '.errors[0].message // empty')
            if [ -n "$ERR" ]; then echo "  $M: (n/d)"; else echo "  $M (por muestra 5min): $(echo "$R" | jq -r '[.data.metrics[0].values[]?.value]|map(.*1000|floor/1000)|@csv')"; fi
          done
          echo

          cnt() { gql '{"query":"query($d:String!,$f:String,$l:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:$l){ message } }","variables":{"d":"'"$DID"'","f":"'"$1"'","l":800}}' | jq '.data.deploymentLogs|length'; }
          codes() { gql '{"query":"query($d:String!,$f:String,$l:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:$l){ message } }","variables":{"d":"'"$DID"'","f":"'"$1"'","l":800}}' | jq -r '[.data.deploymentLogs[].message | capture(" (?<c>[2345][0-9][0-9]) ")?.c] | group_by(.)|map({(.[0]):length})|add'; }

          echo "===== VOLUMEN de requests en los logs recientes (hasta 800 líneas/filtro) ====="
          echo "  DESCARGAS (/descargas/foto): $(cnt '/descargas/foto/') líneas · códigos: $(codes '/descargas/foto/')"
          echo "  GALERÍA/EVENTO (/eventos/):  $(cnt '/eventos/') líneas"
          echo "  BÚSQUEDA por dorsal (?bib=): $(cnt 'bib=') líneas"
          echo "  BÚSQUEDA selfie:             $(cnt 'buscar-selfie') líneas"
          echo "  HOME (\"GET / \"):            $(cnt '\"GET / HTTP') líneas"
          echo "  ERRORES 500:                 $(cnt 'Internal Server Error') · TIMEOUT: $(cnt 'WORKER TIMEOUT')"
          echo

          echo "===== LATENCIA del sitio bajo carga (8 muestras) ====="
          curl -sS -m 20 "$SITE/healthz" | jq -c '{status,db:.checks.db.ok,workers:.checks.celery_workers.workers}'
          for i in $(seq 1 8); do echo "  home: $(curl -sS -o /dev/null -m 20 -w '%{time_total}s (%{http_code})' "$SITE/")"; done
          echo "==================== FIN ===================="
