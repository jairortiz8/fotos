name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  ani:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3"
      - name: ani
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PG_ID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          python3 - <<'PY'
          import os, psycopg
          c=psycopg.connect(os.environ["DBURL"], connect_timeout=20); cur=c.cursor()
          cur.execute("""select id, photographer_name, last_used_at, photos_uploaded, created_at
                         from photographers_photographerlink where photographer_name ilike %s""",("%ani%tolentino%",))
          for lid,name,lu,pu,cr in cur.fetchall():
              print(f"LINK {lid} '{name}'  last_used={lu}  contador={pu}  creado={cr}")
              cur.execute("select status,count(*) from photos_photo where photographer_link_id=%s group by status order by 2 desc",(lid,))
              print("   fotos por estado:", cur.fetchall())
              cur.execute("select max(created_at) from photos_photo where photographer_link_id=%s",(lid,))
              print("   última foto subida:", cur.fetchone()[0])
              cur.execute("select count(*) from photos_photo where photographer_link_id=%s and created_at between '2026-07-20 18:20:00+00' and '2026-07-20 18:35:00+00'",(lid,))
              print("   fotos creadas 18:20-18:35 UTC:", cur.fetchone()[0])
              cur.execute("select count(*) from photos_photo where photographer_link_id=%s and status not in ('approved','deleted','rejected')",(lid,))
              print("   fotos NO terminadas (ni approved/rejected/deleted):", cur.fetchone()[0])
          PY
          echo "==================== FIN ===================="
