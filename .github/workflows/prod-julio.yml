name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: runfoto, POSTGRES_PASSWORD: runfoto, POSTGRES_DB: runfoto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runfoto -d runfoto" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-secret-key-not-real
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://runfoto:runfoto@localhost:5432/runfoto
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SITE_NAME: "find your foto"
      SITE_DOMAIN: localhost:8000
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/runfoto-security-audit-bknirm }
      - name: system libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 libxcb1 libsm6 libxext6 libxrender1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml }
      - name: deps
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: black --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py check --deploy --fail-level WARNING || python manage.py check
      - run: pytest -m "not slow and not e2e" -q
