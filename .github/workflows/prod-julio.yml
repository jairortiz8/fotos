name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  caras:
    name: Encender el procesamiento de caras (selfie)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "psycopg[binary]" requests redis celery

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"])
          q1='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          d=requests.post(API,headers=H,json={"query":q1,"variables":{"e":os.environ["ENV_ID"]}},timeout=40).json()
          rid=next((e["node"]["serviceId"] for e in d["data"]["environment"]["serviceInstances"]["edges"]
                    if e["node"]["serviceName"].lower().startswith("redis")), None)
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "REDIS_PUB":vf(rid).get("REDIS_PUBLIC_URL") if rid else None}
          faltan=[k for k,v in out.items() if not v]
          if faltan: raise SystemExit(f"faltan: {faltan}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: 1 - Como esta antes de tocar nada
        run: |
          python3 - <<'PYX'
          import os, psycopg, redis
          SLUG="garmin-runners-girls-5k-social-run"
          r=redis.from_url(os.environ["REDIS_PUB"], socket_timeout=15, socket_connect_timeout=15)
          print("=== COLAS ===")
          for c in ("fast","faces","celery"):
              print(f"  {c:<8} {r.llen(c)} esperando")
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s",(SLUG,))
              eid=cur.fetchone()[0]
              cur.execute("""SELECT count(*), count(*) FILTER (WHERE preview_key<>''),
                                    count(*) FILTER (WHERE has_bibs_detected),
                                    count(*) FILTER (WHERE has_faces_detected)
                               FROM photos_photo WHERE event_id=%s""",(eid,))
              tot,prev,bib,cara=cur.fetchone()
              cur.execute("""SELECT count(*) FROM photos_faceembedding fe
                              JOIN photos_photo p ON p.id=fe.photo_id WHERE p.event_id=%s""",(eid,))
              emb=cur.fetchone()[0]
              cur.execute("""SELECT count(*) FROM photos_bib b
                              JOIN photos_photo p ON p.id=b.photo_id WHERE p.event_id=%s""",(eid,))
              bibs=cur.fetchone()[0]
              print(f"\n=== EVENTO (antes) ===")
              print(f"  fotos {tot} | con preview {prev} | con dorsal {bib} | con caras {cara}")
              print(f"  dorsales leidos {bibs} | caras indexadas {emb}")
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write(f"EVENT_ID={eid}\nEMB_ANTES={emb}\n")
          PYX

      - name: 2 - Encender la cola de caras
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          M="""mutation($p:String!,$e:String!,$s:String!,$n:String!,$v:String!){
                 variableUpsert(input:{projectId:$p, environmentId:$e, serviceId:$s, name:$n, value:$v}) }"""
          r=gql(M,{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
                   "s":os.environ["WORKER_ID"],"n":"WORKER_QUEUES","v":"fast,faces,celery"})
          print(f"  WORKER_QUEUES = fast,faces,celery -> {json.dumps(r.get('data'))}")
          if r.get("errors"): raise SystemExit(f"ERROR: {r['errors']}")
          D="""mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }"""
          r2=gql(D,{"s":os.environ["WORKER_ID"],"e":os.environ["ENV_ID"]})
          print(f"  redeploy disparado -> {json.dumps(r2.get('data'))[:120]}")
          if r2.get("errors"): print(f"  ERRORES: {r2['errors']}")
          PYX

      - name: 3 - Red de seguridad - encolar caras para las que ya tienen preview
        run: |
          python3 - <<'PYX'
          import os, psycopg
          from celery import Celery
          # Las fotos que process_photo ya termino encolaron su tarea de cara sola
          # (FACE_PROCESSING_ENABLED=true). Esto es por si alguna quedo afuera:
          # run_face_recognition_on_photo es idempotente (saltea las ya indexadas),
          # asi que re-encolar es barato y no duplica trabajo.
          eid=int(os.environ["EVENT_ID"])
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("""SELECT p.id FROM photos_photo p
                              WHERE p.event_id=%s AND p.preview_key<>''
                                AND NOT EXISTS (SELECT 1 FROM photos_faceembedding fe
                                                 WHERE fe.photo_id=p.id)
                              ORDER BY p.id""",(eid,))
              ids=[r[0] for r in cur.fetchall()]
          print(f"  fotos con preview y sin caras indexadas: {len(ids)}")
          if not ids:
              print("  nada que re-encolar (todavia no hay previews o ya estan todas)")
              raise SystemExit(0)
          app=Celery(broker=os.environ["REDIS_PUB"])
          for pid in ids:
              app.send_task("photos.run_face_recognition_on_photo", args=[pid], queue="faces")
          print(f"  re-encoladas {len(ids)} tareas de cara en la cola 'faces'")
          PYX

      - name: 4 - Ver si empieza a indexar caras
        if: always()
        run: |
          python3 - <<'PYX'
          import os, psycopg, redis, time
          eid=int(os.environ["EVENT_ID"])
          r=redis.from_url(os.environ["REDIS_PUB"], socket_timeout=15)
          def estado():
              with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
                  cur.execute("""SELECT count(*) FILTER (WHERE preview_key<>''),
                                        count(*) FILTER (WHERE has_faces_detected),
                                        count(*) FILTER (WHERE status='pending_review')
                                   FROM photos_photo WHERE event_id=%s""",(eid,))
                  prev,cara,pend=cur.fetchone()
                  cur.execute("""SELECT count(*) FROM photos_faceembedding fe
                                  JOIN photos_photo p ON p.id=fe.photo_id
                                 WHERE p.event_id=%s""",(eid,))
                  return prev,cara,pend,cur.fetchone()[0]
          print("=== AVANCE ===")
          for i in range(8):
              prev,cara,pend,emb = estado()
              print(f"  t+{i*45:3}s  fast={r.llen('fast'):<5} faces={r.llen('faces'):<5} "
                    f"previews={prev:<5} listas={pend:<5} fotos_con_cara={cara:<5} caras={emb}")
              if i < 7: time.sleep(45)
          prev,cara,pend,emb = estado()
          print(f"\n=== RESULTADO ===")
          print(f"  previews generados     {prev}")
          print(f"  listas para aprobar    {pend}")
          print(f"  fotos con cara detectada {cara}")
          print(f"  caras indexadas (selfie) {emb}   (antes: {os.environ.get('EMB_ANTES','?')})")
          print(f"  falta en cola: fast={r.llen('fast')}  faces={r.llen('faces')}")
          if emb > int(os.environ.get("EMB_ANTES","0")):
              print("\n  EL SELFIE YA ESTA INDEXANDO.")
          else:
              print("\n  todavia sin caras nuevas; puede estar cargando el modelo (~30s la 1a vez)")
          PYX
