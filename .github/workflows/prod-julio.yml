name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Chequeo previo al evento (solo lectura)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 celery redis

      - name: Chequeo completo
        run: |
          SHA=$(git rev-parse HEAD)
          python3 - "$SHA" <<'PYX'
          import os, sys, json, re, boto3, psycopg, requests
          from celery import Celery
          from datetime import datetime, timezone as tz
          sha = sys.argv[1][:8]
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          R=[]   # lineas del informe
          def add(x=""): R.append(x); print(x)

          # ---------- 1. Servicios ----------
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ status meta } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          svc={}
          add("1) SERVICIOS DE RAILWAY")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              c=((dep.get("meta") or {}).get("commitHash") or "")[:8]
              st=dep.get("status") or "SIN DEPLOY"
              svc[n["serviceName"]]={"id":n["serviceId"],"status":st,"commit":c}
              marca = "" if n["serviceName"] in ("Postgres","Redis","worker-fast") else (
                  "  <-- codigo viejo" if c and c!=sha else "")
              add(f"   {n['serviceName']:<13} {st:<10} {c or '-':<9}{marca}")
          add(f"   (main esta en {sha})")

          # ---------- 2. Variables ----------
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          web=vf(svc["fotos"]["id"]); wk=vf(svc["worker"]["id"]); rd=vf(svc["Redis"]["id"])
          pg=vf(os.environ["PG_ID"])
          add(); add("2) FLAGS")
          for k in ("FACE_SEARCH_ENABLED","PREVIEW_WATERMARK_ENABLED","PHOTO_UPLOAD_MAX_MB"):
              add(f"   web    {k:<26} {web.get(k,'(default)')}")
          for k in ("FACE_PROCESSING_ENABLED","MINOR_BLUR_ENABLED"):
              add(f"   worker {k:<26} {wk.get(k,'(default)')}")

          # ---------- 3. Workers escuchando ----------
          app=Celery(broker=rd["REDIS_PUBLIC_URL"])
          pings=app.control.ping(timeout=8) or []
          add(); add("3) WORKERS QUE CONTESTAN EL PING")
          for r0 in pings:
              for nom,est in r0.items(): add(f"   {nom} -> {est}")
          add(f"   total: {len(pings)} (esperado 2: worker y worker_fast)")
          import redis as _r
          rc=_r.from_url(rd["REDIS_PUBLIC_URL"])
          colas={c: rc.llen(c) for c in ("celery","fast")}
          add(f"   tareas encoladas: {colas} (0 = nada atrasado)")

          # ---------- 4. El evento ----------
          add(); add("4) EVENTO SEPTIMO X CEP")
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""SELECT id,name,slug,status,visibility,brand_overlay,date,
                                    public_until,searchable_until,permanent_archive,
                                    photo_count,pending_count
                             FROM events_event WHERE slug='septimo-x-cep-social-run'""")
              ev=cur.fetchone()
              if ev is None: add("   NO EXISTE EL EVENTO")
              else:
                  add(f"   id={ev[0]}  '{ev[1]}'")
                  add(f"   estado={ev[3]}  visibilidad={ev[4]}  logos={ev[5]!r}")
                  add(f"   fecha del evento={ev[6]}  galeria abierta hasta={ev[7]}")
                  add(f"   fotos={ev[10]}  pendientes={ev[11]}")
                  cur.execute("""SELECT id,photographer_name,is_active,expires_at,
                                        photo_limit,photos_uploaded,last_used_at
                                 FROM photographers_photographerlink
                                 WHERE event_id=%s ORDER BY id""",(ev[0],))
                  links=cur.fetchall()
                  add(); add("5) LINKS DE FOTOGRAFO DE ESE EVENTO")
                  ahora=datetime.now(tz.utc)
                  if not links: add("   NINGUNO -> el fotografo NO puede subir")
                  for l in links:
                      vig = "VIGENTE" if (l[2] and l[3] > ahora) else "NO SIRVE"
                      add(f"   id={l[0]} {l[1][:22]:<22} {vig}  vence {l[3]:%Y-%m-%d %H:%M} UTC"
                          f"  limite={l[4] or 'sin limite'}  subidas={l[5]}")
              cur.execute("SELECT count(*) FROM photos_photo")
              (tot,)=cur.fetchone()
              cur.execute("""SELECT status, count(*) FROM photos_photo
                             WHERE created_at > now() - interval '2 days'
                             GROUP BY status ORDER BY 2 DESC""")
              recientes=cur.fetchall()
          add(); add(f"6) BASE: {tot} fotos en total")
          add(f"   ultimas 48h por estado: {recientes or 'ninguna'}")

          # ---------- 7. R2 ----------
          r2=boto3.client("s3", endpoint_url=web["R2_ENDPOINT_URL"],
                          aws_access_key_id=web["R2_ACCESS_KEY_ID"],
                          aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"],
                          region_name="auto")
          lr=r2.list_objects_v2(Bucket=web["R2_BUCKET_NAME"], MaxKeys=1)
          add(); add(f"7) R2 responde: HTTP {lr['ResponseMetadata']['HTTPStatusCode']}"
                     f" (bucket accesible)")

          # ---------- 8. El sitio ----------
          add(); add("8) EL SITIO")
          se=requests.Session()
          for ruta in ("/healthz","/healthz/lite","/","/eventos/septimo-x-cep-social-run/",
                       "/preguntas/","/terminos/"):
              try:
                  rr=se.get("https://findyourfoto.com"+ruta, timeout=60)
                  extra=""
                  if ruta=="/healthz":
                      try: extra="  "+json.dumps(rr.json(), ensure_ascii=False)[:220]
                      except Exception: pass
                  add(f"   {ruta:<38} HTTP {rr.status_code}{extra}")
              except Exception as exc:
                  add(f"   {ruta:<38} ERROR {exc}")

          Path=__import__("pathlib").Path
          Path("demo_overlay").mkdir(exist_ok=True)
          (Path("demo_overlay")/"RESUMEN.txt").write_text("\n".join(R)+"\n")
          PYX

      - name: Devolver el resumen por rama
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "chequeo previo al evento"
          git push -f origin demo-overlay-tmp
