name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  descarga:
    name: medir perdida en la descarga (original vs con logos)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "psycopg[binary]" requests boto3 pillow
      - name: Comparar original vs descarga
        run: |
          python3 - <<'PYX'
          import io, os, requests, psycopg, boto3
          from botocore.config import Config
          from PIL import Image
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              r=requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
              return (r.json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          dburl=pg.get("DATABASE_PUBLIC_URL"); print("::add-mask::"+dburl)
          bucket=web["R2_BUCKET_NAME"]
          s3=boto3.client("s3", endpoint_url=web["R2_ENDPOINT_URL"],
              aws_access_key_id=web["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=web["R2_SECRET_ACCESS_KEY"],
              region_name="auto", config=Config(signature_version="s3v4"))

          with psycopg.connect(dburl, connect_timeout=30) as c, c.cursor() as cur:
              cur.execute('''
                SELECT p.id, p.original_key, p.branded_key, p.file_size, p.width, p.height
                FROM photos_photo p JOIN events_event e ON e.id=p.event_id
                WHERE e.slug='surf-city-2026' AND p.status='approved'
                  AND p.branded_key <> '' ORDER BY p.id DESC LIMIT 6
              ''')
              rows = cur.fetchall()
          print(f"muestras={len(rows)}\n")
          print(f"{'foto':>7} {'dimensiones':>13} {'original':>10} {'descarga':>10} {'dif':>7} {'px descarga':>13} {'EXIF':>6}")
          for pid, okey, bkey, fsize, w, h in rows:
              try:
                  head = s3.head_object(Bucket=bucket, Key=bkey)
                  bsize = head["ContentLength"]
              except Exception as exc:
                  print(f"{pid:>7} error head: {exc}"); continue
              buf = io.BytesIO(); s3.download_fileobj(bucket, bkey, buf); buf.seek(0)
              img = Image.open(buf)
              tiene_exif = bool(img.getexif())
              dif = round(100*(bsize-fsize)/fsize)
              print(f"{pid:>7} {f'{w}x{h}':>13} {fsize/1e6:>9.2f}M {bsize/1e6:>9.2f}M "
                    f"{dif:>+6}% {f'{img.width}x{img.height}':>13} {str(tiene_exif):>6}")
          PYX
