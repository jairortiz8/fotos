name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

# Export de métricas de TODOS los eventos (totales acumulados "hasta ahorita").
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" requests

      - name: export csv
        run: |
          python3 - <<'PY'
          import os, requests, csv, io
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          ENV=os.environ["ENV_ID"]; PROJ=os.environ["PROJECT_ID"]; PG=os.environ["PG_ID"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          qv='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          dv=requests.post(API,headers=H,json={"query":qv,"variables":{"p":PROJ,"e":ENV,"s":PG}},timeout=40).json()
          dburl=(dv.get("data",{}).get("variables") or {}).get("DATABASE_PUBLIC_URL")
          import psycopg
          c=psycopg.connect(dburl,connect_timeout=25); cur=c.cursor()

          # Totales acumulados por evento (fuente de verdad: contadores denormalizados).
          cur.execute("""
            select e.slug, e.name, to_char(e.date,'YYYY-MM-DD') as fecha, e.status,
                   (select count(*) from photos_photo p where p.event_id=e.id and p.status<>'deleted') as subidas,
                   (select count(*) from photos_photo p where p.event_id=e.id and p.status='approved') as aprobadas,
                   coalesce((select sum(p.view_count) from photos_photo p where p.event_id=e.id),0) as vistas,
                   e.search_count as busquedas,
                   coalesce((select sum(p.download_count) from photos_photo p where p.event_id=e.id),0) as descargas,
                   coalesce((select count(*) from photos_photo p where p.event_id=e.id and p.download_count>0),0) as fotos_descargadas_distintas
            from events_event e
            order by e.date desc, e.name
          """)
          rows=cur.fetchall()

          buf=io.StringIO(); w=csv.writer(buf)
          w.writerow(["evento_slug","evento","fecha","estado","subidas","aprobadas","vistas","busquedas","descargas","fotos_distintas_descargadas"])
          tot=[0,0,0,0,0,0]
          for r in rows:
              slug,name,fecha,status,sub,apr,vis,bus,des,dd=r
              w.writerow([slug,name,fecha,status,sub,apr,vis,bus,des,dd])
              tot=[tot[0]+sub,tot[1]+apr,tot[2]+vis,tot[3]+bus,tot[4]+des,tot[5]+dd]
          w.writerow(["TOTAL","(todos los eventos)","","",tot[0],tot[1],tot[2],tot[3],tot[4],tot[5]])
          c.close()

          out=buf.getvalue()
          print("CSV_START")
          print(out)
          print("CSV_END")
          PY
