name: prod-julio (one-off)

# READ-ONLY. Mide el volumen de Postgres (tamaño y uso) por la API de Railway.
# NO toca la base (que está caída por disco lleno).

on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

jobs:
  vol:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: vol
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }

          echo "===== VOLÚMENES del proyecto (tamaño configurado) ====="
          gql '{"query":"query($p:String!){ project(id:$p){ volumes{ edges{ node{ id name volumeInstances{ edges{ node{ id sizeMB currentSizeMB state serviceId } } } } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' \
            | jq -r '.data.project.volumes.edges[]?.node | "  volume: \(.name) (\(.id))", ( .volumeInstances.edges[]?.node | "     inst \(.id) sizeMB=\(.sizeMB) currentSizeMB=\(.currentSizeMB) state=\(.state) svc=\(.serviceId)" )'
          echo

          echo "===== servicios (para mapear svc->nombre) ====="
          gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' \
            | jq -r '.data.project.services.edges[].node | "  \(.id)  \(.name)"'
          echo

          echo "===== métricas de disco del volumen de Postgres (uso real) ====="
          PGID=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          START=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for M in DISK_USAGE_GB VOLUME_USAGE_GB; do
            R=$(gql '{"query":"query($m:MetricMeasurement!,$p:String!,$e:String!,$s:String!,$d:DateTime!){ metrics(measurements:[$m], projectId:$p, environmentId:$e, serviceId:$s, startDate:$d, sampleRateSeconds:120){ measurement values { ts value } } }","variables":{"m":"'"$M"'","p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$PGID"'","d":"'"$START"'"}}')
            ERR=$(echo "$R" | jq -r '.errors[0].message // empty')
            if [ -n "$ERR" ]; then echo "  $M: (error) $ERR"; continue; fi
            echo "  $M (últimos):"; echo "$R" | jq -r '.data.metrics[0].values[-6:][]? | "     \(.value)"'
          done
          echo "==================== FIN ===================="
