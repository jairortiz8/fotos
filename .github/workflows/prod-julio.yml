name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Redeployar workers en el commit nuevo"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests

      - name: Que argumentos acepta el deploy
        run: |
          python3 - <<'PYX'
          import json, os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query{ __schema{ mutationType{ fields{ name
                args{ name type{ name kind ofType{ name } } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q},timeout=60).json()["data"]
          for f in d["__schema"]["mutationType"]["fields"]:
              if f["name"] in ("serviceInstanceDeployV2","serviceInstanceDeploy"):
                  args=[(a["name"], a["type"].get("name") or
                         (a["type"].get("ofType") or {}).get("name")) for a in f["args"]]
                  print(f"  {f['name']}: {args}")
          PYX

      - name: Redeployar worker y worker_fast en el commit actual de main
        run: |
          SHA=$(git rev-parse HEAD)
          echo "main esta en $SHA"
          python3 - "$SHA" <<'PYX'
          import os, sys, time, requests
          sha=sys.argv[1]
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ status createdAt meta } } } } } }"""
          def estado():
              d=requests.post(API,headers=H,json={"query":Q,"variables":{
                  "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
              out={}
              for e in d["environment"]["serviceInstances"]["edges"]:
                  n=e["node"]; dep=n.get("latestDeployment") or {}
                  out[n["serviceName"]]={
                      "id":n["serviceId"],
                      "status":dep.get("status") or "SIN DEPLOY",
                      "commit":((dep.get("meta") or {}).get("commitHash") or "")[:8]}
              return out

          ANTES=estado()
          OBJETIVO=("worker","worker_fast")
          print("=== ANTES ===")
          for k in OBJETIVO: print(f"  {k:<12} {ANTES[k]['status']:<10} commit={ANTES[k]['commit']}")

          M="""mutation($s:String!,$e:String!,$c:String){
                 serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }"""
          for k in OBJETIVO:
              r=requests.post(API,headers=H,json={"query":M,"variables":{
                  "s":ANTES[k]["id"],"e":os.environ["ENV_ID"],"c":sha}},timeout=60).json()
              print(f"  deploy {k} ->", str(r)[:180])

          print("\n=== ESPERANDO ===")
          for i in range(40):
              time.sleep(20)
              ahora=estado()
              linea=" · ".join(f"{k}={ahora[k]['status']}/{ahora[k]['commit']}" for k in OBJETIVO)
              print(f"  [{i:02d}] {linea}")
              if all(ahora[k]["status"]=="SUCCESS" and ahora[k]["commit"]==sha[:8]
                     for k in OBJETIVO):
                  print("\n  LISTO: los dos corren el commit nuevo."); break
              if any(ahora[k]["status"] in ("FAILED","CRASHED") for k in OBJETIVO):
                  raise SystemExit("un deploy fallo")
          else:
              raise SystemExit("se acabo la espera sin llegar al commit nuevo")
          PYX
