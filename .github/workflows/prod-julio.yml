name: prod-julio (one-off)

# READ-ONLY. Polea /healthz hasta que la DB vuelva (Postgres terminando recovery
# tras el resize). Sin deps: solo curl.

on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

jobs:
  wait:
    runs-on: ubuntu-latest
    env:
      SITE: https://findyourfoto.com
    steps:
      - name: wait
        shell: bash +e {0}
        run: |
          set +e
          for i in $(seq 1 30); do
            BODY=$(curl -sS -m 15 "$SITE/healthz")
            DB=$(echo "$BODY" | jq -r '.checks.db.ok // "?"' 2>/dev/null)
            ST=$(echo "$BODY" | jq -r '.status // "?"' 2>/dev/null)
            CODE=$(curl -sS -o /dev/null -m 15 -w "%{http_code}" "$SITE/healthz/lite")
            echo "  intento $i: status=$ST db=$DB  /healthz/lite=$CODE"
            if [ "$DB" = "true" ]; then echo "  >>> DB ARRIBA. healthz OK."; echo "$BODY" | jq -c '{status,db:.checks.db.ok,redis:.checks.redis.ok,r2:.checks.r2.ok,workers:.checks.celery_workers.workers}'; break; fi
            sleep 8
          done
          echo "==================== FIN ===================="
