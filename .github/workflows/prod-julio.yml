name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  now:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      REDIS_ID: 37559685-4af5-4b9a-851d-84d9424f7424
      SITE: https://findyourfoto.com
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" redis
      - name: now
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PG_ID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          export REDISURL=$(vars_of "$REDIS_ID" | jq -r '.REDIS_PUBLIC_URL // empty')
          echo "SITIO:"
          curl -sS -m 20 "$SITE/healthz" | jq -c '{status,db:.checks.db.ok,redis:.checks.redis.ok,r2:.checks.r2.ok,workers:.checks.celery_workers.workers,beat:.checks.celery_beat.ok}'
          echo "  home HTTP:        $(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$SITE/")"
          echo "  evento HTTP:      $(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$SITE/eventos/surf-city-2026/")"
          echo "  buscar-selfie:    $(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$SITE/eventos/surf-city-2026/buscar-selfie/")"
          python3 - <<'PY'
          import os, redis, psycopg
          r=redis.from_url(os.environ["REDISURL"], socket_connect_timeout=15)
          print("COLA Celery:", {q:r.llen(q) for q in ("fast","faces","celery")})
          c=psycopg.connect(os.environ["DBURL"], connect_timeout=20); cur=c.cursor()
          cur.execute("select status,count(*) from photos_photo group by status order by 2 desc")
          print("ESTADOS:", dict(cur.fetchall()))
          cur.execute("select count(*) from photos_photo where status='processing' and updated_at<now()-interval '10 minutes'")
          print("colgadas (processing >10min):", cur.fetchone()[0])
          cur.execute("select count(*) from photos_bib where created_at>now()-interval '10 minutes'")
          print("dorsales nuevos (10min):", cur.fetchone()[0])
          cur.execute("select count(*) from photos_faceembedding")
          print("embeddings totales:", cur.fetchone()[0])
          PY
          echo "==================== FIN ===================="
