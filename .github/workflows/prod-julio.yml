name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  estado:
    name: estado de servicios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      BEAT_ID: 0a364656-8700-4f69-bac0-b91c50cd722b
    steps:
      - name: Estado actual
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              b=json.dumps({"query":q,"variables":v or {}}).encode()
              r=urllib.request.Request(API,data=b,headers={
                "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(r,timeout=45))
          q='''query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status createdAt } } } } } }'''
          d=gql(q,{"e":os.environ["ENV_ID"]})
          print(">>> ESTADO ANTES")
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              print(f"    {n['serviceName']:<10} {dep.get('status') or 'SIN DEPLOY':<12} {(dep.get('createdAt') or '')[:19]}")

          M='mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }'
          print(">>> LEVANTANDO")
          for nom, sid in (("worker",os.environ["WORKER_ID"]),("beat",os.environ["BEAT_ID"])):
              try:
                  r=gql(M,{"s":sid,"e":os.environ["ENV_ID"]})
                  if r.get("errors"):
                      print(f"    {nom}: ERROR -> {json.dumps(r['errors'])[:220]}")
                  else:
                      print(f"    {nom}: OK -> {json.dumps(r.get('data'))[:120]}")
              except Exception as exc:
                  print(f"    {nom}: EXCEPCION -> {exc}")
          PYX
      - run: sleep 150
      - name: Estado despues
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          b=json.dumps({"query":'''query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt } } } } } }''',
                "variables":{"e":os.environ["ENV_ID"]}}).encode()
          r=urllib.request.Request(API,data=b,headers={
            "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
            "Content-Type":"application/json","User-Agent":"curl/8.0"})
          d=json.load(urllib.request.urlopen(r,timeout=45))
          print(">>> ESTADO DESPUES")
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              print(f"    {n['serviceName']:<10} {dep.get('status') or 'SIN DEPLOY':<12} {(dep.get('createdAt') or '')[:19]}")
          PYX
