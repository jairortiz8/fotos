name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  comprobar:
    name: SOLO LECTURA - se esta haciendo selfie y OCR?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "psycopg[binary]" requests redis

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"])
          q1='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          d=requests.post(API,headers=H,json={"query":q1,"variables":{"e":os.environ["ENV_ID"]}},timeout=40).json()
          rid=next((e["node"]["serviceId"] for e in d["data"]["environment"]["serviceInstances"]["edges"]
                    if e["node"]["serviceName"].lower().startswith("redis")), None)
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "REDIS_PUB":vf(rid).get("REDIS_PUBLIC_URL") if rid else None}
          faltan=[k for k,v in out.items() if not v]
          if faltan: raise SystemExit(f"faltan: {faltan}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Que se esta haciendo y que no
        run: |
          python3 - <<'PYX'
          import os, psycopg, requests, redis
          SLUG="garmin-runners-girls-5k-social-run"

          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":os.environ["WORKER_ID"]}
          wk=(requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
              .json().get("data",{}) or {}).get("variables") or {}
          colas = wk.get("WORKER_QUEUES","(sin setear)")
          print("=== CONFIGURACION DEL WORKER ===")
          print(f"  WORKER_QUEUES           = {colas}")
          print(f"  FACE_PROCESSING_ENABLED = {wk.get('FACE_PROCESSING_ENABLED','(sin setear)')}")
          print(f"  OCR_BACKEND             = {wk.get('OCR_BACKEND','(sin setear)')}")
          print(f"\n  OCR  (cola 'fast')  -> {'SI se procesa' if 'fast' in colas else 'NO se procesa'}")
          print(f"  CARAS/selfie (cola 'faces') -> {'SI se procesa' if 'faces' in colas else 'NO se procesa (encoladas)'}")

          r=redis.from_url(os.environ["REDIS_PUB"], socket_timeout=15, socket_connect_timeout=15)
          print("\n=== TAREAS EN COLA AHORA ===")
          for cola in ("fast","faces","celery"):
              print(f"  {cola:<8} {r.llen(cola)} esperando")

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s",(SLUG,))
              eid=cur.fetchone()[0]
              cur.execute("""SELECT status, count(*) FROM photos_photo
                              WHERE event_id=%s GROUP BY 1 ORDER BY 2 DESC""",(eid,))
              print("\n=== FOTOS DEL EVENTO ===")
              for st,n in cur.fetchall(): print(f"  {st:<20} {n}")

              cur.execute("""SELECT count(*),
                                    count(*) FILTER (WHERE preview_key<>''),
                                    count(*) FILTER (WHERE thumbnail_key<>''),
                                    count(*) FILTER (WHERE has_bibs_detected),
                                    count(*) FILTER (WHERE has_faces_detected)
                               FROM photos_photo WHERE event_id=%s""",(eid,))
              total, prev, thumb, conbib, concara = cur.fetchone()
              print(f"\n=== QUE SE LES HIZO A LAS {total} FOTOS ===")
              print(f"  preview generado     {prev}")
              print(f"  thumbnail generado   {thumb}")
              print(f"  con dorsal detectado {conbib}   <- esto es el OCR")
              print(f"  con caras detectadas {concara}  <- esto es el selfie")

              cur.execute("""SELECT count(*) FROM photos_bib b
                              JOIN photos_photo p ON p.id=b.photo_id WHERE p.event_id=%s""",(eid,))
              print(f"\n  dorsales leidos en total: {cur.fetchone()[0]}")
              cur.execute("""SELECT count(*) FROM photos_faceembedding fe
                              JOIN photos_photo p ON p.id=fe.photo_id WHERE p.event_id=%s""",(eid,))
              print(f"  caras indexadas en total: {cur.fetchone()[0]}")

              cur.execute("""SELECT b.number, b.confidence, b.source
                               FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id
                              WHERE p.event_id=%s ORDER BY b.id DESC LIMIT 8""",(eid,))
              muestra=cur.fetchall()
              if muestra:
                  print("\n  ultimos dorsales leidos (muestra):")
                  for num, conf, src in muestra:
                      print(f"    #{num:<8} confianza={conf:.2f}  fuente={src}")
              else:
                  print("\n  todavia no se leyo ningun dorsal")
          PYX
