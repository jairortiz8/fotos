name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  limpiar:
    name: Preview sin marca de agua + backfills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet "psycopg[binary]" requests redis celery

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"])
          q1='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          d=requests.post(API,headers=H,json={"query":q1,"variables":{"e":os.environ["ENV_ID"]}},timeout=40).json()
          rid=next((e["node"]["serviceId"] for e in d["data"]["environment"]["serviceInstances"]["edges"]
                    if e["node"]["serviceName"].lower().startswith("redis")), None)
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "REDIS_PUB":vf(rid).get("REDIS_PUBLIC_URL") if rid else None}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: 1 - Apagar la marca de agua en prod
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          M="""mutation($p:String!,$e:String!,$s:String!,$n:String!,$v:String!){
                 variableUpsert(input:{projectId:$p, environmentId:$e, serviceId:$s, name:$n, value:$v}) }"""
          # El preview lo genera el WORKER. Se setea igual en el web por si algún
          # día se genera desde ahí (regenerar desde el dashboard, por ejemplo).
          for etiqueta, sid in (("worker", os.environ["WORKER_ID"]), ("web", os.environ["WEB_ID"])):
              r=gql(M,{"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
                       "s":sid,"n":"PREVIEW_WATERMARK_ENABLED","v":"false"})
              print(f"  {etiqueta}.PREVIEW_WATERMARK_ENABLED = false -> {json.dumps(r.get('data'))}")
              if r.get("errors"): raise SystemExit(f"ERROR: {r['errors']}")
          D="""mutation($s:String!,$e:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e) }"""
          r2=gql(D,{"s":os.environ["WORKER_ID"],"e":os.environ["ENV_ID"]})
          print(f"\n  redeploy del worker disparado -> {json.dumps(r2.get('data'))[:110]}")
          if r2.get("errors"): print(f"  ERRORES: {r2['errors']}")
          print("  (el deploy trae ADEMAS el arreglo del visor de caras)")
          PYX

      - name: 2 - Esperar el deploy
        run: sleep 420

      - name: 3 - Ya esta el codigo nuevo corriendo?
        if: always()
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status meta } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          listo="no"
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              meta=dep.get("meta") or {}
              sha=(meta.get("commitHash") or "")[:7]
              msg=((meta.get("commitMessage") or "").splitlines() or [""])[0][:50]
              print(f"  {n['serviceName']:<12} {dep.get('status') or 'SIN DEPLOY':<12} {sha} {msg}")
              # 52c3599 = "feat(preview): poder apagar la marca de agua"
              if n["serviceName"]=="worker" and dep.get("status")=="SUCCESS" and (
                  "marca de agua" in msg.lower() or "visor" in msg.lower()):
                  listo="si"
          print(f"\n  worker con el codigo nuevo: {listo}")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"LISTO={listo}\n")
          PYX

      - name: 4 - Backfill (previews sin marca + avatares de fotos grupales)
        if: env.LISTO == 'si'
        run: |
          python3 - <<'PYX'
          import os, psycopg
          from celery import Celery
          SLUG="garmin-runners-girls-5k-social-run"
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT id FROM events_event WHERE slug=%s",(SLUG,))
              eid=cur.fetchone()[0]
              cur.execute("""SELECT count(*) FROM photos_photo
                              WHERE event_id=%s AND status<>'deleted' AND original_key<>''""",(eid,))
              n_fotos=cur.fetchone()[0]
              cur.execute("""SELECT DISTINCT fe.photo_id FROM photos_faceembedding fe
                              JOIN photos_photo p ON p.id=fe.photo_id
                             WHERE p.event_id=%s AND fe.avatar_key='' AND p.original_key<>''""",(eid,))
              caras_ids=[r[0] for r in cur.fetchall()]

          app=Celery(broker=os.environ["REDIS_PUB"])
          # Una sola task: el worker hace el fan-out. include_preview=True es lo
          # que regenera el preview SIN marca de agua. NO toca el estado de la
          # foto, así que las aprobaciones de Jair se mantienen.
          app.send_task("photos.regenerate_event_thumbnails", args=[eid],
                        kwargs={"include_preview": True})
          print(f"  encolada la regeneracion de previews de {n_fotos} fotos (sin marca de agua)")
          print("  las aprobaciones NO se tocan: regenerate_thumbnail no cambia el status")

          for pid in caras_ids:
              app.send_task("photos.generate_face_avatars", args=[pid])
          print(f"  encolados {len(caras_ids)} avatares de caras (umbral nuevo de 50px)")
          PYX

      - name: 4b - Todavia no
        if: env.LISTO != 'si'
        run: |
          echo "El worker todavia no corre el codigo nuevo."
          echo "NO encolo nada: los previews saldrian otra vez CON marca de agua"
          echo "y los avatares con el umbral viejo. Repetir cuando el deploy termine."
