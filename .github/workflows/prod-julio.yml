name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  apagar:
    name: apagar eventos de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Estado del deploy en Railway
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=45))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt meta } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          print(f"{'servicio':<12} {'estado':<14} {'desde':<22} commit")
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              meta=dep.get("meta") or {}
              sha=(meta.get("commitHash") or "")[:7]
              msg=((meta.get("commitMessage") or "").splitlines() or [""])[0][:48]
              print(f"{n['serviceName']:<12} {dep.get('status') or 'SIN DEPLOY':<14} "
                    f"{(dep.get('createdAt') or '-')[:19]:<22} {sha} {msg}")
          PYX

      - name: El arreglo del buscador esta en el codigo desplegado
        run: |
          python3 - <<'PYX'
          import re
          src = open("apps/search/views.py").read()
          umbral = re.search(r"^FACE_CLICK_THRESHOLD\s*=\s*([\d.]+)", src, re.M)
          tope   = re.search(r"^FACE_CLICK_MAX_RESULTS\s*=\s*(\d+)", src, re.M)
          print(f"  FACE_CLICK_THRESHOLD  = {umbral.group(1)}   (antes 0.62)")
          print(f"  FACE_CLICK_MAX_RESULTS = {tope.group(1)}     (antes heredaba 50)")
          assert umbral.group(1) == "0.48", "el umbral no es el arreglado"
          assert tope.group(1) == "400", "el tope no es el arreglado"
          for f in ("apps/events/views.py", "apps/reviewers/views.py"):
              t = open(f).read()
              assert "FACE_CLICK_MAX_RESULTS" in t, f"{f} no usa el tope propio"
              print(f"  {f}: usa FACE_CLICK_THRESHOLD + FACE_CLICK_MAX_RESULTS")
          PYX

      - name: Apagar los eventos de prueba
        run: |
          python3 - <<'PYX'
          import os, psycopg

          # Solo estos tres. Los eventos REALES (surf-city-2026 con 19.506 fotos y
          # camino-a-san-luis-iron-dream con 3.082) NO se tocan.
          APAGAR = ["surf-city-prueba-logos", "trail-ipala-2026", "maraton-antigua-2026"]
          INTOCABLES = {"surf-city-2026", "camino-a-san-luis-iron-dream"}
          assert not (set(APAGAR) & INTOCABLES), "la lista toca un evento real"

          def listar(cur, titulo):
              print(f"\n=== {titulo} ===")
              cur.execute("""
                  SELECT e.slug, e.status, e.visibility, e.photo_count,
                         (SELECT count(*) FROM photographers_photographerlink l
                           WHERE l.event_id = e.id AND l.is_active) AS links
                    FROM events_event e
                   WHERE e.status <> 'deleted'
                   ORDER BY e.date DESC
              """)
              for slug, st, vis, fotos, links in cur.fetchall():
                  print(f"  {slug:<32} {st:<16} vis={vis:<9} fotos={fotos:<6} links={links}")

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=False) as conn:
              with conn.cursor() as cur:
                  listar(cur, "ANTES")

                  print("\n=== APAGANDO ===")
                  for slug in APAGAR:
                      cur.execute("SELECT status, photo_count FROM events_event WHERE slug = %s", (slug,))
                      fila = cur.fetchone()
                      if fila is None:
                          print(f"  {slug}: no existe (nada que hacer)")
                          continue
                      antes, fotos = fila
                      if antes == "draft":
                          print(f"  {slug}: ya estaba apagado (draft)")
                          continue
                      cur.execute(
                          "UPDATE events_event SET status = 'draft', updated_at = now() "
                          "WHERE slug = %s AND slug <> ALL(%s)",
                          (slug, list(INTOCABLES)),
                      )
                      print(f"  {slug}: {antes} -> draft  ({fotos} fotos intactas, {cur.rowcount} fila)")

                  listar(cur, "DESPUES")

                  print("\n=== LINKS DE FOTOGRAFO ACTIVOS ===")
                  print("Un link activo en un evento apagado deja subir fotos al evento equivocado.")
                  cur.execute("""
                      SELECT e.slug, e.status, l.photographer_name, l.expires_at
                        FROM photographers_photographerlink l
                        JOIN events_event e ON e.id = l.event_id
                       WHERE l.is_active AND e.status <> 'deleted'
                       ORDER BY e.date DESC, l.photographer_name
                  """)
                  filas = cur.fetchall()
                  if not filas:
                      print("  (ninguno)")
                  for slug, st, nombre, vence in filas:
                      print(f"  {slug:<32} {st:<16} {nombre!r:<28} vence={vence:%d/%m/%Y}")

              conn.commit()
              print("\nCOMMIT hecho.")
          PYX

      - name: Confirmar el estado final
        run: |
          python3 - <<'PYX'
          import os, psycopg
          esperado = {
              "surf-city-prueba-logos": "draft",
              "trail-ipala-2026": "draft",
              "maraton-antigua-2026": "draft",
          }
          reales = {"surf-city-2026", "camino-a-san-luis-iron-dream"}
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("SELECT slug, status FROM events_event WHERE slug = ANY(%s)",
                          (list(esperado) + list(reales),))
              estado = dict(cur.fetchall())
          ok = True
          for slug, quiero in esperado.items():
              hay = estado.get(slug, "(no existe)")
              marca = "OK" if hay == quiero else "MAL"
              if hay != quiero and hay != "(no existe)": ok = False
              print(f"  {marca:<4} {slug:<32} {hay}")
          for slug in reales:
              hay = estado.get(slug, "(no existe)")
              marca = "OK" if hay not in ("draft", "deleted") else "MAL"
              if marca == "MAL": ok = False
              print(f"  {marca:<4} {slug:<32} {hay}   <- evento real, debe seguir vivo")
          raise SystemExit(0 if ok else 1)
          PYX
