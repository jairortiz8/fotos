name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  logs:
    name: SOLO LECTURA - por que el OCR devuelve cero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Como llama el codigo a Gemini
        run: |
          echo "=== modelo por defecto en settings ==="
          grep -n "GEMINI" config/settings/base.py
          echo
          echo "=== donde se arma la llamada ==="
          grep -rn "generativelanguage\|GEMINI_OCR_MODEL\|models/\|:generateContent" apps/ml/ | head -20

      - name: Logs del worker filtrados por OCR
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          dep=None
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              if e["node"]["serviceName"]=="worker":
                  n=e["node"].get("latestDeployment") or {}
                  dep=n.get("id"); print(f"  worker deploy={dep} estado={n.get('status')}")
          if not dep: raise SystemExit("sin deploy de worker")
          ql="""query($d:String!,$n:Int!){ deploymentLogs(deploymentId:$d, limit:$n){ timestamp message } }"""
          logs=gql(ql,{"d":dep,"n":1500})["data"]["deploymentLogs"]
          print(f"\n  {len(logs)} lineas de log en total")

          claves = ("ocr","gemini","bib","dorsal","error","exception","traceback",
                    "failed","retry","404","403","429","quota","api key","invalid")
          hits=[l for l in logs
                if any(k in (l.get("message") or "").lower() for k in claves)]
          print(f"  {len(hits)} lineas mencionan OCR / Gemini / error\n")
          print("=== ULTIMAS 60 LINEAS RELEVANTES ===")
          for l in hits[-60:]:
              print(f"  {(l.get('timestamp') or '')[:19]} {(l.get('message') or '')[:230]}")
          if not hits:
              print("  (ninguna) -> el worker no logueo NADA de OCR:")
              print("     o la task nunca corrio, o corre y no dice nada.")
              print("\n=== ULTIMAS 40 LINEAS CUALESQUIERA ===")
              for l in logs[-40:]:
                  print(f"  {(l.get('timestamp') or '')[:19]} {(l.get('message') or '')[:230]}")
          PYX
