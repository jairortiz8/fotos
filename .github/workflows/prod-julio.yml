name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Probar el overlay de punta a punta en prod"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow celery redis

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ status meta } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          ids={}
          print("=== SERVICIOS ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              sha=((dep.get("meta") or {}).get("commitHash") or "")[:8]
              print(f"  {n['serviceName']:<14} {dep.get('status','SIN DEPLOY'):<10} commit={sha}")
              ids[n["serviceName"]]=n["serviceId"]
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(ids["fotos"]); rd=vf(ids["Redis"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "BROKER_URL":rd.get("REDIS_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Reprocesar la foto 45833 y mirar el preview
        run: |
          python3 - <<'PYX'
          import io, os, time, boto3, psycopg
          from celery import Celery
          from pathlib import Path
          from PIL import Image

          FOTO = 45833
          app = Celery(broker=os.environ["BROKER_URL"])
          print("workers que contestan:", len(app.control.ping(timeout=8) or []))

          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT preview_key, updated_at FROM photos_photo WHERE id=%s", (FOTO,))
              key_antes, upd_antes = cur.fetchone()
          print(f"preview antes: {key_antes}  (procesada {upd_antes:%H:%M:%S})")

          app.send_task("photos.process_photo", args=[FOTO], queue="fast")
          print("task encolada, esperando a que el worker la termine...")

          for i in range(30):
              time.sleep(10)
              with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
                  cur.execute("SELECT status, preview_key, updated_at FROM photos_photo "
                              "WHERE id=%s", (FOTO,))
                  st, key, upd = cur.fetchone()
              print(f"  [{i:02d}] estado={st} procesada={upd:%H:%M:%S}")
              if upd > upd_antes and st not in ("processing", "pending"):
                  break

          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          buf = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, buf)
          buf.seek(0)
          im = Image.open(buf).convert("RGB")
          im.save(OUT/"PROD_reprocesada.jpg", quality=90)
          print(f"\npreview nuevo: {key}  {im.size}")

          # Chequeo automatico: en la franja de abajo tiene que haber blanco (logos).
          w, h = im.size
          def hay_blanco(x0, x1, y0, y1):
              return any(all(c > 180 for c in im.getpixel((x, y)))
                         for x in range(x0, x1, 4) for y in range(y0, y1, 4))
          izq = hay_blanco(0, w // 3, int(h * 0.90), h)
          der = hay_blanco(w * 2 // 3, w, int(h * 0.90), h)
          centro = hay_blanco(w // 4, w * 3 // 4, int(h * 0.80), int(h * 0.90))
          print(f"logos abajo-izq={izq}  abajo-der={der}  principales-centro={centro}")
          print("RESULTADO:", "OVERLAY APLICADO" if (izq and der and centro)
                else "REVISAR, no se ven los logos donde deberian")
          PYX

      - name: Devolver por rama
        if: always()
        run: |
          git init -q . 2>/dev/null || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} 2>/dev/null || true
          git checkout -q --orphan demo-overlay-tmp
          git add -f demo_overlay/
          git commit -qm "diag: preview tras reprocesar con el codigo nuevo"
          git push -f origin demo-overlay-tmp
