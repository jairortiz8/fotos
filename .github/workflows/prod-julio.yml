name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  revisar:
    name: revisar el evento nuevo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: 1 - Servicios de Railway
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=45))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt meta } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          print(f"{'servicio':<12} {'estado':<14} commit")
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              meta=dep.get("meta") or {}
              sha=(meta.get("commitHash") or "")[:7]
              msg=((meta.get("commitMessage") or "").splitlines() or [""])[0][:44]
              print(f"{n['serviceName']:<12} {dep.get('status') or 'SIN DEPLOY':<14} {sha} {msg}")
          PYX

      - name: 2 - El evento nuevo
        run: |
          python3 - <<'PYX'
          import os, psycopg
          from datetime import datetime, timezone as tz

          ahora = datetime.now(tz.utc)
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
              cur.execute("""
                  SELECT id, slug, name, status, visibility, date, created_at,
                         photo_count, pending_count, cover_key,
                         organizer_name, organizer_instagram,
                         public_until, searchable_until, archive_until, permanent_archive
                    FROM events_event
                   WHERE status <> 'deleted'
                   ORDER BY created_at DESC LIMIT 3
              """)
              filas = cur.fetchall()
              if not filas:
                  raise SystemExit("no hay eventos")

              print("=== LOS 3 EVENTOS MAS RECIENTES (por fecha de creacion) ===")
              for f in filas:
                  print(f"  {f[1]:<32} creado={f[6]:%d/%m %H:%M}  estado={f[3]:<16} fotos={f[7]}")

              ev = filas[0]
              (eid, slug, nombre, estado, vis, fecha, creado, fotos, pendientes,
               portada, org, ig, hasta_pub, hasta_busq, hasta_arch, permanente) = ev

              print(f"\n=== EVENTO NUEVO: {nombre} ===")
              print(f"  slug            {slug}")
              print(f"  id              {eid}")
              print(f"  creado          {creado:%d/%m/%Y %H:%M} UTC")
              print(f"  fecha de carrera {fecha}")
              print(f"  estado          {estado}")
              print(f"  visibilidad     {vis}")
              print(f"  portada         {'si (' + portada + ')' if portada else 'NO tiene'}")
              print(f"  organizador     {org or '(vacio)'}   IG: {ig or '(vacio)'}")
              print(f"  fotos           {fotos}   pendientes de aprobar: {pendientes}")
              print(f"  galeria abierta hasta   {hasta_pub}")
              print(f"  busqueda abierta hasta  {hasta_busq}")
              print(f"  archivo hasta           {hasta_arch}")
              print(f"  archivo permanente      {permanente}")

              # --- diagnostico de lo que le falta para funcionar hoy ---
              print("\n=== CHEQUEOS ===")
              problemas = []
              if estado in ("draft", "deleted"):
                  problemas.append(f"estado '{estado}': la galeria publica devuelve 404. "
                                   "Para que los corredores entren tiene que estar en 'live' (Galeria abierta).")
              elif estado in ("upcoming",):
                  problemas.append("estado 'upcoming': todavia no muestra galeria.")
              else:
                  print(f"  OK  estado '{estado}' deja ver/buscar")

              if vis == "private":
                  problemas.append("visibilidad 'private': devuelve 404 aunque el estado este bien.")
              elif vis == "unlisted":
                  print("  OJO visibilidad 'unlisted': no sale en la home, solo con el link directo")
              else:
                  print("  OK  visibilidad 'public' (sale en la home)")

              if hasta_pub and hasta_pub < ahora:
                  problemas.append(f"public_until ya paso ({hasta_pub:%d/%m/%Y}): la galeria se cierra sola.")
              if hasta_busq and hasta_busq < ahora:
                  problemas.append(f"searchable_until ya paso ({hasta_busq:%d/%m/%Y}): no se puede buscar.")
              if not portada:
                  print("  OJO sin portada: se muestra el placeholder de marca (no rompe nada)")

              # --- links de fotografo ---
              cur.execute("""
                  SELECT photographer_name, is_active, expires_at, photo_limit,
                         photos_uploaded, last_used_at
                    FROM photographers_photographerlink
                   WHERE event_id = %s ORDER BY created_at
              """, (eid,))
              links = cur.fetchall()
              print(f"\n=== LINKS DE FOTOGRAFO ({len(links)}) ===")
              if not links:
                  problemas.append("NO hay ningun link de fotografo: nadie puede subir fotos todavia.")
                  print("  (ninguno)")
              usables = 0
              for nom, activo, vence, tope, subidas, uso in links:
                  vencido = vence < ahora
                  sirve = activo and not vencido
                  usables += sirve
                  marca = "OK  " if sirve else "NO  "
                  motivo = "" if sirve else ("(revocado)" if not activo else "(VENCIDO)")
                  print(f"  {marca}{nom!r:<28} vence={vence:%d/%m/%Y} {motivo:<12} "
                        f"tope={tope if tope else 'sin tope'} subidas={subidas}")
              if links and usables == 0:
                  problemas.append("todos los links estan vencidos o revocados: nadie puede subir.")

              # --- fotos por estado ---
              cur.execute("""
                  SELECT status, count(*) FROM photos_photo
                   WHERE event_id = %s GROUP BY status ORDER BY 2 DESC
              """, (eid,))
              porestado = cur.fetchall()
              print(f"\n=== FOTOS DEL EVENTO ===")
              if not porestado:
                  print("  (todavia no se subio ninguna)")
              for st, n in porestado:
                  print(f"  {st:<20} {n}")

              # --- trabadas en todo el sistema ---
              cur.execute("""
                  SELECT count(*) FROM photos_photo
                   WHERE status IN ('processing','uploading')
                     AND created_at < now() - interval '1 hour'
              """)
              trabadas = cur.fetchone()[0]
              print(f"\n  fotos trabadas (>1h procesando, todo el sistema): {trabadas}")
              if trabadas:
                  problemas.append(f"{trabadas} fotos trabadas hace mas de 1h: revisar el worker.")

              print("\n=== RESUMEN ===")
              if problemas:
                  for p in problemas:
                      print(f"  FALTA: {p}")
              else:
                  print("  Todo en orden para recibir fotos y que los corredores busquen.")
              with open(os.environ["GITHUB_ENV"],"a") as fh:
                  fh.write(f"SLUG_NUEVO={slug}\n")
          PYX

      - name: 3 - Como responde el sitio de verdad
        run: |
          python3 - <<'PYX'
          import os, requests
          base = "https://" + os.environ["SITE_DOMAIN"]
          slug = os.environ["SLUG_NUEVO"]
          for ruta, que in [("/", "home"),
                            (f"/eventos/{slug}/", "galeria del evento nuevo"),
                            (f"/eventos/{slug}/?bib=1", "busqueda por dorsal"),
                            ("/healthz/lite", "health")]:
              try:
                  r = requests.get(base + ruta, timeout=30, allow_redirects=True)
                  print(f"  {r.status_code}  {que:<28} {ruta}")
              except Exception as exc:
                  print(f"  ERR  {que:<28} {ruta}  {exc}")
          PYX

      - name: 4 - Flags del worker y del web
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          web=vf(os.environ["WEB_ID"]); wk=vf(os.environ["WORKER_ID"])
          print("web:")
          for k in ("FACE_SEARCH_ENABLED","OCR_BACKEND","PHOTO_UPLOAD_MAX_MB","SITE_NAME"):
              print(f"  {k} = {web.get(k,'(sin setear)')}")
          print("worker:")
          for k in ("FACE_PROCESSING_ENABLED","FACE_SEARCH_ENABLED","MINOR_BLUR_ENABLED",
                    "OCR_BACKEND","PHOTO_UPLOAD_MAX_MB"):
              print(f"  {k} = {wk.get(k,'(sin setear)')}")
          PYX
