name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Asignar overlay y confirmar workers"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Estado de los servicios
        run: |
          python3 - <<'PYX'
          import json, os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                id serviceId serviceName latestDeployment{ id status } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          filas=[]
          print("=== SERVICIOS ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              st=dep.get("status") or "SIN DEPLOY"
              print(f"  {n['serviceName']:<14} {st}")
              filas.append({"nombre":n["serviceName"],"serviceId":n["serviceId"],"estado":st})
          with open("servicios.json","w") as f: json.dump(filas,f)
          PYX

      - name: Esperar a que worker, worker_fast y beat queden arriba
        run: |
          python3 - <<'PYX'
          import os, time, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }"""
          ESPERAN=("worker","worker_fast","beat")
          for intento in range(30):
              d=requests.post(API,headers=H,json={"query":Q,"variables":{
                  "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
              est={n["node"]["serviceName"]:
                   (n["node"].get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
                   for n in d["environment"]["serviceInstances"]["edges"]}
              linea=" · ".join(f"{k}={est.get(k)}" for k in ESPERAN)
              print(f"  [{intento:02d}] {linea}")
              if all(est.get(k)=="SUCCESS" for k in ESPERAN):
                  print("\n  LISTO: los tres estan arriba."); break
              if any(est.get(k) in ("FAILED","CRASHED") for k in ESPERAN):
                  raise SystemExit("algun servicio quedo en FAILED/CRASHED")
              time.sleep(25)
          else:
              print("\n  OJO: se acabo la espera, revisar en el dashboard")
          print("\n=== TODOS LOS SERVICIOS ===")
          for k,v in est.items(): print(f"  {k:<14} {v}")
          PYX

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Asignar el template al evento
        run: |
          python3 - <<'PYX'
          import os, psycopg
          SLUG = "septimo-x-cep-social-run"
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute(
                  "UPDATE events_event SET brand_overlay='septimo_cep' "
                  "WHERE slug=%s AND status <> 'deleted' RETURNING id, name",
                  (SLUG,),
              )
              fila = cur.fetchone()
              if fila is None:
                  raise SystemExit(f"no existe el evento {SLUG}")
              cx.commit()
              print(f"  overlay asignado -> id={fila[0]} {fila[1]}")

              cur.execute("SELECT id, name, slug, status, brand_overlay FROM events_event "
                          "WHERE brand_overlay <> '' ORDER BY id")
              print("\n=== EVENTOS CON LOGOS ===")
              for r in cur.fetchall():
                  print(f"  id={r[0]:<3} {r[1][:34]:<34} estado={r[3]:<15} overlay={r[4]}")

              # La migracion 0007 (solo choices) tiene que estar aplicada.
              cur.execute("SELECT name FROM django_migrations WHERE app='events' "
                          "ORDER BY id DESC LIMIT 3")
              print("\n=== ULTIMAS MIGRATIONS DE events ===")
              for (n,) in cur.fetchall(): print("  ", n)
          PYX

      - name: Render real con el codigo de produccion
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE","x")
          # Se usa el modulo REAL del repo, con settings stubbeado (solo necesita BASE_DIR).
          import sys, types
          conf = types.ModuleType("django.conf")
          class _S: BASE_DIR = os.getcwd()
          conf.settings = _S()
          dj = types.ModuleType("django"); dj.conf = conf
          sys.modules.setdefault("django", dj); sys.modules["django.conf"] = conf
          from PIL import Image, ImageOps
          from apps.photos.overlays import apply_brand_overlay

          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT original_key FROM photos_photo WHERE id=9189")
              (key,) = cur.fetchone()
          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          buf = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, buf); buf.seek(0)
          vert = ImageOps.exif_transpose(Image.open(buf)).convert("RGB")
          vert.thumbnail((1600,1600), Image.LANCZOS)
          apply_brand_overlay(vert, "septimo_cep").save(OUT/"PROD_vertical.jpg", quality=90)
          # Version horizontal: se recorta la misma foto a 3:2 apaisado.
          w,h = vert.size
          alto = round(w*2/3)
          horiz = vert.crop((0, (h-alto)//3, w, (h-alto)//3 + alto))
          apply_brand_overlay(horiz, "septimo_cep").save(OUT/"PROD_horizontal.jpg", quality=90)
          print("listo:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "demo: render final vertical y horizontal"
          git push -f origin demo-overlay-tmp
