name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Verificar los limites de busqueda en produccion"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]"

      - name: El web tiene que estar en el commit nuevo
        run: |
          SHA=$(git rev-parse HEAD)
          echo "main esta en $SHA"
          python3 - "$SHA" <<'PYX'
          import os, sys, time, requests
          sha=sys.argv[1]
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceId serviceName latestDeployment{ status meta } } } } } }"""
          def estado():
              d=requests.post(API,headers=H,json={"query":Q,"variables":{
                  "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
              return {n["node"]["serviceName"]:{
                        "id":n["node"]["serviceId"],
                        "status":(n["node"].get("latestDeployment") or {}).get("status") or "SIN DEPLOY",
                        "commit":(((n["node"].get("latestDeployment") or {}).get("meta") or {})
                                  .get("commitHash") or "")[:8]} for n in d["environment"]["serviceInstances"]["edges"]}
          st=estado()
          print("=== SERVICIOS ===")
          for k,v in st.items(): print(f"  {k:<14} {v['status']:<10} commit={v['commit']}")
          if not (st["fotos"]["status"]=="SUCCESS" and st["fotos"]["commit"]==sha[:8]):
              print("\n  el web no esta en el commit nuevo, lo deployo")
              M="""mutation($s:String!,$e:String!,$c:String){
                     serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }"""
              requests.post(API,headers=H,json={"query":M,"variables":{
                  "s":st["fotos"]["id"],"e":os.environ["ENV_ID"],"c":sha}},timeout=60)
              for i in range(45):
                  time.sleep(20)
                  a=estado()["fotos"]
                  print(f"  [{i:02d}] fotos={a['status']}/{a['commit']}")
                  if a["status"]=="SUCCESS" and a["commit"]==sha[:8]:
                      print("  LISTO"); break
                  if a["status"] in ("FAILED","CRASHED"): raise SystemExit("el deploy fallo")
              else: raise SystemExit("se acabo la espera")
          else:
              print("\n  el web ya esta en el commit nuevo")
          PYX

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          url=pg.get("DATABASE_PUBLIC_URL")
          if not url: raise SystemExit("no se pudo leer DATABASE_PUBLIC_URL")
          print(f"::add-mask::{url}")
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"DATABASE_URL={url}\n")
          PYX

      - name: Buscar de verdad, muchas veces seguidas
        run: |
          python3 - <<'PYX'
          import os, re, psycopg, requests
          SITE="https://findyourfoto.com"
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""
                  SELECT e.slug, b.number, count(*)
                  FROM photos_bib b
                  JOIN photos_photo p ON p.id=b.photo_id
                  JOIN events_event e ON e.id=p.event_id
                  WHERE p.status='approved' AND b.rejected=false
                  GROUP BY e.slug, b.number
                  HAVING count(*) BETWEEN 2 AND 40
                  ORDER BY 3 DESC LIMIT 1
              """)
              slug, dorsal, n = cur.fetchone()
          s=requests.Session()
          resumen=[f"evento '{slug}' · dorsal #{dorsal} en {n} fotos"]

          codigos=[]
          for i in range(30):
              r=s.get(f"{SITE}/eventos/{slug}/", params={"bib":dorsal}, timeout=60)
              codigos.append(r.status_code)
              if r.status_code!=200: break
          fotos=len(set(re.findall(r"/foto/(\d+)", r.text)))
          resumen.append(f"MISMO dorsal x{len(codigos)}: codigos={sorted(set(codigos))}"
                         f" · fotos encontradas={fotos}")

          distintos=[]
          for i in range(30):
              r=s.get(f"{SITE}/eventos/{slug}/", params={"bib":str(90000+i)}, timeout=60)
              distintos.append(r.status_code)
              if r.status_code!=200: break
          resumen.append(f"30 dorsales DISTINTOS: codigos={sorted(set(distintos))}")

          for ruta in ("/healthz/lite","/","/eventos/septimo-x-cep-social-run/"):
              r=s.get(SITE+ruta, timeout=60)
              resumen.append(f"{ruta} -> HTTP {r.status_code}")

          print("\n===== RESUMEN =====")
          for linea in resumen: print("  "+linea)
          assert set(codigos)=={200}, "una busqueda repetida fue rechazada"
          print("  OK: repetir la misma busqueda ya no gasta cupo")
          PYX
