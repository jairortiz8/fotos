name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  count:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: count
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          DID=$(gql '{"query":"query($p:String!,$e:String!){ deployments(first:60, input:{projectId:$p, environmentId:$e}){ edges { node { id status createdAt service { name } } } } }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'"}}' | jq -r '[.data.deployments.edges[].node|select(.service.name=="fotos" and .status=="SUCCESS")]|sort_by(.createdAt)|last|.id')
          SINCE=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Ahora(UTC): $(date -u +%FT%TZ) · contando desde: $SINCE (última hora)"
          echo
          measure() { # $1 filtro  $2 substring exacto  $3 etiqueta
            R=$(gql '{"query":"query($d:String!,$f:String,$l:Int){ deploymentLogs(deploymentId:$d, filter:$f, limit:1000){ timestamp message } }","variables":{"d":"'"$DID"'","f":"'"$1"'"}}')
            OK=$(echo "$R" | jq -r 'if .data.deploymentLogs then "y" else "n" end')
            if [ "$OK" != "y" ]; then printf "  %-30s (query falló)\n" "$3:"; return; fi
            TOT=$(echo "$R" | jq '.data.deploymentLogs|length')
            OLDEST=$(echo "$R" | jq -r '[.data.deploymentLogs[].timestamp]|min // "-"')
            N=$(echo "$R" | jq --arg s "$SINCE" --arg p "$2" '[.data.deploymentLogs[]|select(.timestamp>=$s)|select(.message|contains($p))]|length')
            NOTE=""; if [ "$TOT" -ge 1000 ] && [ "$OLDEST" \> "$SINCE" ]; then NOTE=" (⚠ piso: 1000 líneas sólo cubren desde $OLDEST)"; fi
            printf "  %-30s %s%s\n" "$3:" "$N" "$NOTE"
          }
          echo "===== ÚLTIMA HORA ====="
          measure "descargas/foto" "/descargas/foto/" "DESCARGAS"
          measure "buscar-selfie"  "/buscar-selfie/"  "BÚSQUEDAS por SELFIE"
          measure "?bib="          "?bib="            "BÚSQUEDAS por DORSAL"
          echo
          echo "  (dorsal = requests con ?bib=, incluye clicks en chips de dorsal, no sólo el buscador)"
          echo "==================== FIN ===================="
