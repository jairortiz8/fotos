name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "El original que se descarga lleva los logos?"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Medir preview, original y original-con-logos
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          from PIL import Image
          FOTO = 45833
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT status, width, height, preview_key, branded_key, "
                          "original_key, thumbnail_key FROM photos_photo WHERE id=%s", (FOTO,))
              st, W, Hh, prev, brand, orig, thumb = cur.fetchone()
          print(f"foto {FOTO}: estado={st}  tamano guardado={W}x{Hh}")
          print(f"  preview={prev}")
          print(f"  branded={brand or '(VACIO -> el original que se baja NO lleva logos)'}")

          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)

          def bajar(key, nombre):
              if not key: return None
              b = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, b)
              b.seek(0); im = Image.open(b)
              print(f"\n  {nombre}: {im.size[0]}x{im.size[1]}  {len(b.getvalue())//1024} KB")
              return im

          for key, nombre, archivo in ((orig,"original subido","A_original.jpg"),
                                       (brand,"original CON logos","B_original_con_logos.jpg"),
                                       (prev,"preview de la galeria","C_preview.jpg")):
              im = bajar(key, nombre)
              if im is None: continue
              im.convert("RGB").save(OUT/archivo, quality=88)
              w,h = im.size
              rgb = im.convert("RGB")
              ys=[y for y in range(int(h*0.78), h)
                  if any(all(c>200 for c in rgb.getpixel((x,y))) for x in range(0,w,max(1,w//300)))]
              if ys:
                  alto = max(ys)-min(ys)+1
                  print(f"     franja de logos: {round(alto/w*100,2)}% del ancho"
                        f" · pegada al borde de abajo a {round((h-1-max(ys))/w*100,2)}% del ancho")
              else:
                  print("     NO se detectan logos")
          print("\nlisto:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git init -q .
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git checkout -q --orphan demo-overlay-tmp
          git add -f demo_overlay/
          git commit -qm "diag: preview vs original con logos"
          git push -f origin demo-overlay-tmp
