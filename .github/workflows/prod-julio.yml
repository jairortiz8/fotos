name: prod-julio (one-off)

# Arreglo de datos (NO deploy, NO reinicia el web): borra la/s Photo trabada/s
# con original_key='' que rompen el UNIQUE y tiran 500 en TODA subida.

on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3"
      - name: fix
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          PGID=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PGID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          python3 - <<'PY'
          import os, psycopg
          c=psycopg.connect(os.environ["DBURL"], connect_timeout=20); c.autocommit=True; cur=c.cursor()
          print("== filas con original_key='' (las que rompen el UNIQUE) ==")
          cur.execute("""select id, event_id, photographer_link_id, status, original_filename,
                         created_at, updated_at
                         from photos_photo where original_key='' order by created_at""")
          rows=cur.fetchall()
          for r in rows: print("  ", r)
          print(f"  total: {len(rows)}")
          # Sólo borramos las trabadas (uploading/processing) con key vacía y viejas (>2 min).
          cur.execute("""delete from photos_photo
                         where original_key=''
                           and status in ('uploading','processing')
                           and created_at < now()-interval '2 minutes'
                         returning id, status, original_filename""")
          deleted=cur.fetchall()
          print("== BORRADAS ==")
          for d in deleted: print("  ", d)
          print(f"  total borradas: {len(deleted)}")
          # Verificación: ¿queda alguna '' ocupando el slot?
          cur.execute("select count(*) from photos_photo where original_key=''")
          print("  quedan con original_key='':", cur.fetchone()[0])
          PY
          echo "==================== FIN ===================="
