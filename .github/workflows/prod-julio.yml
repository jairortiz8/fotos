name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Capturar la UI de findyourfoto"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet playwright Pillow requests "psycopg[binary]"
          python -m playwright install --with-deps chromium

      - name: Capturar
        run: |
          python3 - <<'PYX'
          import os, requests
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from PIL import Image
          import psycopg

          SITE="https://findyourfoto.com"; SLUG="septimo-x-cep-social-run"
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""SELECT b.number FROM photos_bib b JOIN photos_photo p ON p.id=b.photo_id
                             JOIN events_event e ON e.id=p.event_id
                             WHERE e.slug=%s AND p.status='approved' AND b.rejected=false
                             GROUP BY b.number ORDER BY count(*) DESC LIMIT 1""",(SLUG,))
              f=cur.fetchone(); dorsal = f[0] if f else "1"
              cur.execute("""SELECT p.id FROM photos_photo p JOIN events_event e ON e.id=p.event_id
                             WHERE e.slug=%s AND p.status='approved' AND p.preview_key<>''
                             ORDER BY p.id LIMIT 1""",(SLUG,))
              foto=cur.fetchone()[0]
          print(f"dorsal de prueba: {dorsal} · foto: {foto}")

          RUTAS = {
            "01_home": "/",
            "02_galeria": f"/eventos/{SLUG}/",
            "03_dorsal": f"/eventos/{SLUG}/?bib={dorsal}",
            "04_selfie": f"/eventos/{SLUG}/buscar-selfie/",
            "05_lightbox": f"/eventos/{SLUG}/foto/{foto}/",
            "06_fotografos": f"/eventos/{SLUG}/?vista=fotografos",
            "07_login_admin": "/dashboard/login/",
            "08_invitados": "/invitados/entrar/",
            "09_faq": "/preguntas/",
          }
          OUT=Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          with sync_playwright() as pw:
              nav = pw.chromium.launch(args=["--no-sandbox"])
              for nombre, ruta in RUTAS.items():
                  for etq, vp in (("desk",{"width":1440,"height":900}),
                                  ("mob",{"width":390,"height":844})):
                      pg2 = nav.new_page(viewport=vp)
                      try:
                          pg2.goto(SITE+ruta, wait_until="networkidle", timeout=60000)
                      except Exception as e:
                          print(f"  {nombre} {etq}: {e}"); pg2.close(); continue
                      pg2.wait_for_timeout(2200)
                      pg2.mouse.wheel(0, 4000); pg2.wait_for_timeout(1500)
                      pg2.mouse.wheel(0, -8000); pg2.wait_for_timeout(800)
                      tmp = OUT/f"{nombre}_{etq}.png"
                      pg2.screenshot(path=str(tmp), full_page=True)
                      im = Image.open(tmp)
                      if im.height > 4200:
                          im = im.crop((0,0,im.width,4200))
                      im.convert("RGB").save(OUT/f"{nombre}_{etq}.jpg", quality=76)
                      tmp.unlink()
                      print(f"  {nombre} {etq}: {im.width}x{im.height}")
                      pg2.close()
              nav.close()
          print("listo:", len(list(OUT.iterdir())), "archivos")
          PYX

      - name: Devolver por rama
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan scan-ui
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "scan: UI de findyourfoto"
          git push -f origin scan-ui
