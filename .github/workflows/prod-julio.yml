name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  rep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" requests
      - name: reporte
        run: |
          python3 - <<'PY'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":os.environ["PG_ID"]}
          dburl=(requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40).json().get("data",{}).get("variables") or {}).get("DATABASE_PUBLIC_URL")
          import psycopg
          c=psycopg.connect(dburl,connect_timeout=25);cur=c.cursor()
          cur.execute("select id from events_event where slug='surf-city-2026'"); eid=cur.fetchone()[0]
          def one(s):cur.execute(s,(eid,));return cur.fetchone()[0]
          print("subidas_aprobadas", one("select count(*) from photos_photo where event_id=%s and status='approved'"))
          print("subidas_total", one("select count(*) from photos_photo where event_id=%s and status<>'deleted'"))
          print("fotografos", one("select count(distinct photographer_link_id) from photos_photo where event_id=%s and status='approved'"))
          print("fotos_con_dorsal", one("select count(distinct p.id) from photos_photo p join photos_bib b on b.photo_id=p.id where p.event_id=%s and p.status='approved' and b.rejected=false"))
          print("dorsales_unicos", one("select count(distinct b.number) from photos_photo p join photos_bib b on b.photo_id=p.id where p.event_id=%s and p.status='approved' and b.rejected=false and b.number ~ '^[0-9]{1,5}$'"))
          print("caras_indexadas", one("select count(*) from photos_faceembedding f join photos_photo p on p.id=f.photo_id where p.event_id=%s"))
          print("fotos_con_cara", one("select count(*) from photos_photo where event_id=%s and status='approved' and has_faces_detected"))
          cur.execute("select search_count, download_count from events_event where id=%s",(eid,)); sc,dc=cur.fetchone()
          print("busquedas_total", sc)
          # selfie searches ~= timestamps distintos de last_matched_at en los embeddings del evento
          print("selfie_busquedas_aprox", one("select count(distinct f.last_matched_at) from photos_faceembedding f join photos_photo p on p.id=f.photo_id where p.event_id=%s and f.last_matched_at is not null"))
          print("descargas", one("select coalesce(sum(download_count),0) from photos_photo where event_id=%s"))
          print("fotos_distintas_descargadas", one("select count(*) from photos_photo where event_id=%s and download_count>0"))
          print("vistas", one("select coalesce(sum(view_count),0) from photos_photo where event_id=%s"))
          print("FIN")
          PY
