name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  apagar:
    name: Mantener los workers apagados tras el push a main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests

      - name: Vigilar y volver a apagar lo que reviva
        run: |
          python3 - <<'PYX'
          import os, time, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          def gql(q, v=None):
              return requests.post(API,headers=H,
                  json={"query":q,"variables":v or {}},timeout=60).json()

          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status } } } } } }"""
          RM="""mutation($id:String!){ deploymentRemove(id:$id) }"""
          APAGAR={"worker","worker_fast","worker-fast","beat"}
          # Un push a main redeploya los 3 servicios (todos trackean esa rama).
          # El build tarda varios minutos, asi que hay que vigilar un rato y
          # bajar cada deployment nuevo apenas queda vivo.
          VIVOS={"SUCCESS","DEPLOYING","BUILDING","INITIALIZING","WAITING","QUEUED"}
          for vuelta in range(16):
              d=gql(Q,{"e":os.environ["ENV_ID"]})["data"]
              linea=[]; pendiente=False
              for e in d["environment"]["serviceInstances"]["edges"]:
                  n=e["node"]; dep=n.get("latestDeployment") or {}
                  st=dep.get("status") or "SIN DEPLOY"
                  linea.append(f"{n['serviceName']}={st}")
                  if n["serviceName"] in APAGAR and st in VIVOS and dep.get("id"):
                      pendiente=True
                      r=gql(RM,{"id":dep["id"]})
                      ok = r.get("data",{}).get("deploymentRemove")
                      linea[-1]+=(" -> quitado" if ok else f" -> NO se pudo ({st})")
              print(f"[{vuelta:02d}] " + " · ".join(linea), flush=True)
              if not pendiente and vuelta >= 8:
                  print("\n  Estable: nada revivio en las ultimas vueltas.")
                  break
              time.sleep(60)
          PYX

      - name: Estado final
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== ESTADO FINAL ===")
          apagados=arriba=pendientes=0
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; st=(n.get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
              debe = n["serviceName"] in ("worker","worker_fast","worker-fast","beat")
              ok = (st != "SUCCESS") if debe else (st == "SUCCESS")
              print(f"  {'OK ' if ok else '!! '} {n['serviceName']:<14} {st}")
              if debe and st != "SUCCESS": apagados+=1
              elif debe: pendientes+=1
              elif st == "SUCCESS": arriba+=1
          print(f"\n  workers apagados: {apagados}  ·  siguen vivos: {pendientes}"
                f"  ·  servicios que deben seguir arriba: {arriba}")

          # El sitio publico tiene que seguir respondiendo.
          try:
              r=requests.get("https://findyourfoto.com/healthz/lite",timeout=30)
              print(f"\n  healthz/lite: {r.status_code}")
          except Exception as exc:
              print(f"\n  healthz/lite: no se pudo consultar ({exc})")
          PYX
