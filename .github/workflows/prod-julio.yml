name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3" redis
      - name: diag
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          PGID=$(gql '{"query":"query($p:String!){ project(id:$p){ services{ edges{ node{ id name } } } } }","variables":{"p":"'"$PROJECT_ID"'"}}' | jq -r '.data.project.services.edges[].node|select(.name=="Postgres")|.id')
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PGID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          export REDISURL=$(vars_of "$WEB_ID" | jq -r '.REDIS_PUBLIC_URL // .REDIS_URL // empty')
          python3 - <<'PY'
          import os, psycopg
          c=psycopg.connect(os.environ["DBURL"], connect_timeout=20); cur=c.cursor()
          print("===== TOTAL por estado (todas las fotos) =====")
          cur.execute("select status,count(*) from photos_photo group by status order by 2 desc")
          for s,n in cur.fetchall(): print(f"   {s:20} {n}")
          print("\n===== Ani / Marti Tolentino por estado =====")
          cur.execute("""select l.photographer_name, p.status, count(*)
                         from photos_photo p join photographers_photographerlink l on l.id=p.photographer_link_id
                         where l.photographer_name ilike %s
                         group by 1,2 order by 1,3 desc""",("%tolentino%",))
          for name,st,n in cur.fetchall(): print(f"   {name:18} {st:18} {n}")
          print("\n===== 'colgadas' = processing/uploading con updated_at viejo =====")
          for mins in (5,15,60):
              cur.execute("select count(*) from photos_photo where status in ('processing','uploading') and updated_at < now()-(%s||' minutes')::interval",(mins,))
              print(f"   > {mins} min sin cambio: {cur.fetchone()[0]}")
          cur.execute("select min(updated_at), max(updated_at) from photos_photo where status in ('processing','uploading')")
          print("   rango updated_at de las processing/uploading:", cur.fetchone())

          import redis
          ru=os.environ.get("REDISURL","")
          if ru:
              try:
                  r=redis.from_url(ru, socket_connect_timeout=10)
                  print("\n===== COLA de Celery en Redis (mensajes pendientes) =====")
                  for q in ("fast","faces","celery"):
                      print(f"   queue '{q}': LLEN={r.llen(q)}")
              except Exception as e:
                  print("   (no pude leer Redis:", repr(e)[:120], ")")
          else:
              print("   (sin REDIS url)")
          PY
          echo "==================== FIN ===================="
