name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
jobs:
  urgente:
    name: URGENTE - por que no procesa el worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      WORKER_ID: 1846c52a-57c3-4a8b-b4ec-1cc200a8e652
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solo el driver de Postgres + requests. NO se instala el arbol de deps
      # del proyecto (paddle/torch/insightface): tardaba mas de 20 min y este
      # trabajo solo necesita un UPDATE de una columna.
      - run: pip install --quiet "psycopg[binary]" requests boto3

      - name: Credenciales de prod
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: 1 - El web y el worker apuntan al MISMO broker?
        run: |
          pip install --quiet redis
          python3 - <<'PYX'
          import os, requests
          from urllib.parse import urlparse
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              return (requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
                      .json().get("data",{}) or {}).get("variables") or {}
          web=vf(os.environ["WEB_ID"]); wk=vf(os.environ["WORKER_ID"])

          def describir(u):
              # No se imprime la URL (trae password). Solo host y numero de base.
              if not u: return "(sin setear)"
              try:
                  p=urlparse(u); base=(p.path or "/").lstrip("/") or "0"
                  return f"host={p.hostname} puerto={p.port} base={base}"
              except Exception: return "(no se pudo leer)"

          print("=== A QUE REDIS LE HABLA CADA UNO ===")
          for etiqueta, d in (("web", web), ("worker", wk)):
              for k in ("CELERY_BROKER_URL","CELERY_RESULT_BACKEND","REDIS_URL"):
                  print(f"  {etiqueta:<7}.{k:<22} {describir(d.get(k))}")
          iguales = web.get("CELERY_BROKER_URL") == wk.get("CELERY_BROKER_URL")
          print(f"\n  MISMO BROKER: {'SI' if iguales else 'NO -- ACA ESTA EL PROBLEMA'}")
          print(f"  worker.PROCESS_TYPE = {wk.get('PROCESS_TYPE','(sin setear)')}")

          # Ahora sí: mirar las colas en TODAS las bases, no solo la 0.
          rid=None
          q1='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId serviceName } } } } }'
          d=requests.post(API,headers=H,json={"query":q1,"variables":{"e":os.environ["ENV_ID"]}},timeout=40).json()
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              if e["node"]["serviceName"].lower().startswith("redis"): rid=e["node"]["serviceId"]
          pub=vf(rid).get("REDIS_PUBLIC_URL") if rid else None
          if not pub:
              print("\n  sin REDIS_PUBLIC_URL, no puedo mirar las colas"); raise SystemExit(0)
          print(f"::add-mask::{pub}")
          import redis
          print("\n=== COLAS POR BASE DE REDIS ===")
          base_ok = urlparse(web.get("CELERY_BROKER_URL") or "").path.lstrip("/") or "0"
          for n in range(0, 4):
              try:
                  r = redis.from_url(pub, db=n, socket_timeout=10, socket_connect_timeout=10)
                  llen = r.llen("celery")
                  marca = "  <-- la que usa el web" if str(n) == base_ok else ""
                  print(f"  base {n}: cola 'celery' = {llen} tareas   (claves: {r.dbsize()}){marca}")
              except Exception as exc:
                  print(f"  base {n}: {exc}")
          PYX

      - name: 2 - Logs recientes del worker
        if: always()
        run: |
          python3 - <<'PYX'
          import os, json, urllib.request
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          def gql(q,v=None):
              body=json.dumps({"query":q,"variables":v or {}}).encode()
              req=urllib.request.Request(API,data=body,headers={
                  "Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
                  "Content-Type":"application/json","User-Agent":"curl/8.0"})
              return json.load(urllib.request.urlopen(req,timeout=60))
          q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ id status } } } } } }"""
          d=gql(q,{"e":os.environ["ENV_ID"]})
          dep=None
          for e in d["data"]["environment"]["serviceInstances"]["edges"]:
              if e["node"]["serviceName"]=="worker":
                  dep=(e["node"].get("latestDeployment") or {}).get("id")
          if not dep: raise SystemExit(0)
          ql="""query($d:String!,$n:Int!){ deploymentLogs(deploymentId:$d, limit:$n){ timestamp message } }"""
          logs=gql(ql,{"d":dep,"n":600})["data"]["deploymentLogs"]
          print(f"=== {len(logs)} LINEAS; ULTIMAS 60 ===")
          for l in logs[-60:]:
              print(f"  {(l.get('timestamp') or '')[:19]} {(l.get('message') or '')[:180]}")
          # Cuantas veces arranco: si se reinicia en loop, es OOM.
          arranques=[l for l in logs if "celery@" in (l.get("message") or "")
                     or "ready" in (l.get("message") or "").lower()]
          print(f"\n  lineas de arranque/ready detectadas: {len(arranques)}")
          for l in arranques[-8:]:
              print(f"    {(l.get('timestamp') or '')[:19]} {(l.get('message') or '')[:140]}")
          PYX
