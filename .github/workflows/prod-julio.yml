name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  demo:
    name: "Overlay - 2 principales sobre los 3 patrocinadores"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Renderizar
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          D = Path("apps/photos/brand_overlays")

          # Los 5 van ABAJO: los principales en una fila ENCIMA de los patrocinadores.
          FILA_1 = [("SR2026_whiteP.png", 1.00), ("cep blanco.png", 0.80)]   # principales
          FILA_2 = [("GU_Secondary_White_Transparent.png",1.00),
                    ("LOGO TASU-01.png",1.05),
                    ("NUGO LOGO WHITE.webp",0.82)]                           # patrocinadores

          H_FILA1, H_FILA2 = 0.058, 0.034      # alto de logo / alto de foto
          SEPARACION = 0.030                   # aire entre las dos filas
          MARGEN_X   = 0.12                    # margen lateral (recorte de IG)
          SEGURO_BOT = 0.042                   # libre debajo de todo

          def cargar(n):
              im = Image.open(D/n).convert("RGBA")
              return im.crop(im.split()[3].getbbox())

          def piezas(lista, h, alto_pct):
              alto = round(h*alto_pct); out=[]
              for n,f in lista:
                  lg = cargar(n); a = max(1, round(alto*f))
                  out.append(lg.resize((max(1,round(a*lg.width/lg.height)), a), Image.LANCZOS))
              return out

          def scrim(size, banda_pct, arriba=False, max_alpha=225, curva=1.2):
              w,h = size; banda = max(1, round(h*banda_pct))
              g = Image.new("L",(1,banda))
              for y in range(banda):
                  t = y/(banda-1) if banda>1 else 1.0
                  if arriba: t = 1-t                      # oscuro arriba, se aclara al bajar
                  g.putpixel((0,y), round(max_alpha*(t**curva)))
              g = g.resize((w,banda))
              capa = Image.new("RGBA",(w,h),(0,0,0,0))
              negro = Image.new("RGBA",(w,banda),(0,0,0,255)); negro.putalpha(g)
              capa.paste(negro,(0, 0 if arriba else h-banda))
              return capa

          def aplicar(img, reparto):
              base = img.convert("RGBA"); w,h = base.size
              bloque = SEGURO_BOT + H_FILA2 + SEPARACION + H_FILA1
              base.alpha_composite(scrim((w,h), bloque + 0.10))
              m = round(w*MARGEN_X)

              # Fila de abajo: los 3 patrocinadores (izq / centro / der)
              p2 = piezas(FILA_2, h, H_FILA2)
              y2 = h - round(h*SEGURO_BOT)
              xs2 = [m, (w-p2[1].width)//2, w-p2[2].width-m]
              for lg,x in zip(p2,xs2):
                  base.alpha_composite(lg, (x, y2-lg.height))

              # Fila de arriba: los 2 principales, justo encima de los anteriores
              p1 = piezas(FILA_1, h, H_FILA1)
              y1 = y2 - max(p.height for p in p2) - round(h*SEPARACION)
              if reparto == "extremos":
                  xs1 = [m, w - p1[1].width - m]
              else:
                  sep = round(w*0.055)
                  tot = sum(p.width for p in p1) + sep
                  x = (w-tot)//2; xs1 = [x, x+p1[0].width+sep]
              for lg,x in zip(p1,xs1):
                  base.alpha_composite(lg, (x, y1-lg.height))
              return base.convert("RGB")

          def marcar(img):
              out = img.convert("RGBA"); w,h = out.size
              capa = Image.new("RGBA",(w,h),(0,0,0,0)); d = ImageDraw.Draw(capa)
              vis = (h*9/16)/w
              if vis < 1:
                  c = round(w*(1-vis)/2)
                  d.rectangle([0,0,c,h], fill=(220,40,40,90))
                  d.rectangle([w-c,0,w,h], fill=(220,40,40,90))
              d.text((round(w*0.03), round(h*0.03)), "rojo = lo que recorta IG",
                     fill=(255,255,255,255))
              out.alpha_composite(capa); return out.convert("RGB")

          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT id, original_key FROM photos_photo WHERE id=9189")
              pid, key = cur.fetchone()
          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          buf = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, buf); buf.seek(0)
          im = ImageOps.exif_transpose(Image.open(buf)).convert("RGB")
          im.thumbnail((1600,1600), Image.LANCZOS)

          for etq, rep in (("A_principales_a_los_lados","extremos"),
                           ("B_principales_al_centro","juntos")):
              r = aplicar(im, rep)
              r.save(OUT/f"{etq}_limpio.jpg", quality=90)
              marcar(r).save(OUT/f"{etq}_zonas_IG.jpg", quality=90)
              print(f"  {etq} ok")
          print("listo:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "demo: 5 logos abajo en dos filas"
          git push -f origin demo-overlay-tmp
