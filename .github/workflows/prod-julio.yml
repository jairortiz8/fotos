name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Numeros por evento para dimensionar el VPS"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]"

      - name: Volumen por evento
        run: |
          python3 - <<'PYX'
          import os, requests, psycopg
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          pg=(requests.post(API,headers=H,json={"query":V,"variables":{
              "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],
              "s":os.environ["PG_ID"]}},timeout=40).json().get("data") or {}).get("variables") or {}
          with psycopg.connect(pg["DATABASE_PUBLIC_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""
                SELECT e.slug, count(p.id) fotos,
                       count(f.id) caras,
                       min(p.created_at)::date, 
                       round(extract(epoch from max(p.created_at)-min(p.created_at))/60) min_subida
                FROM events_event e
                LEFT JOIN photos_photo p ON p.event_id=e.id
                LEFT JOIN photos_faceembedding f ON f.photo_id=p.id
                GROUP BY e.slug ORDER BY 2 DESC
              """)
              print("EVENTO                                FOTOS   CARAS   FECHA        MIN_SUBIDA")
              for slug,n,c,fecha,mins in cur.fetchall():
                  print(f"{slug[:36]:<36} {n:>6}  {c:>6}   {fecha}   {mins}")
              cur.execute("SELECT count(*) FROM photos_photo")
              (tot,)=cur.fetchone()
              cur.execute("SELECT count(*) FROM photos_faceembedding")
              (tc,)=cur.fetchone()
              cur.execute("SELECT pg_size_pretty(pg_database_size(current_database()))")
              (tam,)=cur.fetchone()
              cur.execute("""SELECT pg_size_pretty(pg_total_relation_size('photos_faceembedding')),
                                    pg_size_pretty(pg_total_relation_size('photos_photo'))""")
              t_emb, t_fotos = cur.fetchone()
              # Pico historico de subida en 5 minutos, en todo el sistema
              cur.execute("""SELECT max(cant) FROM (
                    SELECT count(*) cant FROM photos_photo
                    GROUP BY event_id, date_trunc('minute', created_at)
                      - (extract(minute from created_at)::int %% 5) * interval '1 minute') q""")
              (pico,)=cur.fetchone()
          print(f"\nTOTAL: {tot} fotos · {tc} caras")
          print(f"Base de datos: {tam}  (tabla de caras {t_emb} · tabla de fotos {t_fotos})")
          print(f"Pico historico de subida: {pico} fotos en 5 min = {round(pico/5,1)}/min")
          PYX
