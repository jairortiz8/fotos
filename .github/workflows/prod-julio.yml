name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Por que la foto nueva salio sin logos"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Cuando se desplego cada servicio
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status createdAt meta } } } } } }"""
          d=requests.post(API,headers=H,json={"query":Q,"variables":{
              "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
          print("=== DEPLOYS ===")
          for e in d["environment"]["serviceInstances"]["edges"]:
              n=e["node"]; dep=n.get("latestDeployment") or {}
              meta=dep.get("meta") or {}
              sha=(meta.get("commitHash") or "")[:8]
              print(f"  {n['serviceName']:<14} {dep.get('status','SIN DEPLOY'):<10}"
                    f" {dep.get('createdAt','')}  commit={sha}")
          PYX

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Las ultimas fotos subidas
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("""
                  SELECT p.id, e.slug, e.brand_overlay, p.status, p.created_at,
                         p.preview_key, p.branded_key, p.original_key
                  FROM photos_photo p JOIN events_event e ON e.id = p.event_id
                  ORDER BY p.id DESC LIMIT 8
              """)
              filas = cur.fetchall()
          print("=== ULTIMAS 8 FOTOS ===")
          for r in filas:
              print(f"  id={r[0]:<6} evento={r[1][:26]:<26} overlay={r[2]!r:<15}"
                    f" estado={r[3]:<18} subida={r[4]:%Y-%m-%d %H:%M:%S}")
              print(f"          preview={r[5] or '(vacio)'}")
              print(f"          branded={r[6] or '(vacio)'}")

          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          # Se baja el preview de la mas reciente que lo tenga, para verlo.
          for r in filas:
              if not r[5]: continue
              buf = io.BytesIO()
              r2.download_fileobj(os.environ["R2_BUCKET_NAME"], r[5], buf)
              (OUT/f"ULTIMA_{r[0]}_preview.webp").write_bytes(buf.getvalue())
              print(f"\n  bajado el preview de la foto {r[0]} ({len(buf.getvalue())//1024} KB)")
              if r[6]:
                  b = io.BytesIO()
                  r2.download_fileobj(os.environ["R2_BUCKET_NAME"], r[6], b)
                  (OUT/f"ULTIMA_{r[0]}_branded.jpg").write_bytes(b.getvalue())
                  print(f"  bajado el original con logos ({len(b.getvalue())//1024} KB)")
              break
          print("\nlisto:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "diag: preview de la ultima foto subida"
          git push -f origin demo-overlay-tmp
