name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  swap:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
    steps:
      - name: deps
        run: python3 -m pip install --quiet "psycopg[binary]==3.2.3"
      - name: swap
        shell: bash +e {0}
        run: |
          set +e
          gql() { curl -sS "$API" -H "Authorization: Bearer ${RAILWAY_TOKEN}" -H "Project-Access-Token: ${RAILWAY_TOKEN}" -H "Content-Type: application/json" --data "$1"; }
          vars_of() { gql '{"query":"query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }","variables":{"p":"'"$PROJECT_ID"'","e":"'"$ENV_ID"'","s":"'"$1"'"}}' | jq '.data.variables // {}'; }
          export DBURL=$(vars_of "$PG_ID" | jq -r '.DATABASE_PUBLIC_URL // empty')
          python3 - <<'PY'
          import os, psycopg
          c=psycopg.connect(os.environ["DBURL"],connect_timeout=20);c.autocommit=False;cur=c.cursor()
          def find(pat):
              cur.execute("""select l.id,l.photographer_name,
                             (select count(*) from photos_photo p where p.photographer_link_id=l.id and p.status<>'deleted')
                             from photographers_photographerlink l join events_event e on e.id=l.event_id
                             where e.slug='surf-city-2026' and l.photographer_name ilike %s""",(pat,))
              return cur.fetchall()
          A=find('%gasolinera%'); B=find('%subida%by%pass%') or find('%subida%')
          print("A (gasolinera):", A)
          print("B (subida):", B)
          if len(A)!=1 or len(B)!=1 or A[0][0]==B[0][0]:
              print("!! no puedo identificar exactamente 2 links distintos — ABORTO, no cambio nada"); c.rollback(); raise SystemExit(0)
          ida,na,_=A[0]; idb,nb,_=B[0]
          print(f"\nANTES:\n   link {ida}: {na}\n   link {idb}: {nb}")
          cur.execute("update photographers_photographerlink set name_tmp=%s where false",()) if False else None
          # swap atómico
          cur.execute("update photographers_photographerlink set photographer_name=%s where id=%s",(nb,ida))
          cur.execute("update photographers_photographerlink set photographer_name=%s where id=%s",(na,idb))
          c.commit()
          cur.execute("select id,photographer_name from photographers_photographerlink where id in (%s,%s) order by id",(ida,idb))
          print("\nDESPUÉS:")
          for i,n in cur.fetchall(): print(f"   link {i}: {n}")
          PY
          echo FIN
