name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  demo:
    name: Altura segura para Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests "psycopg[binary]" boto3 Pillow

      - name: Credenciales
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          V='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              return (requests.post(API,headers=H,json={"query":V,"variables":{
                  "p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}},
                  timeout=40).json().get("data") or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL":pg.get("DATABASE_PUBLIC_URL"),
               "R2_ENDPOINT_URL":web.get("R2_ENDPOINT_URL"),
               "R2_ACCESS_KEY_ID":web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY":web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME":web.get("R2_BUCKET_NAME")}
          if [k for k,v in out.items() if not v]: raise SystemExit("faltan credenciales")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          PYX

      - name: Renderizar alturas
        run: |
          python3 - <<'PYX'
          import io, os, boto3, psycopg
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          OUT = Path("demo_overlay"); OUT.mkdir(exist_ok=True)
          D = Path("apps/photos/brand_overlays")
          LOGOS = [("GU_Secondary_White_Transparent.png",1.00),
                   ("LOGO TASU-01.png",1.05),
                   ("NUGO LOGO WHITE.webp",0.82)]
          LOGO_H = 0.058          # tamano "chico" que elegimos

          # `seguro` = cuanto se deja libre ABAJO (fraccion del alto).
          # Instagram tapa esa franja con su interfaz.
          ALTURAS = [("A_actual_8pct", 0.085), ("B_14pct", 0.14),
                     ("C_18pct", 0.18), ("D_22pct", 0.22)]
          IG_TAPA = 0.13          # zona que tapa IG, estimada de la captura de Jair

          def cargar(n):
              im = Image.open(D/n).convert("RGBA")
              return im.crop(im.split()[3].getbbox())

          def scrim(size, band_pct, max_alpha=238, curva=1.15):
              w,h = size; banda = max(1, round(h*band_pct))
              g = Image.new("L",(1,banda))
              for y in range(banda):
                  t = y/(banda-1) if banda>1 else 1.0
                  g.putpixel((0,y), round(max_alpha*(t**curva)))
              g = g.resize((w,banda))
              capa = Image.new("RGBA",(w,h),(0,0,0,0))
              negro = Image.new("RGBA",(w,banda),(0,0,0,255)); negro.putalpha(g)
              capa.paste(negro,(0,h-banda)); return capa

          def aplicar(img, seguro, logo_h_pct=LOGO_H, margen_pct=0.045):
              base = img.convert("RGBA"); w,h = base.size
              # La banda arranca bien arriba de los logos y llega hasta el borde:
              # asi el degradado sigue anclado abajo aunque los logos suban.
              banda = seguro + logo_h_pct + 0.075
              base.alpha_composite(scrim((w,h), banda))
              alto = round(h*logo_h_pct); piezas=[]
              for n,f in LOGOS:
                  lg = cargar(n); a = max(1, round(alto*f))
                  piezas.append(lg.resize((max(1,round(a*lg.width/lg.height)), a), Image.LANCZOS))
              m = round(w*margen_pct)
              base_y = h - round(h*seguro)            # los logos APOYAN sobre la linea segura
              xs = [m, (w-piezas[1].width)//2, w-piezas[2].width-m]
              for lg,x in zip(piezas,xs):
                  base.alpha_composite(lg,(x, base_y-lg.height))
              return base.convert("RGB")

          def marcar_ig(img):
              """Pinta encima la franja que tapa Instagram, para verificar."""
              out = img.convert("RGBA"); w,h = out.size
              capa = Image.new("RGBA",(w,h),(0,0,0,0)); d = ImageDraw.Draw(capa)
              y = h - round(h*IG_TAPA)
              d.rectangle([0,y,w,h], fill=(220,40,40,90))
              d.line([(0,y),(w,y)], fill=(255,60,60,255), width=max(2,round(h*0.003)))
              d.text((round(w*0.03), y+round(h*0.012)),
                     "ZONA QUE TAPA INSTAGRAM", fill=(255,255,255,255))
              out.alpha_composite(capa)
              return out.convert("RGB")

          with psycopg.connect(os.environ["DATABASE_URL"]) as cx, cx.cursor() as cur:
              cur.execute("SELECT id, original_key FROM photos_photo WHERE id=9189")
              pid, key = cur.fetchone()

          r2 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT_URL"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          buf = io.BytesIO(); r2.download_fileobj(os.environ["R2_BUCKET_NAME"], key, buf)
          buf.seek(0)
          im = ImageOps.exif_transpose(Image.open(buf)).convert("RGB")
          im.thumbnail((1600,1600), Image.LANCZOS)

          recortes = []
          for etq, seguro in ALTURAS:
              render = aplicar(im, seguro)
              render.save(OUT/f"{etq}_limpio.jpg", quality=90)
              marcado = marcar_ig(render)
              marcado.save(OUT/f"{etq}_con_zona_IG.jpg", quality=90)
              recortes.append((etq, marcado.crop((0, round(im.height*0.68), im.width, im.height))))

          fw, fh = recortes[0][1].size
          LBL, GAP = 40, 10
          hoja = Image.new("RGB", (fw+GAP*2, (fh+LBL)*len(recortes)+GAP), (24,24,26))
          d = ImageDraw.Draw(hoja); y = GAP
          for etq, r in recortes:
              d.text((GAP+4, y+12), etq.replace("_"," ").upper(), fill=(250,250,250))
              y += LBL; hoja.paste(r,(GAP,y)); y += fh
          hoja.save(OUT/"COMPARACION_alturas.jpg", quality=88)
          print("listo:", sorted(p.name for p in OUT.iterdir()))
          PYX

      - name: Devolver por rama
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-overlay-tmp
          git rm -rq --cached . || true
          git add -f demo_overlay/
          git commit -qm "demo: alturas seguras para Instagram"
          git push -f origin demo-overlay-tmp
