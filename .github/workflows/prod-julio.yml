name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  webstatus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - name: deps
        run: python3 -m pip install --quiet requests
      - name: web status
        run: |
          python3 - <<'PY'
          import os, time, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]; ENV=os.environ["ENV_ID"]; WEB=os.environ["WEB_ID"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{ serviceId latestDeployment{ status } } } } } }'
          for i in range(20):
              d=requests.post(API,headers=H,json={"query":q,"variables":{"e":ENV}},timeout=40).json()
              st=None
              for e in d.get("data",{}).get("environment",{}).get("serviceInstances",{}).get("edges",[]):
                  if e["node"]["serviceId"]==WEB: st=(e["node"].get("latestDeployment") or {}).get("status")
              print("web", i, st, flush=True)
              if st in ("SUCCESS","FAILED","CRASHED"): break
              time.sleep(15)
          print("FIN")
          PY
