name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
concurrency:
  group: prod-julio
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ops:
    name: "Confirmar el estado final"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Estado final
        run: |
          python3 - <<'PYX'
          import os, time, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,
             "Content-Type":"application/json"}
          Q="""query($e:String!){ environment(id:$e){ serviceInstances{ edges{ node{
                serviceName latestDeployment{ status } } } } } }"""
          for i in range(20):
              d=requests.post(API,headers=H,json={"query":Q,"variables":{
                  "e":os.environ["ENV_ID"]}},timeout=60).json()["data"]
              st={n["node"]["serviceName"]:
                  (n["node"].get("latestDeployment") or {}).get("status") or "SIN DEPLOY"
                  for n in d["environment"]["serviceInstances"]["edges"]}
              if st.get("fotos") not in ("BUILDING","DEPLOYING","INITIALIZING","QUEUED"):
                  break
              print(f"  [{i:02d}] el web sigue desplegando ({st.get('fotos')})...")
              time.sleep(20)
          print("\n=== ESTADO FINAL ===")
          for k,v in st.items(): print(f"   {k:<13} {v}")
          print()
          for ruta in ("/healthz","/","/eventos/septimo-x-cep-social-run/"):
              r=requests.get("https://findyourfoto.com"+ruta, timeout=60)
              print(f"   {ruta:<40} HTTP {r.status_code}")
          PYX
