name: prod-julio (one-off)
on:
  workflow_dispatch:
  push:
    branches: ["run-julio"]
jobs:
  faces:
    name: migrar + medir tamanos de cara (surf-city)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API: https://backboard.railway.app/graphql/v2
      PROJECT_ID: 13f846c9-6400-44dc-995f-02a7da9c45b4
      ENV_ID: b48c37f0-dab0-4627-b95c-a20db2862579
      PG_ID: 17602daf-d2a8-4b4e-99b9-738d2583e624
      WEB_ID: 5dec515d-7408-46ae-91ac-d2325d6d92ad
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SITE_NAME: "find your foto"
      SITE_DOMAIN: findyourfoto.com
      NOTIFIER_BACKEND: whatsapp_manual
      LANGUAGE_CODE: es
      TIME_ZONE: America/El_Salvador
      FACE_SEARCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libgomp1 libxcb1 libsm6 libxext6 libxrender1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch prod credentials
        run: |
          python3 - <<'PYX'
          import os, requests
          API=os.environ["API"]; TOK=os.environ["RAILWAY_TOKEN"]
          H={"Authorization":f"Bearer {TOK}","Project-Access-Token":TOK,"Content-Type":"application/json"}
          q='query($p:String!,$e:String!,$s:String!){ variables(projectId:$p,environmentId:$e,serviceId:$s) }'
          def vf(sid):
              v={"p":os.environ["PROJECT_ID"],"e":os.environ["ENV_ID"],"s":sid}
              r=requests.post(API,headers=H,json={"query":q,"variables":v},timeout=40)
              return (r.json().get("data",{}) or {}).get("variables") or {}
          pg=vf(os.environ["PG_ID"]); web=vf(os.environ["WEB_ID"])
          out={"DATABASE_URL": pg.get("DATABASE_PUBLIC_URL"),
               "R2_ACCESS_KEY_ID": web.get("R2_ACCESS_KEY_ID"),
               "R2_SECRET_ACCESS_KEY": web.get("R2_SECRET_ACCESS_KEY"),
               "R2_BUCKET_NAME": web.get("R2_BUCKET_NAME"),
               "R2_ENDPOINT_URL": web.get("R2_ENDPOINT_URL")}
          missing=[k for k,v in out.items() if not v]
          if missing: raise SystemExit(f"faltan: {missing}")
          with open(os.environ["GITHUB_ENV"],"a") as f:
              for k,v in out.items():
                  print(f"::add-mask::{v}"); f.write(f"{k}={v}\n")
          print("credenciales OK")
          PYX

      - name: Aplicar migracion aditiva (avatar_key)
        run: python manage.py migrate photos --noinput

      - name: Distribucion de tamanos de cara
        run: |
          python manage.py shell <<'PYX'
          from django.db import connection
          SQL = '''
            WITH f AS (
              SELECT GREATEST(
                       (fe.bbox->>'x2')::float - (fe.bbox->>'x1')::float,
                       (fe.bbox->>'y2')::float - (fe.bbox->>'y1')::float
                     ) AS side
              FROM photos_faceembedding fe
              JOIN photos_photo p ON p.id = fe.photo_id
              JOIN events_event e ON e.id = p.event_id
              WHERE e.slug = 'surf-city-2026'
                AND p.status = 'approved'
                AND fe.bbox ? 'x1'
            )
            SELECT count(*) AS caras,
                   round(min(side)::numeric,1)  AS min,
                   round(percentile_cont(0.25) WITHIN GROUP (ORDER BY side)::numeric,1) AS p25,
                   round(percentile_cont(0.50) WITHIN GROUP (ORDER BY side)::numeric,1) AS mediana,
                   round(percentile_cont(0.75) WITHIN GROUP (ORDER BY side)::numeric,1) AS p75,
                   round(percentile_cont(0.90) WITHIN GROUP (ORDER BY side)::numeric,1) AS p90,
                   round(max(side)::numeric,1)  AS max
            FROM f;
          '''
          with connection.cursor() as c:
              c.execute(SQL)
              cols=[d[0] for d in c.description]
              print(" | ".join(cols))
              print(" | ".join(str(x) for x in c.fetchone()))

          # Cuántas caras pasarían cada umbral candidato
          for thr in (60, 80, 90, 110, 130, 160, 200):
              with connection.cursor() as c:
                  c.execute('''
                    SELECT count(*), count(DISTINCT p.id)
                    FROM photos_faceembedding fe
                    JOIN photos_photo p ON p.id = fe.photo_id
                    JOIN events_event e ON e.id = p.event_id
                    WHERE e.slug='surf-city-2026' AND p.status='approved' AND fe.bbox ? 'x1'
                      AND GREATEST((fe.bbox->>'x2')::float-(fe.bbox->>'x1')::float,
                                   (fe.bbox->>'y2')::float-(fe.bbox->>'y1')::float) >= %s
                  ''', [thr])
                  caras, fotos = c.fetchone()
                  print(f"umbral {thr:>4}px -> {caras:>6} caras en {fotos:>6} fotos")
          PYX
