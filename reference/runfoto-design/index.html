<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RunFoto — Design Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" />
<style>
  :root {
    --bg: #0A0A0B;
    --surface: #17171A;
    --surface-2: #1F1F23;
    --border: #2A2A2E;
    --text-1: #FAFAFA;
    --text-2: #A1A1A6;
    --text-3: #6B6B70;
    --orange: #FC5200;
    --cyan: #00D4FF;
    --green: #10B981;
    --amber: #F59E0B;
    --red: #EF4444;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; padding: 0; background: #0a0a0b; color: var(--text-1); font-family: var(--body); }
  * { box-sizing: border-box; }
  .rf { font-family: var(--body); color: var(--text-1); background: var(--bg); }
  .rf, .rf * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// Token-aware JSX loader. Fetches each file with the URL's ?t= token
// (preview auth), transforms via Babel, evaluates sequentially.
(async () => {
  const token = new URL(location.href).searchParams.get('t');
  const tq = token ? '?t=' + token : '';
  const files = [
    'design-canvas.jsx',
    'shared.jsx',
    'public-screens.jsx',
    'photographer-screen.jsx',
    'admin-screens.jsx',
    'main.jsx',
  ];
  for (const f of files) {
    try {
      const r = await fetch(f + tq);
      if (!r.ok) throw new Error(f + ': ' + r.status);
      const src = await r.text();
      const code = Babel.transform(src, { presets: ['react'], filename: f }).code;
      // eslint-disable-next-line no-eval
      (0, eval)(code + '\n//# sourceURL=' + f);
    } catch (e) {
      console.error('Failed loading', f, e);
      document.body.insertAdjacentHTML('beforeend',
        '<pre style="color:#EF4444;padding:24px;font-family:monospace;white-space:pre-wrap;">'
        + 'Error in ' + f + ':\n' + (e.stack || e.message) + '</pre>');
      return;
    }
  }
})();
</script>
</body>
</html>
