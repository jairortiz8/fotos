{# Bottom sheet de descarga. Usa el Alpine scope `photoSelection` del padre. #}
{% load i18n %}
<div x-show="sheetOpen" x-cloak class="fixed inset-0 z-40" x-transition.opacity
     @keydown.escape.window="sheetOpen = false">
  <div class="absolute inset-0 bg-ink-0/70 backdrop-blur-sm" @click="sheetOpen = false"></div>

  <div class="absolute left-0 right-0 bottom-0 bg-ink-0 border-t border-border rounded-t-[20px] px-6 py-4 md:max-w-lg md:left-1/2 md:-translate-x-1/2 md:rounded-2xl md:bottom-6"
       role="dialog" aria-modal="true" aria-label="{% trans 'Descargar fotos seleccionadas' %}"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-y-full md:translate-y-8 opacity-0"
       x-transition:enter-end="translate-y-0 opacity-100">
    <div class="w-9 h-1 bg-border rounded-full mx-auto mb-4 md:hidden"></div>

    {# Estado idle: confirmar descarga #}
    <template x-if="!zipStatus">
      <div>
        <h3 class="font-display font-bold text-2xl mb-1"><span x-text="sel.count"></span> {% trans "fotos seleccionadas" %}</h3>
        <p class="font-mono text-[11px] text-text-3 mb-5 tracking-[0.08em]">{% trans "Se descargará como ZIP en alta resolución" %}</p>
        <button @click="startDownload()" class="rf-cta rf-cta--lg rf-cta--full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          {% trans "Descargar ZIP" %}
        </button>
        <button @click="sheetOpen = false" class="rf-ghost rf-cta--full mt-2.5">{% trans "Cancelar" %}</button>
        <div class="mt-4 flex items-center gap-2.5 text-[11px] text-text-2 bg-ink-1 border border-border rounded-lg px-3 py-2.5">
          <span class="text-success"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
          {% trans "La descarga en alta resolución no tiene marca de agua." %}
        </div>
      </div>
    </template>

    {# Estado procesando #}
    <template x-if="zipStatus && (zipStatus.status === 'pending' || zipStatus.status === 'processing')">
      <div class="text-center py-6">
        <div class="inline-grid place-items-center w-14 h-14 rounded-full border-2 border-brand border-t-transparent animate-spin mb-5"></div>
        <h3 class="font-display font-bold text-xl mb-1">{% trans "Preparando tu descarga..." %}</h3>
        <p class="font-mono text-[11px] text-text-3">{% trans "Empaquetando las fotos en alta resolución" %}</p>
      </div>
    </template>

    {# Estado listo #}
    <template x-if="zipStatus && zipStatus.status === 'ready'">
      <div class="text-center py-4">
        <div class="inline-grid place-items-center w-14 h-14 rounded-full bg-success/15 text-success mb-4">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
        </div>
        <h3 class="font-display font-bold text-xl mb-1">{% trans "¡Descarga lista!" %}</h3>
        <p class="font-mono text-[11px] text-text-3 mb-5"><span x-text="zipStatus.total_size_mb"></span> MB · {% trans "El link expira en 1 hora" %}</p>
        <a :href="zipStatus.download_url" class="rf-cta rf-cta--lg rf-cta--full">{% trans "Guardar en dispositivo" %}</a>
      </div>
    </template>

    {# Estado error #}
    <template x-if="zipStatus && zipStatus.status === 'failed'">
      <div class="text-center py-6">
        <h3 class="font-display font-bold text-xl mb-1 text-danger">{% trans "No se pudo generar el ZIP" %}</h3>
        <p class="font-mono text-[11px] text-text-3 mb-5">{% trans "Probá de nuevo en unos minutos." %}</p>
        <button @click="zipStatus = null" class="rf-ghost rf-cta--full">{% trans "Reintentar" %}</button>
      </div>
    </template>
  </div>
</div>
