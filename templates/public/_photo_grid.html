{# Grid paginado con HTMX infinite scroll. Requiere `photos` (page) y `event`. #}
{% for photo in photos %}
  {% include "public/_photo_card.html" with photo=photo %}
{% endfor %}

{% if photos.has_next %}
<div hx-get="{% url 'events:gallery' slug=event.slug %}?page={{ photos.next_page_number }}{% if photographer %}&fotografo={{ photographer.id }}{% endif %}"
     hx-trigger="revealed"
     hx-swap="outerHTML"
     class="col-span-full h-px"></div>
{% endif %}
