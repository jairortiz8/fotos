{# Tarjeta de value-prop en el home. Params: title, sub, icon (bib|face|download|hires) #}
<div class="bg-ink-1 border border-border rounded-xl p-4">
  <div class="text-text-2 mb-2.5">
    {% if icon == "bib" %}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 3v4M16 3v4M8 12h8M8 16h5"/></svg>
    {% elif icon == "face" %}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"/></svg>
    {% elif icon == "download" %}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    {% else %}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-4-4-6 6"/></svg>{% endif %}
  </div>
  <div class="font-semibold text-[13px] text-text-1 mb-0.5">{{ title }}</div>
  <div class="text-[11px] text-text-3">{{ sub }}</div>
</div>
