{% load i18n %}
{% comment %}Contact-sheet del invitado: miniatura LIMPIA (sin logos) → abre el lightbox.{% endcomment %}
{% for photo in photos %}
  <button type="button" @click="open({{ photo.id }})"
          class="relative block aspect-square bg-ink-2 overflow-hidden focus:outline-none focus-visible:ring-2 focus-visible:ring-brand">
    <img src="{% url 'reviewer:clean_image' photo_id=photo.id size='thumb' %}" alt=""
         loading="lazy" decoding="async"
         class="w-full h-full object-cover hover:opacity-90 transition">
  </button>
{% endfor %}
