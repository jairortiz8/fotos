# ============================================================================
# Railway — configuración compartida del build/deploy de los 3 servicios.
#
# Los 3 servicios (web "fotos", worker, beat) apuntan al MISMO repo y usan
# ESTE railway.toml y ESTE Dockerfile. El rol lo decide la env var
# PROCESS_TYPE que lee scripts/entrypoint.sh:
#
#   fotos  (web)    →  PROCESS_TYPE=web    (default)  → migraciones + gunicorn
#   worker          →  PROCESS_TYPE=worker            → celery worker
#   beat            →  PROCESS_TYPE=beat              → celery beat
#
# Healthcheck: NO se define acá a propósito. railway.toml es global a los 3
# servicios, y worker/beat no sirven HTTP — un healthcheckPath haría fallar su
# deploy para siempre. El web igual queda protegido: Railway no promueve un
# deploy cuyo contenedor crashea al arrancar (p. ej. si fallan las migraciones).
#
# Postgres y Redis se aprovisionan desde el "+ New" del dashboard, no desde acá.
# ============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
